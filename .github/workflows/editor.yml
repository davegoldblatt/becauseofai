name: weekly editor
on:
  schedule:
    - cron: "7 13 * * 0"   # Sunday 06:07 America/Los_Angeles (PDT)
  workflow_dispatch:
    inputs:
      focus:
        description: "Extra scope for this run only (for example a ticket's list of entries to re-source). Leave blank for the standing brief."
        required: false
        default: ""
jobs:
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull the week's candidates (no model)
        run: node scripts/scout.ts --days 8
      - name: Weekly editorial run (Claude, subscription token)
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Run the weekly research brief in research/brief.md for becauseofai.org. Treat the window as the 12 months ending today.
            Inputs: data/entries/*.yaml, research/last-run.md, research/inbox.md, and this week's candidates in .scout/candidates.json.
            Deep-verify the two or three strongest candidates against their primary sources (WebFetch). Review existing entries for new data, follow-ups, retractions, and grades you would argue with; for each not-yet entry check whether what_would_change has happened.
            Output exactly as the brief says: new or changed entry files each with a history line dated today, a rewritten research/last-run.md under one page, and unqualified leads appended to research/inbox.md.
            Stamp rule: every entry you add, and every held entry you make publishable by adding its first primary source, must end with a history note whose last word is "unreviewed." (for example "Added by the weekly run; unreviewed."). The site shows an unreviewed marker while that is the latest note and the editor clears it by hand. Do not add the stamp when you only add notes, close a verify, or add a secondary source. Never change the rank of an existing entry.
            Extra scope for this run, if any (treat as part of the brief): ${{ github.event.inputs.focus }}
            Then run `npm run validate` (must pass), create branch editor/YYYY-MM-DD, commit, push, and open a pull request against main with `gh pr create` whose body summarises additions, changes, downgrades, rejections (and which of the four tests each failed), empty searches, and what a human should check. Do not merge.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 120
            --allowedTools "Read,Glob,Grep,Write,Edit,WebFetch,WebSearch,Bash(npm run validate),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(date:*)"
      - name: Validate and build the result
        run: npm run validate && npm run build
      - name: Merge the run's pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ]; then echo "no branch created this run; nothing to merge"; exit 0; fi
          if [ -z "$(git log "$BASE_SHA..HEAD" --oneline)" ]; then echo "branch $branch has no commits beyond $BASE_SHA; nothing to merge"; exit 0; fi
          git push -u origin "$branch" 2>/dev/null || true
          n=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            title=$(git log -1 --format=%s)
            body_file=.scout/pr-body.md
            [ -s "$body_file" ] || git log -1 --format=%B > "$body_file"
            if url=$(gh pr create --head "$branch" --base main --title "$title" --body-file "$body_file" 2>&1); then
              n=$(printf '%s' "$url" | grep -o 'pull/[0-9]*' | cut -d/ -f2)
              echo "opened #$n for $branch"
            else
              echo "pull request refused ($url); landing the branch on main directly"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
              git push origin --delete "$branch" || true
              echo "pushed $branch to main directly"
              exit 0
            fi
          fi
          gh pr merge "$n" --squash --delete-branch
          echo "merged #$n from $branch"
