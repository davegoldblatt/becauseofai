name: announce new entries
# Posts entries to X, Bluesky and Mastodon once their pages are live: the
# entries a merge adds (push), plus a daily drip of a few never-announced
# entries from the back catalogue (schedule). research/announced.json is the
# ledger of what has been posted, so nothing posts twice. Each network is
# skipped until its secrets exist, so this is a no-op until the accounts are
# set up. A dispatch with dry_run prints the posts instead of sending them.
on:
  push:
    branches: [main]
    paths: ["data/entries/**"]
  schedule:
    - cron: "7 16 * * *"   # 09:07 America/Los_Angeles (PDT): the back-catalogue drip
  workflow_dispatch:
    inputs:
      entry:
        description: "Entry id(s) to announce, comma-separated (leave blank with backfill to drip the back catalogue)"
        required: false
        default: ""
      backfill:
        description: "How many never-announced entries to post (used when entry is blank)"
        required: false
        default: "0"
      dry_run:
        description: "Print the posts instead of sending them"
        type: boolean
        default: true
concurrency:
  group: announce
  cancel-in-progress: false
jobs:
  find:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      posts: ${{ steps.find.outputs.posts }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Find the entries this push added and wait for their pages
        id: find
        run: |
          if [ -n "${{ github.event.inputs.entry }}" ]; then
            node scripts/announce.ts --entry "${{ github.event.inputs.entry }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            node scripts/announce.ts --backfill 3
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            node scripts/announce.ts --backfill "${{ github.event.inputs.backfill }}"
          else
            node scripts/announce.ts --before "${{ github.event.before }}" --after "${{ github.sha }}"
          fi
          echo "posts=$(jq -c . .announce/posts.json)" >> "$GITHUB_OUTPUT"
          echo "count=$(jq length .announce/posts.json)" >> "$GITHUB_OUTPUT"
  post:
    needs: find
    if: ${{ needs.find.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        post: ${{ fromJSON(needs.find.outputs.posts) }}
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
      X_APP_KEY: ${{ secrets.X_APP_KEY }}
      BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
      MASTODON_URL: ${{ secrets.MASTODON_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Fetch the share image for ${{ matrix.post.id }}
        run: node scripts/announce.ts --entry "${{ matrix.post.id }}" --no-wait
      - name: Show the post
        run: |
          echo "dry_run=$DRY_RUN  x=$([ -n "$X_APP_KEY" ] && echo keys || echo no-keys)  bluesky=$([ -n "$BLUESKY_IDENTIFIER" ] && echo keys || echo no-keys)  mastodon=$([ -n "$MASTODON_URL" ] && echo keys || echo no-keys)"
          jq -r '.[0].text' .announce/posts.json
          ls -l .announce/
      - name: Post to X
        if: ${{ env.DRY_RUN != 'true' && env.X_APP_KEY != '' }}
        uses: nearform-actions/github-action-notify-twitter@v1.3.0
        with:
          message: ${{ matrix.post.text }}
          twitter-app-key: ${{ secrets.X_APP_KEY }}
          twitter-app-secret: ${{ secrets.X_APP_SECRET }}
          twitter-access-token: ${{ secrets.X_ACCESS_TOKEN }}
          twitter-access-token-secret: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          media: ${{ matrix.post.image }}
          media-alt-text: ${{ matrix.post.alt }}
      - name: Post to Bluesky
        if: ${{ env.DRY_RUN != 'true' && env.BLUESKY_IDENTIFIER != '' }}
        uses: myConsciousness/bluesky-post@v6
        with:
          text: ${{ matrix.post.text }}
          link-preview-url: ${{ matrix.post.url }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_APP_PASSWORD }}
      - name: Post to Mastodon
        if: ${{ env.DRY_RUN != 'true' && env.MASTODON_URL != '' }}
        uses: cbrgm/mastodon-github-action@v2.2.5
        with:
          url: ${{ secrets.MASTODON_URL }}
          access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          message: ${{ matrix.post.text }}
          media-paths: ${{ matrix.post.image }}
          media-descriptions: ${{ matrix.post.alt }}
      - name: Mark ${{ matrix.post.id }} as posted
        if: ${{ env.DRY_RUN != 'true' && (env.X_APP_KEY != '' || env.BLUESKY_IDENTIFIER != '' || env.MASTODON_URL != '') }}
        run: mkdir -p posted && echo "${{ matrix.post.id }}" > "posted/${{ matrix.post.id }}"
      - uses: actions/upload-artifact@v4
        if: ${{ env.DRY_RUN != 'true' && (env.X_APP_KEY != '' || env.BLUESKY_IDENTIFIER != '' || env.MASTODON_URL != '') }}
        with:
          name: posted-${{ matrix.post.id }}
          path: posted/
          retention-days: 3
  record:
    needs: [find, post]
    if: ${{ always() && needs.find.outputs.count != '0' && needs.post.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: posted-*
          path: posted-all
          merge-multiple: true
      - name: Record the posted ids in the ledger and push
        run: |
          set -euo pipefail
          ids=$( (ls posted-all 2>/dev/null || true) | tr '\n' ',' | sed 's/,$//')
          if [ -z "$ids" ]; then echo "nothing was posted; ledger unchanged"; exit 0; fi
          node scripts/announce.ts --record "$ids"
          git config user.name "becauseofai announcer"
          git config user.email "announcer@becauseofai.org"
          git add research/announced.json
          git commit -m "Announcer: record posted entries ($ids)"
          for i in 1 2 3 4; do git fetch -q origin main && git rebase -q origin/main && git push -q origin HEAD:main && exit 0 || sleep 5; done
          echo "could not push the ledger after 4 tries"; exit 1
