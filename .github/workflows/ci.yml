name: validate and build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    # Research-run branches validate and build inside their own workflow and merge within seconds,
    # so a PR check on them only races the merge and fails on a deleted ref.
    if: ${{ github.event_name != 'pull_request' || (!startsWith(github.head_ref, 'scout/') && !startsWith(github.head_ref, 'editor/')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm run build
