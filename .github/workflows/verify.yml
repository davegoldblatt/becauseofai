name: verify
# The gate by hand, and the dispute handler (DAV-376).
#   dispatch mode=verify     run the gate over the entries named (or all, or changed)
#   dispatch mode=receipts   the drafter writes receipts for the entries named (migration, or an entry a person edited)
#   issues labeled "dispute" both vendors assess the dispute; the entry is amended, the issue closed, or the entry held
# Each run commits what it wrote to the branch it ran on. The verifier needs
# OPENAI_API_KEY (or CODEX_AUTH_JSON); without one, entries hold as
# verification-unavailable, which is the rule: never publish on one vendor.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify or receipts"
        type: choice
        options: [verify, receipts]
        default: verify
      entries:
        description: "Entry id(s), comma-separated; or all; or changed (since main)"
        required: false
        default: "changed"
      max:
        description: "Cap on entries this run (0 = no cap)"
        required: false
        default: "10"
      dry_run:
        description: "Print decisions, write nothing"
        type: boolean
        default: false
  issues:
    types: [labeled]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'dispute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      issues: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the vendor CLIs and pdftotext
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm install -g @openai/codex @anthropic-ai/claude-code
      - name: Receipts
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'receipts' }}
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.entries }}" in
            all) sel="--all" ;;
            changed) sel="--missing" ;;
            *) sel="--entry ${{ github.event.inputs.entries }}" ;;
          esac
          node scripts/receipts.ts $sel --max "${{ github.event.inputs.max }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Verify
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'verify' }}
        run: |
          set -euo pipefail
          case "${{ github.event.inputs.entries }}" in
            all) sel="--all" ;;
            changed) sel="--changed --base origin/main" ;;
            *) sel="--entry ${{ github.event.inputs.entries }}" ;;
          esac
          node scripts/verify.ts $sel --max "${{ github.event.inputs.max }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
      - name: Dispute
        if: ${{ github.event_name == 'issues' }}
        run: node scripts/dispute.ts --issue "${{ github.event.issue.number }}"
      - name: Validate
        run: npm run validate
      - name: Commit what the run wrote
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          set -euo pipefail
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "becauseofai gate"
          git config user.email "gate@becauseofai.org"
          git commit -m "Gate: ${{ github.event_name == 'issues' && format('dispute #{0}', github.event.issue.number) || format('{0} {1}', github.event.inputs.mode, github.event.inputs.entries) }}"
          for i in 1 2 3 4; do git fetch -q origin "${GITHUB_REF_NAME}" && git rebase -q "origin/${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0 || sleep 5; done
          echo "could not push after 4 tries"; exit 1
