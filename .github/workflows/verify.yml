name: verify
# The gate by hand, and the dispute handler (DAV-376).
#   dispatch mode=verify     run the gate over the entries named (or all, or changed)
#   dispatch mode=receipts   the drafter writes receipts for the entries named (migration, or an entry a person edited)
#   issues labeled "dispute" both vendors assess the dispute; the entry is amended, the issue closed, or the entry held
# Each run commits what it wrote to the branch it ran on. The verifier needs
# OPENAI_API_KEY (or CODEX_AUTH_JSON); without one, entries hold as
# verification-unavailable, which is the rule: never publish on one vendor.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "verify or receipts"
        type: choice
        options: [verify, receipts]
        default: verify
      entries:
        description: "Entry id(s), comma-separated; or all; or changed (since main)"
        required: false
        default: "changed"
      max:
        description: "Cap on entries this run (0 = no cap)"
        required: false
        default: "10"
      dry_run:
        description: "Print decisions, write nothing"
        type: boolean
        default: false
      force:
        description: "Re-verify entries that already pass"
        type: boolean
        default: false
      verifier:
        description: "vendor:model[:effort] to use instead of research/vendors.json (for measuring)"
        required: false
        default: ""
  issues:
    types: [labeled]
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'dispute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Writes land on a branch or in a pull request; nothing here pushes main.
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      ALLOW_CODEX_LOGIN_IN_CI: ${{ vars.ALLOW_CODEX_LOGIN_IN_CI }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the vendor CLIs and pdftotext
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm install -g @openai/codex @anthropic-ai/claude-code
      - name: Check the inputs
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ENTRIES: ${{ github.event.inputs.entries }}
          MAX: ${{ github.event.inputs.max }}
          VERIFIER: ${{ github.event.inputs.verifier }}
        run: |
          set -euo pipefail
          [[ "$ENTRIES" =~ ^(all|changed|[a-z0-9-]+(,[a-z0-9-]+)*)$ ]] || { echo "entries must be all, changed, or comma-separated ids"; exit 1; }
          [[ "$MAX" =~ ^[0-9]{1,3}$ ]] || { echo "max must be a number"; exit 1; }
          [[ -z "$VERIFIER" || "$VERIFIER" =~ ^(openai|anthropic):[A-Za-z0-9._-]+(:(low|medium|high|xhigh))?$ ]] || { echo "verifier must be vendor:model[:effort]"; exit 1; }
      - name: Receipts
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'receipts' }}
        env:
          ENTRIES: ${{ github.event.inputs.entries }}
          MAX: ${{ github.event.inputs.max }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(--max "$MAX"); [ "$DRY" = "true" ] && args+=(--dry-run)
          case "$ENTRIES" in all) args+=(--all) ;; changed) args+=(--missing) ;; *) args+=(--entry "$ENTRIES") ;; esac
          node scripts/receipts.ts "${args[@]}"
      - name: Verify
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'verify' }}
        env:
          ENTRIES: ${{ github.event.inputs.entries }}
          MAX: ${{ github.event.inputs.max }}
          DRY: ${{ github.event.inputs.dry_run }}
          FORCE: ${{ github.event.inputs.force }}
          VERIFIER: ${{ github.event.inputs.verifier }}
        run: |
          set -euo pipefail
          args=(--max "$MAX"); [ "$DRY" = "true" ] && args+=(--dry-run); [ "$FORCE" = "true" ] && args+=(--force); [ -n "$VERIFIER" ] && args+=(--verifier "$VERIFIER")
          case "$ENTRIES" in all) args+=(--all) ;; changed) args+=(--changed --base origin/main) ;; *) args+=(--entry "$ENTRIES") ;; esac
          node scripts/verify.ts "${args[@]}"
      - name: Dispute
        if: ${{ github.event_name == 'issues' }}
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || exit 1
          node scripts/dispute.ts --issue "$ISSUE"
      - name: Validate
        run: npm run validate
      - name: Land what the run wrote
        # Only entry files and records may change. A dispatch on a branch
        # commits to that branch; anything aimed at main goes through a pull
        # request that merges once validate and build pass, like the research runs.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          LABEL: "${{ github.event_name == 'issues' && format('dispute #{0}', github.event.issue.number) || format('{0} {1}', github.event.inputs.mode, github.event.inputs.entries) }}"
        run: |
          set -euo pipefail
          bad=$(git status --porcelain --untracked-files=all | cut -c4- | grep -vE '^(data/entries/[a-z0-9-]+\.yaml|data/verifications/[a-z0-9-]+/[A-Za-z0-9._-]+\.json)$' | grep -v '^$' || true)
          if [ -n "$bad" ]; then echo "the run touched files outside the data; nothing lands:"; echo "$bad"; exit 1; fi
          git add data/
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git config user.name "becauseofai gate"
          git config user.email "gate@becauseofai.org"
          git commit -m "Gate: $LABEL"
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            for i in 1 2 3 4; do git fetch -q origin "${GITHUB_REF_NAME}" && git rebase -q "origin/${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && exit 0 || sleep 5; done
            echo "could not push after 4 tries"; exit 1
          fi
          branch="gate/$(date -u +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"
          git checkout -q -b "$branch"
          git push -q -u origin "$branch"
          gh pr create --head "$branch" --base main --title "Gate: $LABEL" --body "Written by the verify workflow ($LABEL). Entry files and verification records only. The next scheduled scout run merges it once validate and build pass."
          echo "opened a pull request from $branch; the scheduled scout run lands it"
