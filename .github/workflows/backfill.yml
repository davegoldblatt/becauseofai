name: backfill
# DAV-475: fill in the past twelve months, one slice per run. The plan is
# scripts/backfill-slice.ts (inbox leads, announcements by sector and quarter,
# papers by week). Each run takes the next slice that has no heading in
# research/backfill-log.md, drafts at most eight entries under
# research/backfill-brief.md, and hands them to the same gate as the daily
# scout. When every slice has a heading the runs stop calling a model. To pause it, disable this workflow in the
# Actions tab; nothing else depends on it.
on:
  schedule:
    - cron: "37 1,5,9,15,19,22 * * *"   # six runs a day, away from the daily scout (12:07) and the Sunday editor (13:07)
  workflow_dispatch:
    inputs:
      slice:
        description: "Slice index to run (blank = next in the plan)"
        required: false
        default: ""
# One backfill run at a time: the next waits for this one to merge.
concurrency:
  group: boai-backfill
  cancel-in-progress: false
jobs:
  # Job 1: the drafting model, with its own token only. It may write entry
  # files and the backfill log; it never sees the verifier's secrets.
  draft:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.handoff.outputs.branch }}
    timeout-minutes: 80
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the reader's tools
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
      - name: Pick the slice and pull its candidates (no model)
        id: slice
        env:
          SLICE: ${{ github.event.inputs.slice }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          case "$SLICE" in
            ''|*[!0-9]*) node scripts/backfill-slice.ts --next --salt "$RUN_NUMBER" ;;
            *) node scripts/backfill-slice.ts --index "$SLICE" ;;
          esac
          kind=$(jq -r .kind .scout/slice.json)
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          if [ "$kind" = "done" ]; then echo "every slice in the plan has a log entry; nothing to do"; exit 0; fi
          index=$(jq -r .index .scout/slice.json)
          echo "index=$index" >> "$GITHUB_OUTPUT"
          echo "label=$(jq -r .label .scout/slice.json)" >> "$GITHUB_OUTPUT"
          # A branch left by an earlier try at this slice would refuse this run's push.
          git ls-remote --heads origin "backfill/*-$index" | awk '{print $2}' | sed 's|refs/heads/||' | while read -r old; do
            if [ -n "$old" ]; then git push origin --delete "$old" && echo "removed the stale branch $old"; fi
          done
          if [ "$kind" = "academic" ]; then
            node scripts/scout.ts --days "$(jq -r .days .scout/slice.json)" --until "$(jq -r .to .scout/slice.json)"
          fi
      - name: Triage and draft (Claude, subscription token)
        if: ${{ steps.slice.outputs.kind != 'done' }}
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Run one backfill slice for becauseofai.org. Follow research/backfill-brief.md exactly.
            Your slice is in .scout/slice.json: slice ${{ steps.slice.outputs.index }}, "${{ steps.slice.outputs.label }}".
            Every entry you draft carries receipts and a rationale; a second model from another vendor will check every receipt against the source, and the entry is held if any fails.
            The shell only runs single plain commands (no cd, pipes, loops, or chaining): read one source per call with `npm run read -- <url>` and use the Read, Grep, and Glob tools for files. A refused command is never a reason to stop; run the plain form.
            Finish as the brief says: the log section, validate, then commit and push the branch. Do not open a pull request and do not merge anything.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 220
            --allowedTools "Read,Glob,Grep,Write,Edit,WebFetch,WebSearch,Bash(npm run validate),Bash(npm run read:*),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(date:*)"
            --disallowedTools "Agent,Task"
      - name: Hand the branch to the gate
        id: handoff
        env:
          KIND: ${{ steps.slice.outputs.kind }}
          INDEX: ${{ steps.slice.outputs.index }}
        run: |
          set -euo pipefail
          if [ "$KIND" = "done" ]; then echo "branch=" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A finished run is a branch with a commit and a log heading for this
          # slice, even when it drafted nothing. Anything less is a failed run:
          # the slice stays open and comes round again.
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ] || [ "$branch" = "HEAD" ] || [ -z "$(git log "${{ github.sha }}..HEAD" --oneline)" ]; then echo "::error::the drafter left no commit on a branch for slice $INDEX"; exit 1; fi
          if ! grep -qE "^## .*slice $INDEX:" research/backfill-log.md; then echo "::error::research/backfill-log.md has no heading for slice $INDEX"; exit 1; fi
          git push -u origin "$branch"
          [ "$(git ls-remote --heads origin "$branch" | cut -f1)" = "$(git rev-parse HEAD)" ] || { echo "::error::the branch on GitHub is not this run's commit"; exit 1; }
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

  # Job 2: the gate and the merge, from a fresh checkout of what job 1 pushed.
  # Nothing from the drafting job's working tree, git configuration, or
  # processes reaches this job; only the commits on the branch do, and only
  # entry files and the backfill log may differ from the base.
  gate:
    needs: draft
    if: ${{ needs.draft.outputs.branch != '' }}
    runs-on: ubuntu-latest
    # Every job that uses the robot's ChatGPT login waits for the others: a
    # login refreshed by one run kills the copy another run is holding.
    concurrency:
      group: boai-codex-login
      cancel-in-progress: false
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
    env:
      BRANCH: ${{ needs.draft.outputs.branch }}
      BASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.draft.outputs.branch }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Refuse anything the draft changed outside the data
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          bad=$(git diff --name-only "$BASE_SHA" HEAD | grep -vE '^(data/entries/[a-z0-9-]+\.yaml|research/backfill-log\.md)$' || true)
          if [ -n "$bad" ]; then echo "the draft touched files outside the allowlist; nothing merges:"; echo "$bad"; exit 1; fi
          # The gate runs the base commit's code, whatever the branch carries.
          git checkout "$BASE_SHA" -- . ':!data/entries' ':!research/backfill-log.md'
          git status --porcelain
      - run: npm ci
      - name: Install the verifier's tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm install -g @openai/codex@0.166.0
      - name: Fetch the robot's ChatGPT login (Dave's personal ChatGPT, from private storage)
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/ci/codex-login.sh fetch boai
      - name: The gate (second vendor, independent)
        env:
          ALLOW_CODEX_LOGIN_IN_CI: ${{ vars.ALLOW_CODEX_LOGIN_IN_CI }}
          SUBSTACK_VIA: https://punditclaims.ai
        run: |
          set -euo pipefail
          # DAV-469: a bounded run. Too many changed entries means nothing is verified
          # or merged, so the gate's quota on the personal ChatGPT login stays small.
          n=$(git diff --name-only "$BASE_SHA" HEAD -- data/entries | wc -l | tr -d ' ')
          if [ "$n" -gt 10 ]; then echo "::error::this run changed $n entry files (budget 10); nothing is verified or merged"; exit 1; fi
          node scripts/verify.ts --changed --base "$BASE_SHA" --drafter "anthropic:claude-sonnet-5-5" --max 0 --force
          # A verifier that did not answer is an outage, not a verdict: merge nothing,
          # so the slice stays open and is drafted and checked again.
          if git diff --name-only "$BASE_SHA" -- data/entries | xargs -r grep -lE "^  reason: verification-unavailable" 2>/dev/null | grep -q .; then echo "::error::the verifier was unavailable for at least one entry; nothing merges"; exit 1; fi
          git checkout -- . ':!data/' || true
          bad=$(git status --porcelain --untracked-files=all | cut -c4- | grep -vE '^(data/entries/[a-z0-9-]+\.yaml|data/verifications/[a-z0-9-]+/[A-Za-z0-9._-]+\.json)$' | grep -v '^$' || true)
          if [ -n "$bad" ]; then echo "the gate wrote outside the data:"; echo "$bad"; exit 1; fi
          if ! git diff --quiet -- data/ || [ -n "$(git status --porcelain data/)" ]; then
            git config user.name "becauseofai gate"
            git config user.email "gate@becauseofai.org"
            git add data/
            git commit -m "Gate: verify the run's entries"
            git push origin "HEAD:$BRANCH"
          fi
      - name: Save the robot's ChatGPT login if the run refreshed it
        if: always()
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: bash scripts/ci/codex-login.sh save boai
      - name: Validate and build the result
        run: npm run validate && npm run build
      - name: Merge the run's pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Only this repository's own pull request for the branch, and only at the
          # commit this job verified: a pull request from a fork that borrows the
          # branch name is never picked up, and nothing pushed since is merged.
          sha=$(git rev-parse HEAD)
          [ "$(git rev-parse "origin/$BRANCH")" = "$sha" ] || { echo "::error::origin/$BRANCH is not the commit this job verified"; exit 1; }
          n=$(gh pr list --head "$BRANCH" --base main --state open --json number,isCrossRepository,headRefOid -q '[.[] | select(.isCrossRepository == false)] | .[0].number // empty')
          if [ -z "$n" ]; then
            title=$(git log --reverse --format=%s "$BASE_SHA..HEAD" | head -1)
            body_file="$RUNNER_TEMP/pr-body.md"
            git log "$BASE_SHA..HEAD" --format=%B > "$body_file"
            if url=$(gh pr create --head "$BRANCH" --base main --title "$title" --body-file "$body_file" 2>&1); then
              n=$(printf '%s' "$url" | grep -o 'pull/[0-9]*' | cut -d/ -f2)
              echo "opened #$n for $BRANCH"
            else
              echo "pull request refused ($url); landing the branch on main directly"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
              git push origin --delete "$BRANCH" || true
              exit 0
            fi
          fi
          gh pr merge "$n" --squash --delete-branch --match-head-commit "$sha"
          echo "merged #$n from $BRANCH at $sha"
