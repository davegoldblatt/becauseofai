name: daily scout
on:
  schedule:
    - cron: "7 12 * * *"   # 05:07 America/Los_Angeles (PDT); 04:07 in winter
  workflow_dispatch:
    inputs:
      days:
        description: "How many days back to scan"
        default: "2"
jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Pull candidates (no model)
        run: node scripts/scout.ts --days ${{ github.event.inputs.days || '2' }}
      - name: Triage and draft (Claude, subscription token)
        uses: anthropics/claude-code-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          show_full_output: true
          prompt: |
            Run the daily scout for becauseofai.org. Follow research/scout-brief.md exactly.
            Today's candidates are in .scout/candidates.json (already generated in this checkout).
            Every entry you draft carries receipts and a rationale as the brief describes; a second model from another vendor will check every receipt against the source, and the entry is held if any fails.
            Finish by opening the pull request described in the brief. Do not merge anything.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 100
            --allowedTools "Read,Glob,Grep,Write,Edit,WebFetch,WebSearch,Bash(npm run validate),Bash(git checkout:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(date:*)"
      - name: Refuse anything the run changed outside the data
        env:
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          { git diff --name-only "$BASE_SHA" HEAD; git status --porcelain | cut -c4-; } | sort -u > /tmp/touched.txt
          bad=$(grep -vE '^(data/entries/[a-z0-9-]+\.yaml|data/verifications/[a-z0-9-]+/[A-Za-z0-9._-]+\.json|research/inbox\.md|research/last-run\.md|\.scout/.*)$' /tmp/touched.txt | grep -v '^$' || true)
          if [ -n "$bad" ]; then echo "the run touched files outside the allowlist; nothing merges:"; echo "$bad"; exit 1; fi
          # The gate runs the code from the commit this job started on, with fresh dependencies.
          git checkout "$BASE_SHA" -- scripts src tests package.json package-lock.json research/vendors.json research/brief.md research/scout-brief.md .github
          rm -rf node_modules && npm ci
      - name: Install the verifier's tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q poppler-utils
          npm install -g @openai/codex
      - name: The gate (second vendor, independent)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          set -euo pipefail
          node scripts/verify.ts --changed --base "${{ github.sha }}" --drafter "anthropic:claude-sonnet-5-5" --max 0
          if ! git diff --quiet -- data/; then
            git config user.name "becauseofai gate"
            git config user.email "gate@becauseofai.org"
            git add data/
            git commit -m "Gate: verify the run's entries"
          fi
      - name: Validate and build the result
        run: npm run validate && npm run build
      - name: Merge the run's pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=$(git rev-parse --abbrev-ref HEAD)
          if [ "$branch" = "main" ]; then echo "no branch created this run; nothing to merge"; exit 0; fi
          if [ -z "$(git log "$BASE_SHA..HEAD" --oneline)" ]; then echo "branch $branch has no commits beyond $BASE_SHA; nothing to merge"; exit 0; fi
          git push -u origin "$branch" 2>/dev/null || true
          n=$(gh pr list --head "$branch" --state open --json number -q '.[0].number')
          if [ -z "$n" ]; then
            title=$(git log -1 --format=%s)
            body_file=.scout/pr-body.md
            [ -s "$body_file" ] || git log -1 --format=%B > "$body_file"
            if url=$(gh pr create --head "$branch" --base main --title "$title" --body-file "$body_file" 2>&1); then
              n=$(printf '%s' "$url" | grep -o 'pull/[0-9]*' | cut -d/ -f2)
              echo "opened #$n for $branch"
            else
              echo "pull request refused ($url); landing the branch on main directly"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
              git push origin --delete "$branch" || true
              echo "pushed $branch to main directly"
              exit 0
            fi
          fi
          gh pr merge "$n" --squash --delete-branch
          echo "merged #$n from $branch"
