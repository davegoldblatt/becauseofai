    url: https://clinicaltrials.gov/study/NCT06815562
    type: primary
conflicts: >-
  The sponsor is Outcome Referrals, Inc., a company that makes the Placement Success Predictor, and the study is funded by
  an NIH small-business grant; the results are the sponsor's own registry posting.
what_would_change: "A peer-reviewed analysis with a between-group test and larger samples showing a difference in symptom change, in either direction."
notes: >-
  verify: the registry posts group means and standard deviations for the primary outcome but no between-group statistical analysis.
  verify: the child and adolescent samples are reported as separate arms (35 and 27 children, 76 and 75 adolescents); the entry states no pooled effect.
  verify: window is pre because the study ended 2026-01-26 and the benefit, if any, spans a period that starts more than twelve months before this entry.
