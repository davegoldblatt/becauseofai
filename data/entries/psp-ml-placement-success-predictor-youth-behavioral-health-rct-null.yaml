id: psp-ml-placement-success-predictor-youth-behavioral-health-rct-null
section: not-because
rank: 32
headline: >-
  A machine-learning tool that scored each young person's likelihood of success in different care placements showed no
  better symptom change in a randomized trial: children's symptom z-scores changed by 0.45 with the tool against 0.14
  without it, where higher means worse.
impact: "No improvement: 0.45 vs 0.14 (higher is worse)"
impact_number: "0.45"
impact_label: "symptom z-score change in children with the tool, vs 0.14 without (higher is worse)"
summary: >-
  The Placement Success Predictor efficacy study randomized youth in behavioral-health care to have site-specific
  machine-learning placement scores shown to the clinical team or not, and compared the change in a parent-and-youth-rated
  symptom scale (TOP-CS) 60 to 120 days later.
caveat: >-
  This is the sponsor's own registry posting with no between-group test posted, in small child and adolescent samples
  analysed separately, so it shows no benefit rather than a measured harm.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Site-specific machine-learning placement success scores provided to the clinical team vs no scores generated, youth randomized within a child sample and an adolescent sample"
effect:
  relative: null
  absolute: "Mean change in average symptom z-score (negative is improvement): children 0.45 with the tool vs 0.14 without; adolescents −0.06 with the tool vs −0.20 without"
reach: "213 youth randomized to the efficacy study"
dates:
  achieved_start: 2025-02-03
