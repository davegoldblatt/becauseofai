id: fasikl-felix-neuroai-wristband-essential-tremor-tranquil-sham-rct
section: because
rank: 143
headline: >-
  Because of AI, a wrist-worn neurostimulator that adapts its stimulation with an AI algorithm improved essential-tremor
  daily-living scores by 6.9 points at 90 days against 2.7 points with a sham device, in a randomized trial of 125 people.
impact: "−6.9 vs −2.7 tremor-disability points at 90 days"
impact_number: "−4.2"
impact_label: "TETRAS daily-living points more improvement than a sham device at 90 days"
summary: >-
  The TRANQUIL trial randomized adults with upper-limb essential tremor 2:1 to the Felix NeuroAI Wristband or an identical
  sham device and compared the change in the TETRAS modified activities-of-daily-living score at day 90 (posted results).
caveat: >-
  This is the sponsor's own ClinicalTrials.gov results posting, not a peer-reviewed paper, and the arms differ by whether
  the device stimulated at all, so the AI adaptation is bundled with the stimulation itself.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: bundled
  window: pre
comparison: "Felix NeuroAI Wristband (stimulation adapted by an AI algorithm) vs a sham device with the same appearance and components that delivers no treatment, 2:1 randomization, participants and outcome assessors masked"
effect:
  relative: null
  absolute: "Change in TETRAS mADL score at day 90 of −6.9 (Felix) vs −2.7 (sham); net difference −4.2 points, p<0.0001, where a lower score is milder tremor"
reach: "125 people with upper-limb essential tremor randomized in a multi-centre, multi-region trial"
