  verify: the analysis posted is a two-sided t-test on 62 and 36 participants at day 90, fewer than the 125 randomized; the registry shows 83 and 42 starting.
  verify: window is pre because primary data collection ended more than twelve months before this entry was added; results were posted 2026-07-09.
