conflicts: >-
  The trial sponsor and responsible party is Fasikl Inc., the maker of the Felix NeuroAI Wristband, and the results were
  posted by the sponsor; no independent analysis is shown.
what_would_change: "A peer-reviewed report with independent analysis, or a trial with an active-stimulation control that is not AI-adapted."
notes: >-
