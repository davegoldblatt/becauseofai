headline: >-
  Every Cure's AI ranks 75 million drug–disease pairs; its patient wins so far
  came from clinicians or predate the window.
impact: "$76M ARPA-H; 10 programs"
summary: >-
  The nonprofit reviewed 9,000+ repurposing opportunities in 2025 and has ten
  active programs; the AI-identified adalimumab–Castleman case (NEJM) was
  February 2025, and the DFMO–Bachmann-Bupp program (six treated, five children
  improved) originated with the researchers who identified the disease.
caveat: >-
  No in-window patient outcome attributable to an AI-identified match yet.
