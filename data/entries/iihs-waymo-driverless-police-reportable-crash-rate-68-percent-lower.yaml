id: iihs-waymo-driverless-police-reportable-crash-rate-68-percent-lower
section: because
rank: 139
headline: >-
  Because of Waymo's driverless AI driver, an independent IIHS study found a 68% lower
  police-reportable crash rate than human drivers in the same areas.
impact: "68% lower crash rate"
impact_number: "68%"
impact_label: "lower police-reportable crash rate than human drivers, Waymo driverless, IIHS preprint"
summary: >-
  The Insurance Institute for Highway Safety cleaned federal crash reports for driverless
  vehicles, coded which would have been reported to police, and compared Waymo's driverless
  miles in San Francisco, Phoenix, Los Angeles and Austin with human drivers in the same
  areas and years. Waymo's rate was 68% lower overall, lower in three of four cities.
caveat: >-
  A preprint submitted to a journal, not yet peer reviewed. It covers 2021 to 2024 and one
  operator, uses Waymo's own mileage figures, and rests on the authors' coding of crash
  narratives. Austin was not lower (small sample), and the authors say the results apply
  only to the vehicles studied.
