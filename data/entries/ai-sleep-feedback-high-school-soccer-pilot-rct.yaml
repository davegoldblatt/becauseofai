id: ai-sleep-feedback-high-school-soccer-pilot-rct
section: because
rank: 62
headline: >-
  Because of AI, high school female soccer players who got GPT-4o personalized sleep feedback had 2% higher sleep efficiency
  than players given generic sleep information, in a pilot randomized trial of 25 players.
impact: "+2% sleep efficiency (pilot)"
impact_number: "+2%"
impact_label: "sleep efficiency with AI personalized feedback vs generic sleep information, pilot of 25 players"
summary: >-
  A single high school soccer team was randomized to daily GPT-4o feedback built from Fitbit sleep data or to
  non-personalized sleep information, and change in sleep efficiency was compared over four weeks.
caveat: >-
  A pilot of one team that was registered after it ended; the sleep efficiency difference was borderline, most other sleep
  outcomes did not differ, and the authors say it is not evidence of established effectiveness.
