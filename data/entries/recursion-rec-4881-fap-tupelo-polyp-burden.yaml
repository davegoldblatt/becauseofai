id: recursion-rec-4881-fap-tupelo-polyp-burden
section: because
rank: 88
headline: >-
  Because Recursion's AI screen pointed a shelved Takeda drug at familial adenomatous polyposis, 12 evaluable
  patients in the open-label TUPELO trial had a median 43% reduction in total polyp burden after 12 weeks.
impact: "43% median polyp burden reduction"
impact_number: "43%"
impact_label: "median reduction in polyp burden at 12 weeks on REC-4881, 12 FAP patients, no control arm"
summary: >-
  Recursion reports that REC-4881, an oral MEK1/2 inhibitor it in-licensed from Takeda after its AI-driven phenotypic screen
  linked MEK1/2 inhibition to APC loss, reduced total polyp burden in patients with familial adenomatous polyposis in the
  phase 2 portion of the single-arm TUPELO trial.
caveat: >-
  A single-arm, open-label company announcement on 12 evaluable patients with no concurrent control; the natural-history
  comparison is the company's own registry analysis, and the dates of the study period are not stated.
domain: medicine
ai_type: classic-ml
grades:
  evidence: C
  attribution: bundled
  window: null
comparison: "Change from each patient's own baseline polyp burden; company-run natural-history analysis of an untreated registry (n=55) as context, no concurrent control arm"
effect:
  relative: "median 43% reduction in total polyp burden after 12 weeks of treatment"
  absolute: "75% of evaluable patients showed a reduction in polyp burden after 12 weeks of therapy"
reach: "12 efficacy-evaluable patients with familial adenomatous polyposis in the TUPELO trial"
