id: gb-0895-phase-3
section: not-yet
rank: 2
headline: >-
  An AI-optimized antibody for severe asthma is in Phase 3 — no AI-designed
  antibody has been approved.
impact: "Phase 3 enrolling"
summary: >-
  Generate:Biomedicines' GB-0895 started the placebo-controlled SOLAIRIA-1
  Phase 3 study on December 3, 2025 (786 patients planned, dosed every six
  months, primary endpoint annualized exacerbation rate over 52 weeks); a
  companion SOLAIRIA-2 study is listed by the sponsor.
caveat: >-
  The antibody was optimized with AI, not designed from scratch; SOLAIRIA-1's
  primary completion is estimated for December 2028.
