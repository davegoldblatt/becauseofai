  window: null
comparison: "Manual waste assessment; in one trial the AI-led process was faster and identified more surplus, per the report (no figures for the redistributed tonnage baseline)"
effect:
  relative: null
  absolute: "201.9 tonnes of surplus redistributed, equivalent to 480,529 meals, supporting an estimated 94,133 people across 787 charities and community organisations"
