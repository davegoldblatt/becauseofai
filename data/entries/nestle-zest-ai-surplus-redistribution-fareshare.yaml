id: nestle-zest-ai-surplus-redistribution-fareshare
section: because
rank: 78
headline: >-
  Because of Zest's AI surplus-matching, a UK consortium redistributed 201.9 tonnes of
  Nestlé factory surplus to charities, supporting an estimated 94,133 people.
impact: "201.9 tonnes of surplus food redistributed to people"
impact_number: "201.9 t"
impact_label: "of Nestlé factory surplus sent to charities instead of waste, consortium says"
summary: >-
  A nine-partner UK consortium reports that Zest's AI, built on Google Cloud, mapped waste on
  a Nestlé production line and matched surplus from four sites to FareShare and Company Shop
  Group, redistributing 201.9 tonnes over a 16-month pilot.
caveat: >-
  A trade-press report of the consortium's own results. The same article gives 480,529
  meals and 499,863 meals, no baseline for how much surplus would have been redistributed
  without the AI, and "supported people" is an estimate by the consortium.
