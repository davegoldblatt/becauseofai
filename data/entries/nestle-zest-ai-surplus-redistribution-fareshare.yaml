conflicts: >-
  The source is a trade-press report of the consortium's own announcement; the consortium
  includes Nestlé UK & Ireland and the AI vendor Zest, whose chief executive is quoted, and
  the project was funded by a match-funded Innovate UK BridgeAI grant. The consortium's own
  page could not be read. No independent audit.
what_would_change: "The Sustainable Ventures white paper's data on tonnage redistributed in the period before the AI, and how meals and people supported were estimated."
notes: >-
  verify: the article states a 16-month project but no calendar dates, so achieved dates and
