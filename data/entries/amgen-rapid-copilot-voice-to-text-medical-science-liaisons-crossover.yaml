id: amgen-rapid-copilot-voice-to-text-medical-science-liaisons-crossover
section: because
rank: 87
headline: >-
  In a randomized crossover trial of 27 Amgen medical science liaisons, AI voice-to-text (Microsoft Copilot) raised
  their documentation satisfaction score from 2.541 to 3.304 against manual CRM entry.
impact: "Documentation satisfaction up 0.763"
impact_number: "+0.763"
impact_label: "points on the documentation satisfaction score with AI voice-to-text"
summary: >-
  Medical science liaisons documented field conversations for four weeks with AI voice-to-text and four weeks by manual
  CRM entry, in random order, and rated the experience.
caveat: >-
  The outcome is self-reported satisfaction; expert-rated insight quality and interaction counts did not improve, and
  satisfaction was lower among Japanese and Korean speakers because transcription was less accurate.
domain: work
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "AI voice-to-text (Microsoft Copilot) vs existing practice of manual CRM entry, within the same 27 liaisons in a two-period crossover"
effect:
  relative: null
  absolute: "composite satisfaction score mean 3.304 with AI voice-to-text versus 2.541 with manual entry, difference +0.763 (95% CI 0.187 to 1.339)"
reach: "27 medical science liaisons across six Amgen Asia-Pacific affiliates"
