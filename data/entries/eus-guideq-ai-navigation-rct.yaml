id: eus-guideq-ai-navigation-rct
section: because
rank: 46
headline: >-
  Because of AI, endoscopists using real-time voice-guided navigation covered more of the guideline-recommended
  biliopancreatic scanning stations in a randomized trial of 266 patients, though procedures took longer.
impact: "More complete endosonography scans (RCT)"
impact_number: "1.00 vs 0.81"
impact_label: "median station completeness, AI-assisted vs standard endoscopic ultrasound"
summary: >-
  Patients were randomized to endoscopic ultrasound with or without the EUS-GUIDEQ navigation system, and blinded
  reviewers scored the completeness of standardized scanning stations from recorded videos.
caveat: >-
  Only the abstract could be read; the outcome is a process-quality measure of the examination, not a diagnosis or
  patient outcome, and the device increased procedure time.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
