id: milvue-ai-paediatric-fracture-ed-leipzig-recall-null
section: not-because
rank: 28
headline: >-
  AI fracture detection did not significantly cut next-day diagnostic revisions
  (8.6% without AI, 5.7% with AI) among 667 children imaged out of hours in a
  German paediatric emergency department.
impact: "No significant cut in next-day recalls (alternating-day study)"
impact_number: "8.6% vs 5.7%"
impact_label: "next-day diagnostic revisions without vs with AI fracture detection, not significant"
summary: >-
  In a prospective, quasi-randomised study at a tertiary hospital, children aged
  2 to 18 having limb radiographs on call were read with or without a commercial
  AI fracture detector on alternating days; revisions leading to recall, therapy
  changes, length of stay and senior consultation did not differ significantly.
caveat: >-
  The study was exploratory and not powered for small differences, allocation was
  by alternating day (with technical outages moved into the no-AI arm), and the
  hospital already re-reads every film the next day, which limits what AI can add.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Junior-resident reading of paediatric limb radiographs with the Milvue AI fracture-detection overlay vs without, alternating days, same emergency department and next-day radiologist consensus as reference"
effect:
  relative: "Risk ratio for diagnostic revision with AI 0.66 (95% CI 0.37–1.19), not significant"
  absolute: "Diagnostic revisions 8.6% without AI vs 5.7% with AI; therapeutic changes 2.0% vs 0.4% (p = 0.10)"
reach: "667 enrolled children and adolescents (median age 11.0 years) at one tertiary referral hospital, out-of-hours care, 2025"
dates:
  achieved_start: 2025-04
  achieved_end: 2025-09
  published: 2026-07-29
  added: 2026-11-23
  updated: 2026-11-23
sources:
  - title: "BMC Emergency Medicine: Artificial intelligence for pediatric fracture detection: impact on diagnostic revisions and patient recall rates in a tertiary emergency setting (Deffaa, Pape et al.)"
    url: https://doi.org/10.1186/s12873-026-01697-3
    doi: 10.1186/s12873-026-01697-3
    type: primary
conflicts: >-
  The tool is a commercial CE-marked product (Milvue, Paris); the text read does
  not state funding or vendor ties.
what_would_change: "A confirmatory, adequately powered trial in a setting without next-day expert re-reading that shows fewer recalls or therapy changes with the aid."
notes: >-
  Filed under not-because: the primary endpoint (diagnostic revision leading to
  recall) did not differ significantly. Allocation was every second day, so
  evidence is graded B rather than A.
  verify: funding and competing-interest statement, not in the text read.
related: [gleamer-boneview-paediatric-ed-fracture-exclusion]
