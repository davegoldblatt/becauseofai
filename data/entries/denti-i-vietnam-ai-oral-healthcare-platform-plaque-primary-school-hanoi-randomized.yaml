id: denti-i-vietnam-ai-oral-healthcare-platform-plaque-primary-school-hanoi-randomized
section: because
rank: 160
headline: >-
  Because of an AI-driven oral healthcare platform, Hanoi primary school children who used it had lower dental plaque
  scores than before, in a randomized study that compared them with children given pamphlets.
impact: "Lower plaque scores in Hanoi schoolchildren"
impact_number: "2.49 to 1.70"
impact_label: "OHI-S plaque score in the AI platform group, baseline to follow-up"
summary: >-
  Primary school students in Hanoi were randomly assigned to the Denti-i Vietnam AI platform or pamphlet-based oral
  health education, and plaque (OHI-S), behaviours and caries were assessed at baseline and after the intervention.
caveat: >-
  Only the abstract could be read and it is cut off before the comparison-group result and the p-values, so the
  difference between arms is not stated here.
