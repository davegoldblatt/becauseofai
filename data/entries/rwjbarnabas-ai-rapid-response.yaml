id: rwjbarnabas-ai-rapid-response
section: because
rank: 22
headline: >-
  Because of AI, in-hospital deaths among high-risk ward patients fell from
  23.1% to 18.6% after 11 hospitals let a deterioration model page the rapid
  response team automatically (adjusted odds ratio 0.82).
impact: "4.5 points fewer in-hospital deaths"
impact_number: "−4.5 points"
impact_label: "in-hospital deaths among flagged ward patients (18.6% vs 23.1%)"
summary: >-
  A staggered pre/post study (NEJM AI, September 2026) of 23,132 adult
  medical-surgical admissions flagged by the Epic Deterioration Index across an
  11-hospital New Jersey system found that, once the score triggered EHR alerts
  and automatic push notifications to the rapid response team, team activations
  rose and risk-adjusted in-hospital mortality fell, with no rise in
  escalations of care.
caveat: >-
  Not randomized and with no concurrent control: the comparison is before
  versus after rollout over October 2022 to August 2024, so falling post-COVID
  mortality or other changes could account for part of the drop; only the
  abstract could be read.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: bundled
  window: pre
comparison: "Patients with a Deterioration Index of 60 or more before vs after implementation of model-triggered alerts plus automatic rapid response team notification, staggered across 11 hospitals, risk-adjusted"
effect:
  relative: "Adjusted odds of in-hospital death 0.82 (95% CI 0.74–0.91); rapid response activations 37.5% vs 25.3% (adjusted OR 1.74)"
  absolute: "In-hospital mortality 18.6% vs 23.1%, a difference of −4.5 percentage points (95% CI −5.6 to −3.5), unadjusted"
reach: "23,132 adult medical-surgical admissions with a Deterioration Index of 60 or more at 11 acute care hospitals"
dates:
  achieved_start: null
