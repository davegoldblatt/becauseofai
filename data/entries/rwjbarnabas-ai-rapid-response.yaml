sources:
  - title: "NEJM AI: Implementation of an AI-Triggered Rapid Response — Association with Mortality (Nahass et al.), abstract via Europe PMC"
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/article/MED/42932707?resultType=core&format=xml
    doi: 10.1056/AIoa2500973
    type: primary
conflicts: >-
  The authors are RWJBarnabas Health and Rutgers staff evaluating their own
  system's rollout of a vendor (Epic) model; the abstract read carries no
  funding or disclosure statement.
what_would_change: "A concurrent control (a stepped-wedge analysis by hospital and month, or a randomized rollout), or the full text showing the staggered start dates and per-hospital results."
notes: >-
  The post-implementation period begins at a different date in each hospital
  and the abstract does not give the dates, so the achieved start is left
  unverified; the study window runs from 1 October 2022 (which includes the
  pre-period) to 30 August 2024. Window pre either way.
  Evidence B argued: a large health-system cohort with a before-period benchmark
  and risk adjustment, but no randomization and no concurrent control. If the
  full text shows the staggered rollout was not used as a control, C is
  defensible.
  Placed as reasonable: the NEJM AI page returns HTTP 403 to the gate's reader
  and the paper is not in PMC. The full text would raise it.
  Compare uva-comet-deterioration-null, where a different deterioration score
  without automatic team activation did not reduce deaths.
  verify: funding and disclosures in the full text.
related: [uva-comet-deterioration-null]
