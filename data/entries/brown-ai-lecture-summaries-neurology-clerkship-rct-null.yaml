id: brown-ai-lecture-summaries-neurology-clerkship-rct-null
section: not-because
rank: 17
headline: >-
  Medical students randomized to receive an AI-generated lecture summary before each quiz scored higher in 9 of 11
  clerkship cohorts, but the difference between students was only +0.28 of 10 points and not significant.
impact: "Small, non-significant quiz gain (RCT)"
impact_number: "+0.28"
impact_label: "points of 10 on quizzes, between-student difference with AI summary, P = 0.28"
summary: >-
  Neurology Grand Rounds recordings were turned into summaries by a prompted large language model, and students in each
  clerkship cohort were randomized to receive a summary before a quiz or not.
caveat: >-
  Preprint, abstract only; the cohort-level signal is statistically significant but the student-level difference is
  small and not, and no calendar dates were given beyond a year-long study.
