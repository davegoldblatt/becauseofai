headline: >-
  Because of an AI call service, the San Diego County Sheriff's Office says it
  answers up to 20% of non-emergency calls without a dispatcher.
impact: "Up to 20% of non-emergency calls answered by AI"
impact_number: "20%"
impact_label: "of non-emergency calls answered by an AI system at a sheriff's dispatch centre"
summary: >-
  The San Diego County Sheriff's Office launched an AI call-answering service,
  Hyper, on its non-emergency line in March 2026. Police1 reports it answers up
  to 20% of those calls, and the captain says non-emergency wait times are
  already cut in half while data are still being collected.
caveat: >-
  Officials' early account in a sponsored trade article; the agency says it is
  still collecting data. No baseline figures are given for wait times.
