id: thames-water-origin-orbit-satellite-leaks
section: because
rank: 51
headline: >-
  Because of AI satellite leak detection, Thames Water says a 19-week trial
  helped find more than 800 leaks, saving an estimated 8.7 million litres of
  water a day.
impact: "~8.7M litres/day saved (est.)"
impact_number: "8.7M"
impact_label: "litres of water a day saved, estimated, in a 19-week leak-detection trial"
summary: >-
  Thames Water's newsroom reports that Origin Orbit, an AI tool that reads
  satellite data to flag likely underground leaks, helped its crews identify more
  than 800 leaks in an initial 19-week trial, which it estimates saved 8.7 million
  litres of water a day.
caveat: >-
  The utility's own press release about its own contractor's product. The saving
  is an estimate, no control area is shown, and finding a leak is only part of
  the detect-and-repair chain.
