id: irri-paddymitra-whatsapp-fertiliser-advisory-odisha-rice-yield
section: because
rank: 155
headline: >-
  Because of PaddyMitra, a WhatsApp fertiliser advisory built on machine learning, rice farmers in three Odisha
  districts got yields about 7–12% above their own fertiliser practice in a single season.
impact: "Rice yield about 7–12% higher than farmers' fertiliser practice"
impact_number: "7–12%"
impact_label: "higher rice yield than farmers' own fertiliser practice, Odisha pilot"
summary: >-
  IRRI reports that PaddyMitra, a WhatsApp advisory whose nutrient recommendations come from machine learning
  applied to years of Rice Crop Manager field data, was piloted in the 2025 wet season among about 1500 farmers
  in Odisha. Recommended plots out-yielded farmers' fertiliser practice in all three districts studied, by 0.38
  to 0.60 t/ha.
caveat: >-
  The source is IRRI's own magazine article about its own tool. It states the analysis covers a single season
  and gives no sample sizes per district, no statistical test and no dates.
domain: infrastructure
ai_type: classic-ml
