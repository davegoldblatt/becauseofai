id: nhs-derm-skin-cancer
section: because
rank: 6
headline: >-
  Because of AI, about a third of urgent skin-cancer referrals at some NHS
  hospitals got a same-day all-clear without waiting weeks for a dermatologist.
impact: "25,000+ cancers found; ~1/3 discharged same day"
impact_number: "25,000+"
impact_label: "cancers found; 1 in 3 referrals cleared same day"
summary: >-
  Skin Analytics' DERM, the only AI with Class III CE certification for
  autonomous use, has assessed 250,000+ NHS patients, identified 25,000+
  histology-confirmed cancers, and is expanding to all 18 NHS South East trusts
  (about 9 million more people) from autumn 2026.
caveat: >-
  Operational data from the vendor and trusts; at one district hospital the
  autonomous pathway discharged 37% of referrals and missed one basal cell
  carcinoma.
domain: medicine
ai_type: classic-ml
grades:
