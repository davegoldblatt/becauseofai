headline: >-
  Mitchell School District in South Dakota says 47 of the more than 60 students who
  attended 80 percent of a summer programme using the Amira AI reading tutor, 76
  percent, met or exceeded the district's goal of a quarter-year of reading growth.
impact: "76% of summer-pilot students met the district's reading-growth goal with the Amira AI tutor"
impact_number: "76%"
impact_label: "of summer pilot students met the district's quarter-year reading growth goal using the Amira AI reading tutor"
summary: >-
  A newspaper report distributed by GovTech describes a seven-week summer pilot in which
  elementary students used Amira, an AI oral-reading tutor that listens to a child read
  aloud and corrects errors, alongside small-group tutoring. The district reports how
  many of the students who attended most sessions reached its growth goal.
caveat: >-
  A news report quoting district staff; the comparison is to the district's own growth
  goal, not to a control group; the pilot also included small-group tutoring and
  whole-group instruction; the figure covers only students who attended 80 percent of
  sessions.
