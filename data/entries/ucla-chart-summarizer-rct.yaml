id: ucla-chart-summarizer-rct
section: because
rank: 16
headline: >-
  Because of AI, 284 UCLA clinicians reported modestly lower task load and
  burnout from a chart summarizer — while saving no time and mostly not
  recommending it.
impact: "Lower task load, zero time saved"
impact_number: "−22"
impact_label: "net promoter score; less task load, zero time saved"
summary: >-
  A pragmatic RCT (Feb–May 2026) of Epic's generative chart summarization tool
  among 284 ambulatory clinicians found modestly reduced physician task load and
  lower burnout, no time savings, declining engagement, and a net promoter score
  of −22.
caveat: >-
  Preprint (medRxiv, Aug 2026), self-reported outcomes, three-month window, one
  health system.
