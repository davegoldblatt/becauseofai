id: columbia-epic-ai-draft-replies-null
section: not-because
rank: 9
headline: >-
  Clinicians at Columbia who adopted Epic's AI-drafted replies to patient
  messages answered 8.6% more slowly afterwards, and their after-hours replying
  did not fall, across 983,154 responses.
impact: "8.6% slower turnaround after adoption"
impact_number: "+8.6%"
impact_label: "message turnaround after clinicians adopted AI-drafted replies"
summary: >-
  A cohort study (JAMA Network Open, October 2026) followed 1,542 clinicians at
  Columbia University Irving Medical Center before and after their first use of
  Epic's generative-AI draft-reply tool, with clinician and calendar-month fixed
  effects; adoption was associated with longer time to answer patients, and
  using a draft was not associated with less after-hours replying overall.
caveat: >-
  Observational, not randomized. Messages answered with the draft were 29.5%
  faster, but clinicians chose which messages to use it on, likely the routine
  ones; for test-result queries received in working hours, after-hours replies
  fell, and for messages received after hours they rose.
domain: work
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Each clinician's first responses to patient portal messages before vs after first use of the AI draft-reply tool, clinician and month fixed effects, March 2023 to May 2025"
effect:
  relative: "Turnaround 8.6% longer after adoption (95% CI 4.6%–12.9%); 29.5% shorter on messages where the draft was used (95% CI −34.5% to −24.1%)"
  absolute: "After-hours responses +0.61 percentage points with tool use (95% CI −1.02 to 2.24), not significant"
reach: "983,154 first responses from 1,542 clinicians to 272,091 patients at Columbia University Irving Medical Center, New York"
dates:
  achieved_start: 2024-09-12
  achieved_end: 2025-05-15
  published: 2026-10-30
  added: 2026-11-09
  updated: 2026-11-09
sources:
  - title: "JAMA Network Open: AI-Generated Draft Response Tool, Message Turnaround Time, and After-Hours Replies Among Health Care Professionals (Jeanselme et al.), PMC"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13723026/
    doi: 10.1001/jamanetworkopen.2026.41364
    type: primary
conflicts: >-
  No vendor authors; one author reported grants from the CDC, the NIH Office of
  the Director and PCORI. The model was OpenAI's, integrated by Epic, and the
  authors had no access to its configuration.
what_would_change: "A randomized or staggered rollout showing that access to AI drafts shortens time to answer patients or reduces after-hours work."
notes: >-
  Filed under not-because on the adoption estimate, the one that reflects
  having the tool at all; the 29.5% faster figure for messages answered with a
  draft compares messages clinicians selected, which the authors themselves
  flag as prone to selection bias. Both are shown.
  Dates: the analysis keeps clinicians who first adopted the tool on or after
  12 September 2024 (the final prompt update), and the data end on 15 May 2025;
  enterprise rollout was 17 December 2024. Window pre.
  Compare ucla-chart-summarizer-rct and ambient-scribes-nejm-ai.
