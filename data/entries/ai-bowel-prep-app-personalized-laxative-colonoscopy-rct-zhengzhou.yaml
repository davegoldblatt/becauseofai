id: ai-bowel-prep-app-personalized-laxative-colonoscopy-rct-zhengzhou
section: because
rank: 149
headline: >-
  Because of an AI smartphone app that judged stool photos, patients preparing
  for colonoscopy drank 1245.5 mL of bowel-cleansing solution against 1586.2 mL
  in the control group, with adequate cleansing in 93.3% against 88.8%.
impact: "1245.5 vs 1586.2 mL of laxative solution"
impact_number: "48.6%"
impact_label: "of patients in the AI-guided group reduced their laxative use (124 of 255)"
summary: >-
  At one hospital in Zhengzhou, 513 colonoscopy patients using sodium phosphate
  were randomized to an AI app that assessed photos of their stool and told them
  when to stop the laxative, or to standard instructions. The AI group drank
  less solution, had bowel cleansing that was not inferior, took the medication
  as instructed more often, and reported fewer adverse reactions.
caveat: >-
  One centre in China; the app was provided by a company that helped develop it.
  Patients had to be able to use a smartphone, alone or with help. The trial
  showed no difference in adenoma detection rate, and was powered for
  non-inferiority of cleansing, not for detection or safety. Patients were not
  blinded to the app.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "AI-guided bowel preparation (smartphone app assessing stool images, laxative stopped on a pass) vs standard instructions with the full recommended dose, 1:1 block randomization"
effect:
  relative: "Reduced laxative use in 48.6% (124/255) of the AI-guided group; adequate bowel preparation not inferior (1-sided P <.001)"
  absolute: "1245.5 (SD 377.2) mL vs 1586.2 (SD 50.4) mL consumed; adequate preparation 238/255 (93.3%) vs 229/258 (88.8%); adverse reactions 5/255 (2%) vs 15/258 (5.8%)"
reach: "513 patients analysed (255 AI-guided, 258 control) at one hospital"
