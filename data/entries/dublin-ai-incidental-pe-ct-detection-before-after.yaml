id: dublin-ai-incidental-pe-ct-detection-before-after
section: because
rank: 84
headline: >-
  After a Dublin tertiary hospital deployed a commercial AI tool for pulmonary embolism on routine contrast CT, reported
  incidental PE rose from 0.35% to 0.63% of eligible scans.
impact: "Incidental pulmonary emboli found on routine CT nearly doubled after AI was deployed"
impact_number: "0.35% → 0.63%"
impact_label: "of eligible non-CTPA contrast CTs had an incidental pulmonary embolism reported"
summary: >-
  A large tertiary hospital compared the same four months of 2022 (before) and 2023 (after an AI pulmonary embolism
  detection tool was introduced) and counted incidental pulmonary emboli reported on contrast-enhanced CT scans ordered
  for other reasons.
caveat: >-
  Retrospective before-and-after comparison at one hospital with no concurrent control; the AI analysed only 78.7% of
  eligible scans and had modest sensitivity, and the abstract does not say how many extra cases changed management.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Incidental PE reporting rate on non-CTPA contrast CT, September to December 2022 (before AI) vs September to December 2023 (after AI), same hospital"
effect:
  relative: null
  absolute: "Incidental PE detection rate rose from 0.35% to 0.63% (P = .0389); segmental incidental PE rose from 0.08% to 0.42%"
reach: "11 690 contrast-enhanced CT studies, 10 411 of them eligible non-CTPA studies, at one tertiary care hospital"
