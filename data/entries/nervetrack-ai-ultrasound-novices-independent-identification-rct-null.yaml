id: nervetrack-ai-ultrasound-novices-independent-identification-rct-null
section: not-because
rank: 25
headline: >-
  Brief AI-assisted nerve-tracking training did not significantly improve
  first-attempt independent median-nerve identification (65.8% vs 57.5%) among
  80 ultrasound novices.
impact: "No significant gain in independent nerve identification after AI-assisted training (RCT)"
impact_number: "65.8% vs 57.5%"
impact_label: "first-attempt median-nerve identification, AI-assisted vs control training, not significant"
summary: >-
  Medical students and anesthesiology residents with no ultrasound experience
  were randomized to B-mode ultrasound training with or without a real-time
  nerve-tracking system (NerveTrack), then tested with the AI switched off.
  Success on the first attempt did not differ significantly.
caveat: >-
  A training study in novices, not patient care; the abstract says the findings
  do not establish long-term retention, transfer, or clinical procedural
  performance. Only the abstract could be read and it gives no study dates.
domain: education
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Training with a real-time AI nerve-tracking system vs B-mode ultrasound training without AI, randomized, tested with AI disabled"
effect:
  relative: "Median nerve RR 1.14, 95% CI 0.81 to 1.62; p=0.452; brachial plexus RR 1.20, 95% CI 0.68 to 2.11; p=0.519"
  absolute: "Median nerve 65.8% with AI vs 57.5% control; supraclavicular brachial plexus 42.1% vs 35.0%"
reach: "80 ultrasound novices (60 medical students and 20 anesthesiology residents) randomized, 78 completed"
