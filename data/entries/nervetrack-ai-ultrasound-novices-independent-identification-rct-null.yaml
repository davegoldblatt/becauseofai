conflicts: >-
  The abstract carries no funding or disclosure statement; the full text, which
  may name the NerveTrack developer and any author ties, could not be read.
what_would_change: "A trial showing that AI-assisted training improves retention, transfer to other anatomy, or procedural performance on patients."
notes: >-
  Filed under not-because: the primary outcome did not differ. Participants who
  later received additional AI-assisted training reported higher confidence for
  the brachial plexus (4.7 vs 4.4, p=0.046), which is not claimed as a benefit.
  verify: the source gives no study period, so the achieved dates and window are
  left empty; the registration is NCT05857787 per the abstract.
