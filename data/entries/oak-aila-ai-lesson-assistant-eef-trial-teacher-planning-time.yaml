id: oak-aila-ai-lesson-assistant-eef-trial-teacher-planning-time
section: because
rank: 129
headline: >-
  In an EEF-commissioned randomised trial of primary teachers in England, teachers
  assigned to Oak National Academy's Aila AI lesson assistant spent around 49 minutes
  less per week preparing lessons and resources, averaging 2.5 hours against 3.3 hours.
impact: "49 fewer minutes a week of lesson preparation for teachers using the Aila AI lesson assistant (RCT)"
impact_number: "−49 min"
impact_label: "a week of lesson and resource preparation for primary teachers assigned to the Aila AI lesson assistant, vs a comparison group"
summary: >-
  A trade-press report of an independent trial run by NFER for the Education Endowment
  Foundation says Year 3 to Year 6 teachers assigned to Aila prepared lessons faster
  than a comparison group, with resource quality judged no worse. Use of the tool was
  low and fell during the trial.
caveat: >-
  Read here from a trade-press report of the trial, not the EEF report itself (the EEF
  page would not load); comparison teachers could still use other AI tools; Aila was
  used for only around 7% of lessons; saving planning time does not mean better teaching.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Teachers assigned to use Aila vs a comparison group of teachers not assigned to it, hours a week on lesson and resource preparation, ten weeks"
effect:
  relative: "Teachers using Aila spent 76% as much time preparing lessons and resources as teachers in the comparison group"
  absolute: "Around 2.5 hours a week against 3.3 hours, about 49 minutes less per week"
reach: "Year 3 to Year 6 teachers in England; 81% of teachers in the Aila group used it at least once"
