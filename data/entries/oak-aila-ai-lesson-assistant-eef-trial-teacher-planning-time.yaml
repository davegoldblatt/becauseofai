conflicts: >-
  The source is a trade-press news report, not the trial report. The tool is made by
  Oak National Academy, whose chief executive is quoted; the trial was commissioned by
  the EEF and run by NFER, which the report calls independent.
what_would_change: "The EEF and NFER evaluation report, read in full, confirming the figures and the pre-registered outcome."
notes: >-
  verify: the report says the trial ran ten weeks in autumn 2025 without calendar dates, so dates and window are left empty.
  verify: whether the primary outcome was pre-registered is not stated in the text read, so evidence is B rather than A.
  verify: the EEF project page returned HTTP 403 for the reader; replace this source with the EEF report when it reads.
