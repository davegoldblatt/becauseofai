id: cadly2-cad-eye-lynch-syndrome-surveillance-adenoma-detection-rct-null
section: not-because
rank: 35
headline: >-
  AI-assisted colonoscopy (CAD EYE) did not significantly raise adenoma
  detection in Lynch syndrome surveillance: 33.8% of patients against 30.9%
  with white-light colonoscopy alone, in a 757-patient randomized trial.
impact: "No significant gain in adenoma detection in Lynch syndrome (RCT)"
impact_number: "33.8% vs 30.9%"
impact_label: "adenoma detection rate, AI-assisted vs white-light colonoscopy, not significant"
summary: >-
  Adults with genetically confirmed Lynch syndrome at nine surveillance centres
  in four European countries were randomized to high-definition white-light
  colonoscopy alone or with the CAD EYE detection aid. Detection was slightly
  higher with the aid, but the difference was not statistically significant and
  fell short of the improvement the trial was sized to find.
caveat: >-
  Only the abstract could be read. The trial was open-label for endoscopists,
  who work in specialised surveillance centres with high baseline detection,
  and the trial did not follow cancers or interval cancers. The device is made
  by Fujifilm.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "HD white-light colonoscopy with CAD EYE computer-aided detection vs HD white-light colonoscopy alone, 1:1 randomization across nine centres"
effect:
  relative: "Odds ratio 1.14 (95% CI 0.83-1.57), p=0.41 for adenoma detection"
  absolute: "Adenoma detection rate 30.9% (114 of 369) with white-light vs 33.8% (123 of 364) with CADe assistance"
reach: "757 patients randomly allocated, 733 in the primary analysis, at nine centres in Belgium, Germany, the Netherlands, and Spain"
dates:
  achieved_start: 2023-05-09
  achieved_end: 2025-10-30
  published: 2026-07-16
