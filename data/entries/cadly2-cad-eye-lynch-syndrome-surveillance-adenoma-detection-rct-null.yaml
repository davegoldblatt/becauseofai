sources:
  - title: "Hüneburg et al., The Lancet Gastroenterology & Hepatology 2026: CADLY2, AI-assisted detection and optical differentiation of colorectal lesions in Lynch syndrome surveillance (abstract via Europe PMC)"
    url: https://doi.org/10.1016/S2468-1253(26)00163-9
    type: primary
conflicts: "The abstract names Fujifilm as maker of the CAD EYE device and gives funding as third-party research funding of the National Center for Hereditary Tumor Syndromes, University Hospital Bonn; author disclosures are in the full text, which could not be read."
what_would_change: "A larger Lynch syndrome trial showing significantly more adenomas, or fewer interval cancers, with AI-assisted colonoscopy."
notes: >-
  Filed under not-because: no significant difference in adenoma detection rate.
  verify: dates are the abstract's randomization window, May 9, 2023 to
  Oct 30, 2025; the registry record (DRKS00030695) was not read.
  verify: full text could not be read, so the level is at most reasonable.
