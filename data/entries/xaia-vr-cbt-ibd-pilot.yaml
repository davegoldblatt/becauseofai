id: xaia-vr-cbt-ibd-pilot
section: because
rank: 38
headline: >-
  Because of an AI conversational avatar in virtual reality, adults with inflammatory bowel disease
  reported lower pain and anxiety right after a single cognitive-behavioral-therapy session, in a
  small two-centre pilot with no control group.
impact: "Lower anxiety after one session (pilot)"
impact_number: "−10.65"
impact_label: "change in State-Trait Anxiety Inventory score after one 30-minute AI virtual-reality CBT session"
summary: >-
  Thirty-four adults with IBD at two US medical centres completed one session with the XAIA conversational
  avatar, and pain and anxiety were measured before and after.
caveat: >-
  A single-arm pilot with before-and-after scores on the same day, no control group, and an exploratory outcome;
  nothing shows the effect lasts.
