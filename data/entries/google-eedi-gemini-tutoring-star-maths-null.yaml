id: google-eedi-gemini-tutoring-star-maths-null
section: not-because
rank: 18
headline: >-
  In a pre-registered trial of 1,179 students in 10 UK secondary schools, Gemini
  tutoring inside the Eedi maths platform matched expert human tutors on in-platform
  measures but moved standardised Star Maths scores by only +0.02 standard
  deviations against standard remediation.
impact: "No detectable gain on a standardised maths test after AI tutoring (RCT)"
impact_number: "+0.02 SD"
impact_label: "on Star Maths for AI tutoring with personalised context vs standard remediation, interval -0.12 to +0.16"
summary: >-
  Google's LearnLM team and Eedi report a randomised trial in which students in
  state secondary schools received standard Eedi remediation, expert human tutoring,
  or Gemini-drafted tutoring, with expert tutors reviewing each AI message before
  delivery. AI tutoring did better than standard remediation on in-platform and
  midtrial measures, but not on an externally scored standardised maths test.
caveat: >-
  Report written by the developer of the AI system and the platform company, not
  peer-reviewed; a human tutor reviewed every AI message before a student saw it, so
  this is human-in-the-loop AI; the authors call explanations for the gap tentative
  and exploratory.
domain: education
ai_type: generative
