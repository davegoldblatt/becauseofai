    type: primary
conflicts: >-
  The report is written by Google's LearnLM team with Eedi, the maker of the Gemini
  model and the maths platform it was tested in; the ethics review was by Google
  DeepMind's committee. It is the organisations' own report on their own product.
what_would_change: "A longer trial in which AI tutoring improves an externally scored standardised assessment."
notes: >-
  Dates: the report's Procedure section says the trial launched on 13 April and ended on 7 July, "earlier this year" in a report dated 29 October 2026; the AEA registry gives an intervention start of 2026-04-13. Window in.
  verify: expert tutors reviewed every Gemini message; the report says 94.7% were approved unchanged.
