id: faa-smart-ai-airspace-rerouted-flights
section: because
rank: 57
headline: >-
  Because of AI airspace routing, the US Department of Transportation says the FAA's
  SMART tool helped reroute nearly 180 flights, improving flight times by more than
  10 minutes each.
impact: "10+ min saved per rerouted flight"
impact_number: "10+ min"
impact_label: "better flight time per rerouted flight, nearly 180 flights, DOT says"
summary: >-
  The Department of Transportation says the FAA's SMART platform, which pools about 200
  data streams to recommend routes that controllers can accept, helped reroute nearly 180
  flights, improving flight times by more than 10 minutes and saving nearly 80 gallons of
  fuel on average.
caveat: >-
  The department's own statement, relayed by a newspaper. It reports an average over the
  flights SMART helped, not a measured reduction in delays across the system; the
  department gave no dates for the figures or the flights.
