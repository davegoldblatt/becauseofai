conflicts: >-
  The source is Mercy's own press release about its own deployment, announcing a
  white paper by AVIA, Mercy and Aidoc; the software is from the vendor Aidoc,
  Mercy's partner. The release calls the AVIA review independent, but Mercy
  commissioned it. The white paper itself was not read.
what_would_change: "The white paper's methods, a comparison period for turnaround, and confirmed-diagnosis counts among the flagged incidental findings."
notes: >-
  verify: the release says five months of data were studied but gives no calendar
  dates for them (the platform launched in January 2025), so dates and the
  window grade are left empty.
  verify: it is not stated whether 19.8 hours is a before-deployment figure or
  an unflagged-case figure.
