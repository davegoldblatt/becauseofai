id: mercy-aidoc-imaging-ai-scan-turnaround-incidental-findings
section: because
rank: 119
headline: >-
  Because of AI, Mercy says imaging AI cut scan-to-result time for flagged urgent
  cases from 19.8 hours to 1.3 hours, and 5,642 patients got accelerated
  attention for incidental findings in five months.
impact: "19.8 hours to 1.3 hours scan-to-result"
impact_number: "19.8 h → 1.3 h"
impact_label: "scan-to-result turnaround for flagged urgent cases at Mercy"
summary: >-
  A health-system announcement of a white paper (August 2026) says Mercy, with
  Aidoc's imaging AI deployed across more than 50 hospitals, used the software to
  flag urgent cases, shortening scan-to-result turnaround, and flagged 50,749
  incidental findings in five months, of which 5,642 patients received
  accelerated clinical attention.
caveat: >-
  Mercy's own press release about a white paper it commissioned with the vendor;
  the release gives no comparison group, no definition of the 19.8-hour baseline
  and no confirmed diagnoses among the flagged findings.
domain: medicine
