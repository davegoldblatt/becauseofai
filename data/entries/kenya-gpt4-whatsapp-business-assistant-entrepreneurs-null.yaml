id: kenya-gpt4-whatsapp-business-assistant-entrepreneurs-null
section: not-because
rank: 26
headline: >-
  A GPT-4 business assistant on WhatsApp, randomly offered to Kenyan small-business owners, had
  no detectable average effect on revenues or profits; high performers gained about 15% and
  low performers did about 8% worse.
impact: "No average effect on revenue or profit; +15% for high performers, -8% for low"
impact_number: "+15%"
impact_label: "for high performers, about 8% worse for low performers, no average effect (GPT-4 business assistant)"
summary: >-
  A Harvard Business School working paper reports a field experiment in which Kenyan
  entrepreneurs were randomly given access to a GPT-4-powered business assistant over WhatsApp.
  The authors cannot reject no average effect on revenues or profits, and find the effect
  differed by baseline performance.
caveat: >-
  Read from the Harvard Kennedy School listing of the December 2023 working paper's abstract
  only; the journal version (Management Science) returned HTTP 403. The abstract gives no
  sample size or trial dates, and the 15% and 8% figures are sub-sample results.
