id: fortell-ai-hearing-aids
section: because
rank: 12
headline: >-
  Because of AI, 30 hearing-aid users understood far more words in heavy noise —
  according to the company that makes the device.
impact: "31% → 80% words understood (company trial)"
summary: >-
  Fortell's neural source-separation hearing aid (launched Dec 2025) reports a
  pre-registered double-blind 30-person trial against Phonak's Audéo Infinio
  Sphere showing a 9.2 dB vs 3.1 dB signal-to-noise improvement on QuickSIN,
  alongside a 20-person blinded preference study published in the International
  Journal of Audiology (May 2026).
caveat: >-
  Both studies are Fortell-funded with a Fortell employee as first author, the
  control device also uses neural-network noise reduction, and the 30-person
  intelligibility trial was posted on the company's site rather than confirmed
  in a journal as of October 2026.
domain: accessibility
ai_type: classic-ml
grades:
  evidence: C
  attribution: ai-vs-ai
  window: in
comparison: "Fortell Spatial AI vs leading competitor AI hearing aid, within-subject crossover"
effect:
  relative: "9.2 dB vs 3.1 dB SNR improvement; ~19x odds of correct word recognition (company figures)"
  absolute: "Company-reported: 69%→90%, 31%→80%, 7%→50% words correct across noise levels"
reach: "Prescription product, 30+ US states as of Oct 2026"
