headline: >-
  Because of an AI decision-support system, the EPA says Evansville, Indiana cut
  combined sewer overflows by more than 100 million gallons a year.
impact: ">100M gallons/year less overflow"
impact_number: ">100M"
impact_label: "gallons a year less combined sewer overflow in Evansville, Indiana"
summary: >-
  An EPA page on smart sewers says Evansville's real-time decision support
  system, built on sensor networks and artificial intelligence, shows operators
  treatment-plant capacity up to an hour ahead with recommended pumping rates,
  and has cut combined sewer overflows.
caveat: >-
  An agency's summary of a city programme, with no baseline year, period or
  independent audit; the system advises operators and sits within a larger
  sewer control plan.
