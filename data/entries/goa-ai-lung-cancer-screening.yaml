id: goa-ai-lung-cancer-screening
section: because
rank: 31
headline: >-
  Because of AI review of routine chest X-rays, Goa's public hospitals have made
  18 confirmed lung cancer diagnoses and cut the average time to diagnosis by
  more than 50%, the state says.
impact: "18 lung cancers confirmed; diagnosis 50%+ faster"
impact_number: "18"
impact_label: "confirmed lung cancer diagnoses from 106,248 routine chest X-rays reviewed by AI in Goa's public hospitals"
summary: >-
  Goa's health department, with Qure.ai and AstraZeneca, runs AI over every chest
  X-ray taken at 18 public facilities, whatever the reason for the scan. By
  February 2026 it had flagged 10,564 lung nodules and led to 18 confirmed lung
  cancers.
caveat: >-
  The state's and vendor's own early outcomes: no comparison group, no period
  given, and the baseline for the time-to-diagnosis claim is not stated.
domain: medicine
ai_type: classic-ml
grades:
  evidence: C
  attribution: bundled
  window: null
comparison: "Average time to diagnosis after the programme began against an unstated earlier level"
effect:
  relative: "Reduced the average time to diagnosis by more than 50%"
  absolute: "18 confirmed lung cancer diagnoses from 1,06,248 chest X-rays analysed; 10,564 nodules flagged, 1,619 high-risk"
reach: "18 public healthcare sites across Goa, India"
