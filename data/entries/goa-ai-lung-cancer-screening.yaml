conflicts: "The source is a press release by the vendor Qure.ai, sharing outcomes with the Government of Goa and AstraZeneca, who are its partners in the programme. No independent audit."
what_would_change: "A baseline period for the time-to-diagnosis claim, stage at diagnosis, and a government or peer-reviewed report."
notes: >-
  verify: the release says "Since deployment" without a start date, so dates
