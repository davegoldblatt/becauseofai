id: cleveland-clinic-synapsis-ai-attr-cm-trial-enrollment
section: because
rank: 89
headline: >-
  Because Cleveland Clinic ran Dyania Health's Synapsis AI over its records, seven patients were enrolled in a phase 3
  ATTR-CM heart trial through AI-assisted screening, taking the site past its 16-patient goal.
impact: "7 patients enrolled through AI screening"
impact_number: "7"
impact_label: "patients enrolled in a phase 3 heart trial through AI-assisted screening, past the site's 16-patient goal"
summary: >-
  In a pilot at Cleveland Clinic, an EMR-embedded medical LLM with clinician review identified 29 of 30 trial matches that
  routine recruitment had missed, and seven patients were enrolled through it.
caveat: >-
  A trade-press interview with a pilot investigator; the AI was introduced three months into recruitment, after 10 patients
  had already consented, and the site stopped at seven AI-sourced patients so the full yield is unknown.
