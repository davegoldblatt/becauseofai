id: ambient-scribes-nejm-ai
section: because
rank: 15
headline: >-
  Because of AI, physicians using ambient scribes reported modestly less burnout,
  exhaustion, and task load in a 238-physician randomized trial.
impact: "Modest burnout reduction (RCT)"
summary: >-
  NEJM AI (Dec 2025) randomized 238 outpatient physicians across 14 specialties
  to Microsoft DAX, Nabla, or usual care for two months; either scribe improved
  burnout, exhaustion, and task load, and Nabla reduced time-in-note.
caveat: >-
  Effects were modest, only one vendor saved documentation time, occasional
  note inaccuracies required vigilance, and the trial ran Nov 2024–Jan 2025.
domain: work
