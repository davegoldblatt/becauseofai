id: ai-infocare-lay-summaries-rct
section: because
rank: 21
headline: >-
  Because of AI, neurosurgery outpatients in Dresden who were given an
  AI-written plain-language summary of their own findings before the visit rated
  the conversation with their doctor higher, and the consultation was shorter
  (median 25 vs 33 minutes).
impact: "Better-rated visits, 25 vs 33 min"
impact_number: "25 min"
impact_label: "median consultation, vs 33 min without the AI summary"
summary: >-
  A prospectively registered single-centre RCT (NEJM AI, October 2026) gave 300
  adult outpatients at a German university neurosurgery department their usual
  report with or without a quality-checked AI lay-language summary before the
  consultation; patient-rated interaction quality, the primary outcome, was
  higher with the summary, mainly on shared decision-making, and consultations
  were about a fifth shorter.
caveat: >-
  The gain on the primary outcome is small (Hedges' g 0.33), consultation time
  is a secondary outcome with confidence intervals not adjusted for
  multiplicity, physicians rated their own autonomy support slightly lower, and
  no clinical outcome was measured; only the abstract could be read.
domain: medicine
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Usual medical report plus a quality-checked AI lay-language summary (Simply Onno) before the consultation vs the usual report alone, 1:1 randomization"
effect:
  relative: "Consultations about 21% shorter (ratio of geometric means 0.79, 95% CI 0.70–0.88); interaction-quality difference 0.17 points (95% CI 0.05–0.29), Hedges' g 0.33"
  absolute: "Median consultation 25 vs 33 minutes; mean patient-rated interaction quality (FAPI) 4.42 vs 4.25"
reach: "300 adult outpatients at the neurosurgery department of University Hospital Carl Gustav Carus, Dresden"
