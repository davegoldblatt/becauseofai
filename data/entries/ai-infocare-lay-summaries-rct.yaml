    url: https://drks.de/search/en/trial/DRKS00036810
    type: primary
conflicts: >-
  The summaries were produced by a tool developed by Simply Onno GmbH, and the
  registry lists a Simply Onno contact for public queries; the trial was
  investigator-initiated and paid from the department's own budget with no
  external funding. The abstract read does not carry the authors' disclosures.
what_would_change: "A clinical outcome (adherence, decisional regret, follow-up attendance), a second site, or the full text showing a conflict not stated here."
notes: >-
  Window argued as pre: the registry gives an actual start of 26 May 2025 and an
  actual completion of 8 January 2026, so about two of the trial's seven and a
  half months fall inside the window that opened on 9 November 2025. Same
  reasoning as flourish-ai-coach-students-rct and rosie-chatbot-maternal-null;
  the result is new, the experience it measures mostly is not.
  Evidence A: registered prospectively (DRKS, 5 May 2025, three weeks before
  the first patient) with the same primary outcome (FAPI) the paper reports.
  Placed as reasonable, not strict: the NEJM AI page returns HTTP 403 to the
  gate's reader and the paper is not in PMC, so the numbers come from the
  abstract. The full text would raise it.
  verify: the vendor's own page (simply-onno.com) says a co-author is the
  vendor's co-founder; the abstract's author list shows only Dresden
  affiliations. Check the disclosures in the full text.
