    url: https://doi.org/10.1016/j.ijmedinf.2026.106679
    type: primary
conflicts: "none found in the abstract; funding and author disclosures were not visible in the text read."
what_would_change: null
notes: >-
  verify: only the abstract was read; the p value and revisit figures are cut off
  in the printed text. verify: dates come from the abstract (deployment date and
  study window January 2021 to February 2026); the window is graded pre as the
  cautious choice though the post-deployment data run into 2026. verify: no
  comparison isolates the AI; the before-after design with an internal control
  is graded bundled because the options offered do not fit it better.
related: []
