id: ai-fracture-detection-ortho-ed-los-before-after-israel
section: because
rank: 104
headline: >-
  Because of AI, patients whose fractures were ruled out in an orthopedic
  emergency department spent 127.5 minutes there on average after an AI
  fracture-detection tool was deployed, down from 135.6.
impact: "135.6 to 127.5 minutes in the ED"
impact_number: "−8.13 min"
impact_label: "mean ED stay for patients without a fracture"
summary: >-
  A tertiary ambulatory orthopedic ED compared length of stay for limb-radiograph
  patients without a fracture before and after deploying an AI fracture-detection
  tool, using patients with confirmed fractures as an internal control.
caveat: >-
  A retrospective before-after cohort whose authors state the associations do not
  establish causation; fracture status came from discharge diagnosis codes and
  only the abstract could be read.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: bundled
  window: pre
comparison: "ED length of stay in fracture-excluded patients before vs after AI fracture-detection deployment on 1 October 2023, with fracture-confirmed patients as internal control"
effect:
  relative: null
  absolute: "Mean length of stay fell from 135.6 to 127.5 min (Δ -8.13 min; 95% CI -11.52 to -4.70)"
reach: "8253 fracture-excluded and 6864 fracture-confirmed ED visits at one tertiary hospital"
dates:
  achieved_start: 2023-10-01
  achieved_end: 2026-02
  published: 2026-08-20
  added: 2026-11-21
  updated: 2026-11-21
sources:
