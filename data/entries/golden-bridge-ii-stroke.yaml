conflicts: >-
  Funders include Beijing Ande Yizhi Technology Co. alongside Chinese government
  programmes; the paper says funders had no role in design, conduct, analysis or
  reporting, and the authors declare no relevant financial relationships.
what_would_change: "A factorial design separating AI imaging from guideline prompts would resolve attribution."
notes: >-
  Worked example on /method for the achieved-vs-published rule.
  Enrollment per the paper ran 13 January 2021 to 25 June 2023 (21,689 enrolled,
  86 withdrew within a day). Disability, all-cause mortality and bleeding did not
  differ between arms. The CDSS did not cover thrombectomy decisions.
  verify: whether Beijing Ande Yizhi Technology built or supplied the CDSS; the
  paper lists it only as a funder.
