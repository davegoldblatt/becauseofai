id: golden-bridge-ii-stroke
section: because
rank: 7
headline: >-
  Because of AI-assisted decision support, 10 fewer stroke patients per 1,000
  had another stroke, heart attack, or vascular death within three months.
impact: "26% fewer vascular events"
impact_number: "26%"
impact_label: "fewer repeat strokes, heart attacks, or vascular deaths — 10 per 1,000"
summary: >-
  GOLDEN BRIDGE II (BMJ, March 2026) cluster-randomized 77 Chinese hospitals and
  21,603 acute ischemic stroke patients; new vascular events at three months were
  2.9% with the AI-imaging decision-support system vs 3.9% with usual care
  (adjusted HR 0.74), with the benefit holding through 12 months.
caveat: >-
  Hospitals, not patients, were randomized, and the intervention bundled AI
  image analysis with guideline-based treatment prompts, so the AI's isolated
  contribution isn't separable; enrollment ran January 2021 to June 2023.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: bundled
  window: pre
comparison: "Hospitals with AI-CDSS vs usual care; primary endpoint composite vascular events at 3 months"
effect:
  relative: "26% relative reduction (adjusted HR 0.74, 95% CI 0.58 to 0.93)"
  absolute: "3.9% → 2.9%: 10 fewer events per 1,000 patients"
reach: "21,603 patients, 77 hospitals, 23 provinces"
dates:
