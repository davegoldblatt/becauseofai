id: jeffcom-911-ai-administrative-calls
section: because
rank: 41
headline: >-
  Because of AI call handling, Jeffcom 911 says it saw a sustained 33% reduction
  in administrative calls reaching its dispatchers.
impact: "33% fewer administrative calls"
impact_number: "33%"
impact_label: "reduction in administrative calls at a 911 centre using AI"
summary: >-
  A news feature on 911 centres using AI reports that Jeffcom 911, cited in a
  2025 NTIA white paper, said AI helped produce a sustained 33% reduction in
  administrative calls and a rise of at least 5% in the share of 911 calls
  answered within 15 seconds.
caveat: >-
  The agency's own claim, relayed through a news report of a federal white paper,
  with no baseline, period or method given and no outcome for callers.
