headline: >-
  Because of Kilimo's satellite-and-weather irrigation recommendations, farms in Chile's Maipo River basin
  reduced water use by 15%-20% on average, the company says.
impact: "15%-20% less irrigation water on average; 60 million cubic feet saved in the Maipo basin"
impact_number: "15%-20%"
impact_label: "less irrigation water used on average by Kilimo's Chilean farm clients, per Kilimo"
summary: >-
  Microsoft's Latin America newsroom reports on Kilimo, a water-stewardship platform that combines satellite
  images, weather and soil data and evapotranspiration estimates to issue weekly irrigation recommendations to
  fruit and nut farms. Kilimo says users cut water use by 15%-20% on average, measured against each farm's
  previous three-year average adjusted for rainfall, and that a three-year project saved 60 million cubic feet.
caveat: >-
  Every figure is Kilimo's own, relayed by Microsoft's newsroom. The baseline is the farm's earlier water use, not
  a control group, and the article does not separate the model from the agronomists who visit farms and advise.
