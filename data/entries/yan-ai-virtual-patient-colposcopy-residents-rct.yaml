id: yan-ai-virtual-patient-colposcopy-residents-rct
section: because
rank: 43
headline: >-
  Because of AI, obstetrics and gynecology residents who trained with an AI virtual-patient platform scored
  higher on colposcopy case analysis after one month than residents on traditional teaching alone, in a
  randomized trial of 60 residents at two Chinese teaching hospitals.
impact: "Higher case-analysis score (RCT)"
impact_number: "78.57 vs 71.03"
impact_label: "colposcopy case-analysis score at 1 month, AI platform vs traditional teaching only"
summary: >-
  Sixty residents were randomly assigned to traditional teaching plus an AI-driven virtual patient platform
  from the start, or to traditional teaching first and the platform a month later (wait-list), and the
  case-analysis score was compared at one month.
caveat: >-
  Only the abstract could be read; the outcomes are training scores and an OSCE, not patient outcomes, and the
  AI platform was added on top of traditional teaching, so the arms differ by more than the model alone.
