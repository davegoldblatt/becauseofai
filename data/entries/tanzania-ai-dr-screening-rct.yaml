id: tanzania-ai-dr-screening-rct
section: because
rank: 27
headline: >-
  Because of AI, people in Tanzania with referable diabetic retinopathy were
  about twice as likely to reach the eye clinic within 8 weeks: 35.9% against
  18.2% with standard screening.
impact: "35.9% vs 18.2% reached the eye clinic"
impact_number: "35.9%"
impact_label: "of people with referable retinopathy reached the eye clinic within 8 weeks, against 18.2% with standard screening"
summary: >-
  In a randomised trial across 24 hospital clinics in the Kilimanjaro and Arusha
  regions of Tanzania, diabetes patients screened with an AI system that gave a
  result and face-to-face counselling on the spot attended the central eye
  clinic more often than patients who heard their result by phone weeks later.
caveat: >-
  Attendance is a process outcome, not sight saved; even in the AI group about
  two in three people with referable disease did not attend within 8 weeks, and
  the effect bundles the immediate result with face-to-face counselling.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: bundled
  window: pre
comparison: "AI-supported screening with a point-of-screening result and face-to-face counselling vs standard screening with deferred human grading and telephone counselling, individually randomised 1:1"
effect:
  relative: "A 97% relative increase in attendance; odds ratio 2.52 (95% CI 1.86 to 3.42)"
  absolute: "17.7 percentage points more attended within 8 weeks (95% CI 12.0 to 23.4)"
reach: "2378 participants enrolled at 24 hospital clinics in Kilimanjaro and Arusha, Tanzania; 904 with true referable retinopathy"
