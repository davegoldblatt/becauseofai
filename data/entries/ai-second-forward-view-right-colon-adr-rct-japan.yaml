id: ai-second-forward-view-right-colon-adr-rct-japan
section: because
rank: 103
headline: >-
  Because of AI, an AI-assisted second look at the right colon found adenomas in
  36.4% of colonoscopy patients against 27.9% with standard colonoscopy.
impact: "36.4% vs 27.9% right-colon ADR"
impact_number: "8.5 pts"
impact_label: "higher right-colon adenoma detection rate"
summary: >-
  A multicentre trial randomized colonoscopy patients to standard colonoscopy or
  a real-time AI-assisted second forward-view examination of the right colon and
  compared the right-colon adenoma detection rate.
caveat: >-
  The extra AI-assisted examination is a second look as well as AI, so the trial
  cannot separate the AI from the repeat inspection, which the authors say
  warrants further investigation; the outcome is adenoma detection, not cancers
  prevented.
