id: moreton-bay-ai-pothole-detection-repairs
section: because
rank: 56
headline: >-
  Because of AI road-defect detection on recycling trucks, City of Moreton Bay says
  4,547 of the 12,896 potholes it repaired in six months were identified by AI.
impact: "4,547 potholes found by AI, repaired"
impact_number: "4,547"
impact_label: "potholes found by AI and repaired in six months, council says"
summary: >-
  The City of Moreton Bay in Queensland reports that AI analysing dashcam video from its
  recycling trucks identified 4,547 of the 12,896 potholes it filled in the past six
  months, and 48,282 since 2020, with jobs ranked by severity.
caveat: >-
  The council's own media release. It counts potholes found by AI, not how many would
  have been missed otherwise or how much faster repairs happened, and the six-month
  period is stated relative to the release date.
