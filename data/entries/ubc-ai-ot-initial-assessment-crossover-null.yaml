id: ubc-ai-ot-initial-assessment-crossover-null
section: not-because
rank: 15
headline: >-
  In a randomized crossover trial, 83% of 30 adults preferred a human-administered occupational therapy initial
  assessment to a remote AI-administered one, and rated the human format as more compassionate.
impact: "People preferred the human assessment (crossover RCT)"
impact_number: "83%"
impact_label: "of 30 adults preferred the human-administered assessment over the AI one"
summary: >-
  Thirty adults at the University of British Columbia completed both a purpose-built, self-administered AI
  occupational therapy initial assessment and a human-administered one, in random order. The AI format was highly
  usable and produced goals rated as clear and relevant at rates matching the human format, but perceived compassion,
  satisfaction and preference favoured the human.
caveat: >-
  Abstract only: thirty adult volunteers in a research setting, one to two weeks between formats, outcomes are
  self-rated experience rather than clinical results, and the authors frame the AI as a supplement, not a replacement.
