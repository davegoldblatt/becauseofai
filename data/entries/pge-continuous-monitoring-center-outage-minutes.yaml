id: pge-continuous-monitoring-center-outage-minutes
section: because
rank: 53
headline: >-
  Because of machine-learning grid monitoring, PG&E says it avoided 12 million
  minutes of unplanned customer outages and intercepted 17 potential ignitions
  in 2025.
impact: "12M minutes of outages avoided"
impact_number: "12M"
impact_label: "minutes of unplanned customer outages avoided, per PG&E's grid monitoring"
summary: >-
  PG&E's May 2026 article on its Continuous Monitoring Center says machine-learning
  models scanning data from more than 5.5 million sensors, reviewed by a trained
  team before a crew is sent, helped avoid 12 million minutes of unplanned customer
  outages and intercept 17 potential ignitions in high fire-risk areas in 2025.
caveat: >-
  The utility's own article about its own programme. The figures are for a
  bundle of sensors, analytics and human review; the counterfactual (outages
  that would have happened) is not shown and no period is given for the
  outage-minutes figure.
