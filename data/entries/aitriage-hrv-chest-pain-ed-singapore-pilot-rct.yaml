id: aitriage-hrv-chest-pain-ed-singapore-pilot-rct
section: because
rank: 122
headline: >-
  Because of AI, fewer emergency-department chest-pain patients in Singapore were
  admitted to hospital (50.2% vs 61.1%) when physicians were guided by an AI
  heart-rate-variability risk score, in a pilot randomized trial.
impact: "-10.9 points in hospital admissions"
impact_number: "50.2% vs 61.1%"
impact_label: "hospital admissions, AI HRV-guided triage vs standard care"
summary: >-
  In a single-blinded pilot randomized trial at Singapore General Hospital, patients
  with suspected acute coronary syndrome had five minutes of ECG monitoring that
  produced an AI HRV risk score and triage advice for the treating team (or hidden
  from it in the control arm); admissions and serial enzyme testing fell.
caveat: >-
  A pilot, not powered for safety: 426 of 560 randomized were analysed, the
  length-of-stay difference's interval crosses zero, and the authors call for an
  adequately powered trial; only the abstract could be read.
