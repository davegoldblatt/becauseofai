id: china-delivery-platform-ai-calling-tool-deaf-workers
section: because
rank: 82
headline: >-
  Because of an AI tool that turns text into phone calls, deaf or hard-of-hearing couriers on a Chinese food-delivery
  platform had 11% fewer late deliveries and 22% fewer bad customer ratings.
impact: "Late deliveries down 11% for deaf couriers"
impact_number: "−11%"
impact_label: "late deliveries for deaf or hard-of-hearing couriers after the AI calling tool"
summary: >-
  An NBER working paper compares deaf or hard-of-hearing couriers with non-disabled couriers before and after the
  platform gave only the deaf couriers an AI tool that converts text prompts into automated phone calls to customers.
caveat: >-
  Read only through the NBER summary because the working paper's full text was unavailable; the platform is unnamed,
  the data are its own administrative records, and the comparison is before and after against other couriers, not a
  randomized trial.
