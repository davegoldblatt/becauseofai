sources:
  - title: "JACC Heart Failure: Artificial Intelligence-Enabled Detection and Management of Physiological Instability in Heart Failure: Results of the Randomized LINK-HF2 Trial (Sideris et al.), abstract via Europe PMC"
    url: https://doi.org/10.1016/j.jchf.2026.103422
    doi: 10.1016/j.jchf.2026.103422
    type: primary
  - title: "ClinicalTrials.gov NCT04502563: LINK-HF2 (VA Office of Research and Development)"
    url: https://clinicaltrials.gov/study/NCT04502563
    type: primary
conflicts: >-
  Sponsored by the VA Office of Research and Development. The author list
  includes people from the company behind the similarity-based monitoring model
  (the abstract does not name it or give a disclosure statement); the full
  disclosures were not read.
what_would_change: "A larger trial with a response protocol aimed at the signals the AI detects, powered for rehospitalization, showing fewer events."
notes: >-
  Filed under not-because: the clinical endpoints did not differ; the AI-detected
  instability rate was lower in the intervention group (HR 0.76), which is a
  process measure and is not claimed as a benefit.
  Window pre: the registry gives an actual start of 19 April 2021 and a primary
  completion of 31 August 2024, both before the window; only the publication is new.
  Evidence B rather than A: the primary aim was feasibility and the clinical
  endpoints are described as exploratory.
  Source discrepancy: the paper's abstract reports HF rehospitalization in 13 of 80
  intervention and 17 of 91 control patients; the registry's posted primary outcome
  (90-day HF hospitalization) gives 13 of 80 and 16 of 91. The registry counts may use
  a fixed 90-day window where the paper does not; both show no significant difference.
  The entry keeps the paper's figures, which are the published analysis.
  verify: the vendor of the monitoring model and any author ties, from the full
  text's disclosures.
related: [uva-comet-deterioration-null, latent-ai-ecg-af-null]
