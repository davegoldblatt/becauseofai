id: link-hf2-ai-wearable-hf-rehospitalization-null
section: not-because
rank: 20
headline: >-
  AI-guided wearable monitoring after heart-failure discharge at five Veterans
  Affairs hospitals did not significantly cut heart-failure rehospitalization
  (16.3% vs 18.7%) compared with standard care.
impact: "No fewer HF rehospitalizations (RCT)"
impact_number: "16.3% vs 18.7%"
impact_label: "HF rehospitalization, AI-guided monitoring vs standard care, not significant"
summary: >-
  In the randomized LINK-HF2 study, 171 analysed veterans discharged after acute
  heart failure wore a continuous sensor patch; for half, a personalized AI
  model sent notifications to clinicians who followed a structured response
  algorithm. The AI-detected instability rate fell, but rehospitalization and
  the composite of unplanned rehospitalization, emergency visits and death did
  not differ from standard care.
caveat: >-
  A feasibility study with exploratory clinical endpoints, 171 analysed patients
  and wide confidence intervals; it cannot rule out a benefit. Only the abstract
  could be read, and the paper and the registry disagree by one control event
  (17 in the paper, 16 in the registry's posted 90-day results).
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: bundled
  window: pre
comparison: "AI-generated notifications plus a structured clinician response algorithm vs standard care, both arms wearing the sensor patch, randomized open-label with blinded endpoints, five VA medical centers"
effect:
  relative: "HF rehospitalization HR 0.90 (95% CI 0.43-1.84; P = 0.76); composite HR 1.03 (95% CI 0.63-1.70; P = 0.89)"
  absolute: "HF rehospitalization 13 (16.3%) of 80 in the intervention group vs 17 (18.7%) of 91 in control"
reach: "171 analysed adults discharged after hospitalization for acute heart failure at 5 Veterans Affairs medical centers"
dates:
  achieved_start: 2021-04-19
  achieved_end: 2024-08-31
  published: 2026-10-09
