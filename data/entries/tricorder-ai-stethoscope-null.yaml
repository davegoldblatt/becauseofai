id: tricorder-ai-stethoscope-null
section: not-because
rank: 1
headline: >-
  An AI stethoscope rolled out to 205 NHS GP practices did not significantly
  increase heart-failure detection at 12 months.
impact: "Null on intention-to-treat"
summary: >-
  TRICORDER (Lancet, Jan 2026) cluster-randomized practices covering 1.5 million
  patients; on intention-to-treat, heart failure, AF, and valve-disease detection
  did not significantly rise (1,342 vs 1,984 new HF cases overall), though
  patients actually examined with the device had roughly twice the HF detection
  and three times the AF detection.
caveat: >-
  The tool worked when used; the deployment didn't get it used — a workflow
  failure, not a model failure.
