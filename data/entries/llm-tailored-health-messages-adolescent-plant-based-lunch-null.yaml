headline: >-
  Rewriting daily health messages in each adolescent's own style with an LLM added no extra plant-based lunch choices
  over plain messages in a trial of 587 UK and Irish adolescents.
impact: "No extra benefit from LLM tailoring"
impact_number: "44% to 59%"
impact_label: "plant-based lunch choices over two weeks with daily messages, tailored or not"
summary: >-
  Adolescents got no messages, plain health messages, or LLM style-tailored messages for two weeks, and their choice of
  a plant-based lunch was tracked.
caveat: >-
  Only the abstract could be read; the gain came from receiving messages at all, and the LLM tailoring itself showed
  no extra short-term behavioural effect, only higher ratings of relevance in exploratory analyses.
