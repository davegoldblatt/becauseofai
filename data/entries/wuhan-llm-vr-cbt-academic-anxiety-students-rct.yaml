id: wuhan-llm-vr-cbt-academic-anxiety-students-rct
section: because
rank: 83
headline: >-
  A language-model virtual CBT coach in VR cut academic anxiety in 60 university students about as much as face-to-face
  CBT, and more than a minimal-support control, in a small randomized trial.
impact: "Academic anxiety fell more than in controls, similar to face-to-face CBT (small exploratory RCT)"
impact_number: null
impact_label: null
summary: >-
  Students with academic anxiety at a Wuhan university were randomly assigned to four weekly sessions with an
  LLM-and-VR cognitive behavioural therapy system, face-to-face CBT, or a minimal-support control, and anxiety scores and
  heart rate were compared before and after.
caveat: >-
  Single-centre, not prospectively registered, small, short-term, and adverse events were not systematically collected;
  the LLM is bundled with VR scenes, so the trial cannot isolate the language model.
