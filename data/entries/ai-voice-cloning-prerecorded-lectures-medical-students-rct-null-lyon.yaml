id: ai-voice-cloning-prerecorded-lectures-medical-students-rct-null-lyon
section: not-because
rank: 34
headline: >-
  Medical students at a French university who watched lectures narrated by an AI clone of their teacher's voice scored no
  differently on knowledge tests than students given the teacher's own recording: 51.2 against 51.8 out of 100.
impact: "Test scores 51.2 vs 51.8 out of 100, no difference"
impact_number: "51.2 vs 51.8"
impact_label: "mean test score out of 100, AI-cloned voice vs teacher's recorded voice; teacher production time was shorter with AI"
summary: >-
  A randomized trial at the University of Lyon gave fourth- and fifth-year medical students four 10-minute prerecorded
  lectures, with audio either recorded by the teacher or generated by a commercial AI voice clone from the same script,
  then tested knowledge acquisition and application.
caveat: >-
  Volunteers, 27% of those randomized never watched a video and were excluded, scores were low in both groups, and the
  study was underpowered for small differences. The one benefit found, shorter production time for the teacher, is not a
  student outcome.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Four prerecorded lectures with AI voice-cloned audio (ElevenLabs) vs the teacher's own recorded audio, identical slides and scripts, medical students randomized 1:1"
effect:
  relative: null
  absolute: "Mean total test score 51.2 (SD 4.9) with AI voice cloning vs 51.8 (SD 6.9) with audio recording, out of 100; production time 22.5 vs 35 minutes per video"
reach: "88 medical students randomized, 64 included in the modified intention-to-treat analysis"
