conflicts: "The study states it received no funding and the authors declare no conflicts of interest. One author is the teacher whose voice was cloned, using a personal commercial ElevenLabs account."
what_would_change: "A larger trial with enough students to detect a difference in learning, or evidence that students prefer or learn better from one voice."
notes: >-
