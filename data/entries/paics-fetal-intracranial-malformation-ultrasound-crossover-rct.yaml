id: paics-fetal-intracranial-malformation-ultrasound-crossover-rct
section: because
rank: 85
headline: >-
  AI assistance during real prenatal ultrasound scans of high-risk pregnancies at five Chinese centres raised
  sonographers' sensitivity for fetal intracranial malformations by 0.087 without losing specificity.
impact: "Sonographers caught more fetal brain malformations in high-risk pregnancies with AI assistance"
impact_number: "+0.087"
impact_label: "sensitivity for targeted fetal intracranial malformations with AI-assisted scanning (fetal-based analysis)"
summary: >-
  In a self-crossover randomized trial, sonographers scanned high-risk pregnancies once with real-time AI assistance
  and once independently, and an expert panel reviewing the scan videos set the reference diagnosis.
caveat: >-
  Only the abstract could be read; the reference standard is an expert panel's review of the scan videos, sonographers
  knew when AI was in use, and the outcome is detection sensitivity rather than later health outcomes.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Same sonographers scanning with PAICS-assisted real-time diagnosis vs independent real-time diagnosis, randomized order with a 4-week washout, against an expert-panel reference diagnosis"
effect:
  relative: null
  absolute: "Fetal-based sensitivity increased by 0·087 (95% CI 0·029 to 0·147) with PAICS assistance"
reach: "1584 scans of high-risk singleton pregnancies (11-32 weeks' gestation) at five Chinese centres"
dates:
  achieved_start: 2022-09-06
  achieved_end: 2023-11-01
  published: 2026-09-10
