id: numi-ai-math-tutoring-hamilton-county
section: because
rank: 33
headline: >-
  An LLM math tutor given to middle-school students in Hamilton County, Tennessee
  helped them recover from mistakes and, inside a mastery workflow, scored 3.1
  points higher on a delayed test of practiced material, a suggestive result.
impact: "Small, imprecise gain on a one-week delayed test (RCT)"
impact_number: "+3.1 pts"
impact_label: "on a delayed test of practiced material, AI vs computer-assisted practice alone (p=0.065)"
summary: >-
  An NBER working paper reports a randomized field experiment in which middle
  school students in 20 Hamilton County schools practiced math on the NUMI
  platform with or without an LLM tutor. Among students in the mastery
  workflow, those with the AI tutor answered 40.2 percent of practiced delayed
  test questions correctly against 37.0 percent for those with practice alone.
caveat: >-
  Working paper, not peer-reviewed; the authors call the delayed-test estimate
  imprecise (p=0.065) and suggestive, the AI arm progressed more slowly, and the
  test came one week after a single 50-minute session.
domain: education
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: in
comparison: "NUMI with an LLM tutor vs NUMI computer-assisted learning only, students randomized to each; mastery-workflow students compared on a delayed test one week later"
effect:
  relative: "Practiced Exercise 1 delayed-test correct: 40.2 percent with AI vs 37.0 percent CAL-only among mastery students"
  absolute: "3.1 percentage points higher (p=0.065); after a mistake, the next attempt was 8.5 percentage points more likely to be correct"
reach: "Grades 6 through 8 in 20 Hamilton County schools, just under 100 teachers"
