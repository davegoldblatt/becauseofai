conflicts: >-
  Supported by the Smith Richardson Foundation, SSHRC, NSERC and J-PAL; the
  authors' team developed the NUMI platform used in the experiment (the paper
  thanks its developers). Registered as AEARCTR-0018678.
what_would_change: "A replication with larger samples or a longer follow-up showing durable gains."
notes: >-
  verify: the practiced Exercise 1 gain is reported by the authors as suggestive (p=0.065); the unpracticed question shows about zero effect.
  verify: the sample size was not located in the text read.
  verify: the dates are the activity week (March 23 to 27, 2026) and the delayed assessment week ending April 3; the paper gives no year for the second week's dates beyond context.
