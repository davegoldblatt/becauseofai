id: ai-generated-forensic-images-medical-students-reasoning
section: because
rank: 37
headline: >-
  Because of AI-generated teaching images, medical students in a forensic medicine course in India
  scored higher on clinical reasoning than classmates who used conventional forensic photographs,
  in a non-randomized comparison.
impact: "Higher clinical reasoning scores (controlled study)"
impact_number: "+2.4 pts"
impact_label: "adjusted clinical reasoning score, AI-generated images vs conventional images"
summary: >-
  MBBS students in case-based forensic-medicine sessions were allocated to images made with GPT-Image-1
  and checked by faculty, or to conventional forensic images, and compared on clinical reasoning
  after the sessions and again five to six weeks later.
caveat: >-
  Non-randomized allocation, sessions taught separately by group, and the authors state the result is an
  association that does not establish that AI imagery alone caused the difference; the outcome is a
  reasoning score, not clinical practice.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Students taught with expert-validated GPT-Image-1 forensic images vs students taught with conventional forensic images, same cases, facilitators and questions, adjusted for baseline reasoning"
effect:
