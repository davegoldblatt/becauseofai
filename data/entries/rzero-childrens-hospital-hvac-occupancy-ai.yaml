  R-Zero's June 2026 press release says its platform, which senses live
  occupancy and dials ventilation down in empty zones through the existing
  building controls, cut HVAC energy use by 30 percent at a nationally ranked
  children's hospital, measured against a pre-project baseline with IPMVP
  methodology.
