id: west-allis-notraffic-ai-signals-greenfield-delay
section: because
rank: 54
headline: >-
  Because of AI signal timing, West Allis, Wisconsin says all-day vehicle delay on
  W. Greenfield Avenue fell 25.2%, from 23.6 to 17.6 seconds per vehicle.
impact: "25.2% less vehicle delay"
impact_number: "25.2%"
impact_label: "less all-day vehicle delay on a twelve-signal corridor, city says"
summary: >-
  The City of West Allis reports that an AI traffic-detection and signal-optimization
  platform on twelve signalized intersections along W. Greenfield Avenue, installed to
  absorb traffic diverted by the I-94 reconstruction, cut average all-day delay per
  vehicle from 23.6 to 17.6 seconds.
caveat: >-
  The city's own press release about a vendor's product. It is a before-and-after
  comparison with no control corridor, during a freeway reconstruction that changed
  traffic, and the release gives no dates for the before and after periods.
