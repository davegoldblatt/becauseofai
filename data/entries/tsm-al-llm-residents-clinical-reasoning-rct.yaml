id: tsm-al-llm-residents-clinical-reasoning-rct
section: because
rank: 36
headline: >-
  Because of AI, orthopedic surgery residents trained with a structured, faculty-supervised
  large-language-model framework scored higher on clinical reasoning in an unassisted final
  examination than residents taught the traditional way, in a randomized trial in Shanghai.
impact: "Higher unassisted clinical reasoning (RCT)"
impact_number: "7.32 vs 5.12"
impact_label: "clinical reasoning score in the unassisted final exam, LLM-framework residents vs traditionally taught residents"
summary: >-
  Residents at one hospital were randomly assigned to a five-step case-analysis framework
  in which a large language model acted as a supervised aid, or to traditional teaching,
  and were compared over 16 weeks of formative assessments and a final examination taken
  without the model.
caveat: >-
  A single-centre trial of orthopedic residents using standardized case materials and no change to patient care;
  the outcomes are examination and faculty ratings, not patient outcomes, and the framework is a package of
  teaching method plus LLM.
