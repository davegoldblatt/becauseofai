id: gleamer-boneview-paediatric-ed-fracture-exclusion
section: because
rank: 35
headline: >-
  Because of an AI fracture-detection second read, children sent home from a
  paediatric emergency department without an orthopaedic consultation stayed
  1.78 hours instead of 2.25.
impact: "28 minutes shorter stay without orthopaedic consultation"
impact_number: "−28 min"
impact_label: "emergency stay for children with fractures ruled out and no orthopaedic consult"
summary: >-
  A tertiary paediatric emergency department added Gleamer's BoneView as a
  passive second reader on radiographs in October 2023. A before-after cohort of
  4,172 children with fractures ruled out found fewer orthopaedic consultations
  and a shorter stay among those discharged without one, with no change in
  length of stay among children with confirmed fractures.
caveat: >-
  A retrospective before-after study at a single hospital, so other changes over
  time could contribute; only the abstract could be read, and the headline
  length-of-stay figure for all children was cut off in the abstract text.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Children with fractures ruled out before vs after the AI tool, with children with confirmed fractures as an internal control"
effect:
  relative: "Orthopaedic consultation rate fell from 73% to 68.3%"
  absolute: "Length of stay for children discharged without orthopaedic consultation fell from 2.25 to 1.78 hours, 28 minutes"
reach: "4,172 paediatric patients with fractures ruled out at one tertiary paediatric emergency department"
