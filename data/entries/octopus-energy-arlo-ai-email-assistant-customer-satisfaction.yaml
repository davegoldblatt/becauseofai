id: octopus-energy-arlo-ai-email-assistant-customer-satisfaction
section: because
rank: 98
headline: >-
  Because of an AI assistant that answered routine customer emails, Octopus Energy says its
  trial reached a 76% customer satisfaction score against 72% for comparable human responses,
  on about 8,000 emails a week.
impact: "Satisfaction 76% vs 72% for human replies"
impact_number: "76%"
impact_label: "customer satisfaction for AI-written email replies, vs 72% for comparable human responses"
summary: >-
  Octopus Energy and Kraken built Arlo, an AI customer-support assistant that answers
  straightforward customer emails about tariff renewals, payment dates and account details.
  The supplier's press release reports a three-month trial in which Arlo handled about 4% of
  UK customer emails and scored higher on satisfaction than comparable human replies.
caveat: >-
  The company's own press release about its own trial, with no method, sample or significance
  given, no trial dates, and no independent audit. The assistant only takes routine enquiries,
  so the comparison is against human replies to comparable, not identical, questions.
