id: westminster-council-copilot-studio-chatbot-contact-centre
section: because
rank: 73
headline: >-
  Because of a Copilot Studio chatbot, Westminster City Council says its chatbot handled
  33,400 resident queries since September 2025, resolving 89.5% without a human agent.
impact: "89.5% of 33,400 chatbot queries resolved without an agent"
impact_number: "89.5%"
impact_label: "of 33,400 chatbot queries resolved without a human agent, council says"
summary: >-
  Westminster City Council in London reports, in a Microsoft UK feature, that a chatbot built
  in Microsoft Copilot Studio handled 33,400 queries after launch in September 2025 and that
  call wrap-up time fell from three minutes to two.
caveat: >-
  A Microsoft-published account quoting the council's head of customer service. "Resolved
  without referral" is the council's measure; satisfaction and repeat contacts are not
  reported, and the earlier chatbot's volume (about 300 queries a month) is the only baseline.
