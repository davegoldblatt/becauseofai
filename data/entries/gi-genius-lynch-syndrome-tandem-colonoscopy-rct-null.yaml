conflicts: >-
  The abstract carries no funding or disclosure statement; the full text, which
  may name the device vendor and any author ties, could not be read.
what_would_change: "A larger Lynch syndrome trial showing significantly more adenomas, or fewer interval cancers, with AI-assisted colonoscopy."
notes: >-
  Filed under not-because: no significant difference in adenoma or polyp
  detection. The device named in the title is GI Genius.
  verify: the source gives no study period, so the achieved dates and window are
  left empty; trial registration and vendor ties, from the full text.
