id: gi-genius-lynch-syndrome-tandem-colonoscopy-rct-null
section: not-because
rank: 24
headline: >-
  AI-assisted colonoscopy (GI Genius) did not significantly raise incremental
  adenoma detection in Lynch syndrome (33.3% vs 11.1%) in a randomized tandem
  trial of 100 patients.
impact: "No significant gain in adenoma detection in Lynch syndrome (RCT)"
impact_number: "33.3% vs 11.1%"
impact_label: "incremental adenoma detection, AI-assisted vs HD white-light second colonoscopy, not significant"
summary: >-
  Patients with Lynch syndrome had a first high-definition white-light
  colonoscopy, then were randomized to a second colonoscopy with either
  white-light again or the AI device. The second exam found more additional
  adenomas with AI, but the difference was not statistically significant.
caveat: >-
  Very few adenomas were found (12 and 6 in the AI group, 16 and 2 in the
  control group), so the trial is too small to rule out a real benefit; only the
  abstract could be read and it gives no study dates.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "AI-assisted second colonoscopy vs high-definition white-light second colonoscopy after a first white-light exam, 1:1 randomized, single centre"
effect:
  relative: "OR 4.0, 95% CI (0.68-23.40); p value- 0.124 for per-polyp incremental detection"
  absolute: "Incremental adenoma detection rate 33.3% with AI vs 11.1% with HD-WLE per polyp; per patient 35.3% vs 13.3% (p - 0.165)"
reach: "100 patients with Lynch syndrome enrolled from 107 screened, at a single centre"
dates:
