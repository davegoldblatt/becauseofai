  attribution: bundled
  window: null
comparison: "Industry-standard broadcast spraying, compared in field trials"
effect:
  relative: "35% reduction in herbicide use, proportional to weed density; 39% reduction in herbicide concentration and 54% reduction in herbicide load in irrigation runoff 3-6 days after spraying"
  absolute: "97% efficacy; trials covered 25 ha across six trials"
reach: "Sugarcane farms in reef catchments: 25 ha across six field trials"
