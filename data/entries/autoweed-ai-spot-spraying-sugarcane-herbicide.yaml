    url: https://researchonline.jcu.edu.au/87429/
    type: primary
conflicts: >-
  The project was funded by the partnership between the Australian Government's Reef Trust
  and the Great Barrier Reef Foundation. The abstract does not list author affiliations;
  one author has been reported elsewhere as an operations manager at the company that
  commercialises AI spot spraying, which is not confirmed in the text read.
what_would_change: "The full paper's trial design, dates, and farmer-run results against broadcast spraying, including how weed density varied."
notes: >-
  verify: the abstract gives no trial dates, so achieved dates and the window grade are left
  empty. verify: author ties to a vendor are not shown in the abstract. The paper is from
  2024, outside the slice window; the repository record is dated November 2025.
