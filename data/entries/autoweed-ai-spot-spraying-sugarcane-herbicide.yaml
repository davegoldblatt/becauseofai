id: autoweed-ai-spot-spraying-sugarcane-herbicide
section: because
rank: 79
headline: >-
  Because of AutoWeed AI spot spraying, sugarcane field trials in reef catchments used 35%
  less herbicide than broadcast spraying at 97% weed efficacy.
impact: "35% less herbicide, 54% less herbicide load in runoff"
impact_number: "35%"
impact_label: "less herbicide used on sugarcane than broadcast spraying, field trials"
summary: >-
  A conference paper from James Cook University reports six field trials on 25 ha of
  sugarcane in reef catchments in which the AI-based AutoWeed spot sprayer used 35% less herbicide than
  industry-standard broadcast spraying, with 97% efficacy, and cut herbicide load in
  irrigation runoff by 54%.
caveat: >-
  Only the abstract of a conference paper could be read. It gives no dates, no description
  of how trials were paired or replicated, and the saving depends on weed density.
domain: infrastructure
ai_type: classic-ml
