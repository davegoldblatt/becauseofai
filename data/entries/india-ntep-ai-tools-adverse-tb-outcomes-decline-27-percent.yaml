    url: https://static.pib.gov.in/WriteReadData/specificdocs/documents/2026/feb/doc2026213788701.pdf
    type: primary
    announcement: true
conflicts: >-
  The source is the Government of India's own backgrounder about programmes it runs. No
  independent audit; the AI tools' vendors are not named for this result.
what_would_change: "A programme report defining adverse outcome, giving the baseline and period, the number of patients flagged, and outcomes among flagged patients with and without the AI flag."
notes: >-
  verify: the backgrounder gives the years 2022 to 2025 for the whole AI programme but no period
  for the 27% figure, so achieved dates and the window grade are left empty. verify: the figure is
  cited in a table row as "Reported 27% decline in adverse outcomes after nationwide deployment",
  which links to an earlier PIB release that was not read.
