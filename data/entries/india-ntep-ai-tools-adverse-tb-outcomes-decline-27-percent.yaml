id: india-ntep-ai-tools-adverse-tb-outcomes-decline-27-percent
section: because
rank: 109
headline: >-
  Because of AI tools in its National TB Elimination Programme, India's government says adverse
  TB outcomes fell 27%.
impact: "27% fewer adverse TB outcomes"
impact_number: "27%"
impact_label: "decline in adverse TB outcomes with AI tools in India's TB programme, government says"
summary: >-
  A Government of India backgrounder reports that AI tools in the National TB Elimination
  Programme, which flag patients at high risk of treatment failure once treatment starts,
  were followed by a 27% decline in adverse TB outcomes and over 4,500 outbreak alerts.
caveat: >-
  A government backgrounder, not an evaluation. It gives no baseline, period, definition of
  "adverse outcome", comparison group or count of patients, and it does not separate the AI
  flags from the clinical follow-up that acts on them.
domain: medicine
ai_type: classic-ml
grades:
  evidence: C
  attribution: bundled
  window: null
comparison: "Adverse TB outcomes after nationwide deployment against an unstated earlier level; no control group"
effect:
  relative: "27% decline in adverse TB outcomes"
  absolute: null
reach: "India's National TB Elimination Programme, with over 4,500 outbreak alerts issued"
