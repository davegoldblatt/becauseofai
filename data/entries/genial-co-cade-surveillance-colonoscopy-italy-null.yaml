id: genial-co-cade-surveillance-colonoscopy-italy-null
section: not-because
rank: 22
headline: >-
  AI-assisted colonoscopy did not significantly raise the adenoma detection
  rate (66.6% vs 61.0%) among 914 Italian screening-programme patients
  undergoing surveillance colonoscopy, and lengthened withdrawal time.
impact: "No significant gain in adenoma detection (RCT)"
impact_number: "66.6% vs 61.0%"
impact_label: "adenoma detection rate, AI-assisted vs standard surveillance colonoscopy, not significant"
summary: >-
  In the GENIAL-CO follow-up randomized trial, patients aged 50 to 74 scheduled
  for post-polypectomy surveillance colonoscopy in an organized screening
  programme were randomized to computer-aided detection or standard
  colonoscopy. Adenoma detection and advanced adenoma detection did not differ
  significantly, though adenomas per colonoscopy were higher with the aid.
caveat: >-
  Adenomas per colonoscopy were significantly higher with the AI aid, so this is
  a null on the primary endpoint rather than on every detection measure; only the
  abstract could be read and it gives no study dates.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Computer-aided detection-assisted colonoscopy vs standard colonoscopy, 1:1 randomized, multicentre, Italy"
effect:
  relative: "ADR and advanced ADR did not differ significantly (p = 0.160 and p = 0.263)"
  absolute: "Adenoma detection rate 66.6% with CADe vs 61.0% standard; advanced adenoma detection rate 7.3% vs 6.3%"
reach: "914 patients analysed (455 CADe, 459 standard) from 973 enrolled in an organized colorectal cancer screening programme in Italy"
