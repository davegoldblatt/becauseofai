what_would_change: "A trial in surveillance patients that shows higher advanced-adenoma detection, or fewer interval cancers, with the aid."
notes: >-
  Filed under not-because: the primary endpoint (adenoma detection rate) did not
  differ. Adenomas per colonoscopy were significantly higher with CADe
  (1.80 vs 1.32), which the headline does not claim as a benefit.
  verify: the source gives no study period, so the achieved dates and window are
  left empty; the CADe vendor and trial registration, from the full text.
