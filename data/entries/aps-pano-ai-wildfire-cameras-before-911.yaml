headline: >-
  Because of AI smoke-detection cameras, Arizona Public Service says it is
  notified of wildfires about 45 minutes faster on average than the first 911
  call.
impact: "~45 min earlier than the first 911 call"
impact_number: "~45"
impact_label: "minutes earlier than the first 911 call, on average, for a utility's wildfire alerts"
summary: >-
  An Associated Press report says Arizona Public Service uses Pano AI cameras that
  flag smoke for human analysts to verify; a utility meteorologist said the
  alerts arrive about 45 minutes faster on average than the first 911 call, and
  the Diamond Fire in Coconino National Forest was contained before it passed
  7 acres.
caveat: >-
  A utility meteorologist's statement in a news report, with no data, period or
  method shown; the cameras sit in remote areas where 911 calls are slow, and
  human analysts verify each detection.
