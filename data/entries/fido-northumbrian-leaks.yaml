id: fido-northumbrian-leaks
section: because
rank: 13
headline: >-
  Because of AI, Northumbrian Water stopped losing about 6.4 million litres of
  drinking water a day.
impact: "~6.4 ML/day saved"
impact_number: "~6.4M"
impact_label: "litres of drinking water saved per day"
summary: >-
  A six-month trial starting November 2025 placed FIDO Tech acoustic sensors on
  pipes, with AI classifying which underground sounds are leaks and directing
  crews; the utility reported early results of nearly 6.4 megalitres per day
  saved.
caveat: >-
  Operational report, no controlled comparison, and the saving is attributable
  to the detect-and-repair package; FIDO had already delivered a 37% leakage
  reduction across 15 target DMAs at the same utility in 2022–23.
