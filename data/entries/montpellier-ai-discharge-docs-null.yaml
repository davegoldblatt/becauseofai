id: montpellier-ai-discharge-docs-null
section: not-because
rank: 11
headline: >-
  An LLM that drafted discharge documents for 153 children leaving a paediatric
  emergency department did not improve how well families understood them.
impact: "No difference in family understanding (randomized trial)"
impact_number: "−0.01"
impact_label: "difference in record-concordant understanding, 95% CI −0.12 to 0.10"
summary: >-
  Montpellier University Hospital randomized children discharged from its
  paediatric emergency department to conventional template documents or
  documents drafted by an on-premises open-weight LLM, each validated by the
  discharging clinician. Family understanding at follow-up, the primary outcome,
  did not differ between arms.
caveat: >-
  A medRxiv preprint, registered retrospectively; 117 of 153 children were
  analysed, and the trial was not powered to detect small differences. Only the
  abstract could be read.
