id: waymo-injury-crashes
section: because
rank: 2
headline: >-
  Because of AI, there were an estimated 841 fewer injury-causing crashes across
  270 million driverless miles.
impact: "82% fewer injury crashes"
impact_number: "82%"
impact_label: "fewer injury crashes than human drivers, 270M miles"
summary: >-
  Waymo's safety hub through June 2026 reports 82% fewer injury-causing crashes
  and 95% fewer serious-or-worse crashes than a geographically matched human
  benchmark, with roughly 134 of the 841 avoided injury crashes accruing in
  Q2 2026 alone (841 minus the 707 reported through March 2026).
caveat: >-
  Company-produced, modeled comparison against an estimated human benchmark
  with an adjustment for roughly 32% underreporting of human injury crashes;
  not a randomized comparison of identical trips.
domain: transport
ai_type: classic-ml
