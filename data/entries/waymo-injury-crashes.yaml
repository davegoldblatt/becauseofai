  absolute: "0.67 injury crashes per million miles vs ~3.77 benchmark; 841 fewer injury crashes lifetime"
reach: "Phoenix, SF Bay Area, Los Angeles, Austin, Atlanta; ~4M miles/week by mid-2026"
