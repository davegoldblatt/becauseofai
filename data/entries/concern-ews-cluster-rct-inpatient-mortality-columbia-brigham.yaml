id: concern-ews-cluster-rct-inpatient-mortality-columbia-brigham
section: because
rank: 142
headline: >-
  Because of an AI early-warning score shown to care teams, hospitalized
  patients had a 35.6% lower instantaneous risk of in-hospital death in a
  74-unit cluster-randomized trial.
impact: "35.6% lower risk of in-hospital death"
impact_number: "−36%"
impact_label: "risk of in-hospital death with the CONCERN early-warning score"
summary: >-
  The CONCERN EWS, a model that reads nursing notes and other EHR data to flag
  patients at risk of deterioration, was displayed on 37 randomly assigned
  units at two health systems and withheld on 37 others. Across 60,893
  encounters, in-hospital deaths were 181 in the intervention group and 265 in
  usual care (adjusted HR 0.644, 95% CI 0.532-0.778). Unanticipated ICU
  transfers rose by 24.9%.
caveat: >-
  Read from the June 2024 medRxiv preprint; a separate 2026 critique raises
  concerns about ICU-bed spillover, exclusions and pre-trial unit mortality
  differences that could overstate the effect. Unanticipated ICU transfers
  increased.
