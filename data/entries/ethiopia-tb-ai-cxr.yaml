id: ethiopia-tb-ai-cxr
section: because
rank: 4
headline: >-
  Because of AI, 1,660 TB cases were found in Ethiopia between January 2025 and
  March 2026 in screening programs that had no radiologist to read the X-rays.
impact: "1,660 TB cases found"
impact_number: "1,660"
impact_label: "TB cases found with no radiologist"
summary: >-
  AI-read chest X-rays (CAD) served as the triage reader in MSH's Eliminate TB
  Project across four regions, contributing to 1,660 detected cases including
  asymptomatic infectious cases that symptom screening misses.
caveat: >-
  Program report, not a controlled comparison; "contributed to" means the AI
  flagged people for confirmatory testing, so the counterfactual is how many
  would have been found by symptom screening alone.
