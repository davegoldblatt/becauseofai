id: tongji-ai-nutrition-gi-surgery-rct
section: because
rank: 26
headline: >-
  Because of AI-drafted, dietitian-reviewed guidance, 66.7% of gastric and
  colorectal cancer surgery patients at one Wuhan hospital ate enough energy 30
  days after discharge, against 40.0% given standard advice.
impact: "66.7% vs 40.0% met energy target"
impact_number: "66.7%"
impact_label: "of cancer-surgery patients met their energy target at 30 days, vs 40.0% with standard advice"
summary: >-
  A single-centre randomized trial of 90 patients after laparoscopic gastric or
  colorectal cancer surgery compared individualized dietary guidance drafted by
  DeepSeek v3.2 and reviewed by a clinician with standard discharge advice.
  More patients in the AI-guided group reached their energy and protein targets
  and reported fewer symptoms; weight, blood nutrition markers and
  complications did not differ.
caveat: >-
  The authors say the trial cannot separate AI from individualization,
  quantified targets and clinician review; it is one hospital, 90 patients, 30
  days, and no clinical outcome improved.
domain: medicine
ai_type: generative
grades:
