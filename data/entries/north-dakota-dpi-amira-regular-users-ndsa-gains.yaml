id: north-dakota-dpi-amira-regular-users-ndsa-gains
section: because
rank: 128
headline: >-
  North Dakota's education department says third graders who read with the Amira AI
  tutor regularly (more than 20 minutes a week) saw an average 15-point gain on the 2024
  state assessment, fourth graders 17 points and fifth graders 10 points.
impact: "15-point average state-test gain for regular third-grade Amira users (state agency analysis)"
impact_number: "+15 pts"
impact_label: "average gain on the North Dakota state assessment for third graders who read with the Amira AI tutor more than 20 minutes a week"
summary: >-
  The North Dakota Department of Public Instruction, which pays for Amira licences
  statewide, reports an efficacy analysis of students who used the AI reading tutor
  regularly and their gains on the 2024 state assessment in grades 3, 4 and 5.
caveat: >-
  The state agency's own summary of an analysis commissioned around its own contract
  with the vendor; the page does not say what the gain is measured against, how
  students who used Amira regularly differ from those who did not, or how many students
  are included.
