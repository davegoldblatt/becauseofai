id: urogynecology-chatgpt-4o-peri-visit-decisional-conflict-rct-null
section: not-because
rank: 33
headline: >-
  Letting urogynecology patients ask ChatGPT-4o about their problem before or after the first visit did not change how
  uncertain they felt about their decisions, in a randomized trial of 125 patients.
impact: "No difference in decisional conflict"
impact_number: "125"
impact_label: "patients randomized; chatbot use before or after the visit did not change decisional conflict"
summary: >-
  A single-centre randomized trial gave patients with prolapse, incontinence or urinary symptoms ChatGPT-4o to use before
  the visit, after it, or not at all, and measured decisional conflict immediately and at three months.
caveat: >-
  Read from the abstract only; the patients were mostly White and well educated, were nearly all new to medical chatbots,
  and the study measured decision-making and satisfaction, not health outcomes.
