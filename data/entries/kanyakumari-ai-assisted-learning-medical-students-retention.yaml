  absolute: "Retention at 1 month 61.4% with AI-assisted learning vs 35.9% with traditional learning (p<0.001); at 1 week 75.5% vs 57.9%"
reach: "149 second-year MBBS students at Kanyakumari Government Medical College, Tamil Nadu, India"
