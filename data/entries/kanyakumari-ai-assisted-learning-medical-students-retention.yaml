id: kanyakumari-ai-assisted-learning-medical-students-retention
section: because
rank: 86
headline: >-
  Second-year medical students in Tamil Nadu who studied a drug class with generative AI remembered 61.4% of it after
  one month, against 35.9% for the class they studied from textbooks.
impact: "Medical students kept more of what they learned with AI help after one month (non-randomized, different topics)"
impact_number: "61.4% vs 35.9%"
impact_label: "knowledge retained at one month, AI-assisted vs traditional self-study"
summary: >-
  Each of 149 second-year MBBS students studied one pharmacology topic from textbooks and another with ChatGPT, Gemini
  or NotebookLM, then took parallel short-answer tests immediately, at one week and at one month.
caveat: >-
  Not randomized, and the two methods used different drug classes (aminoglycosides vs quinolones) in a fixed order, so
  topic and order are confounded with AI use; only 95 students had complete data, and the authors say this does not
  establish causation.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Same students' one-month retention after AI-assisted self-study of quinolones vs textbook self-study of aminoglycosides, parallel 15-question short-answer tests"
effect:
