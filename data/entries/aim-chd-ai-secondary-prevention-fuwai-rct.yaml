id: aim-chd-ai-secondary-prevention-fuwai-rct
section: because
rank: 102
headline: >-
  Because of AI, 45% of coronary heart disease patients using an AI-enhanced
  management system were at their blood-pressure target after three months,
  against 35% with usual care.
impact: "BP target 45% vs 35%"
impact_number: "45% vs 35%"
impact_label: "of CHD patients at blood-pressure target at 3 months"
summary: >-
  Fuwai Hospital randomized adults with coronary heart disease at discharge to
  usual care or usual care plus AIM-CHD, a smartphone system with automated data
  capture, AI risk stratification and closed-loop feedback, and measured LDL
  cholesterol and risk-factor targets at three months.
caveat: >-
  Single centre, open label, three months of follow-up, and the gain in LDL
  cholesterol was small; HbA1c, BMI and medication adherence did not differ and
  the trial was not powered for cardiovascular events.
domain: medicine
ai_type: hybrid
grades:
  evidence: A
  attribution: bundled
  window: pre
comparison: "Usual post-discharge care plus the AIM-CHD smartphone system vs usual care alone, 1:1 randomization, 3 months"
effect:
  relative: "Blood-pressure target achieved: RR 1.27 (95% CI 1.09–1.48)"
  absolute: "Blood-pressure target achieved by 45% vs 35%; mean LDL-C 60.4 vs 63.7 mg/dL, adjusted difference − 3.2 mg/dL"
reach: "1100 adults with confirmed coronary heart disease, Fuwai Hospital, Beijing"
