id: gaihmc-family-communication-chatbot-ltc-nurses-burnout-taiwan
section: because
rank: 106
headline: >-
  Because of a generative AI chatbot that answered families' health questions, nursing home nurses in
  northern Taiwan reported less client-related burnout after three months than nurses at comparison
  homes, in a small non-randomised study.
impact: "Less client-related burnout (small non-randomised study)"
impact_number: "−6.86"
impact_label: "client-related burnout score, group-by-time difference at three months versus routine care"
summary: >-
  Sixty-eight nursing staff at eight nursing homes were followed for three months; those at homes using the
  chatbot for family health education and Q&A showed larger drops in personal and client-related burnout than
  those continuing routine care.
caveat: >-
  Quasi-experimental, 68 staff, no random allocation, and the authors note no adjustment for multiple testing;
  work-related burnout and over-commitment showed no difference.
