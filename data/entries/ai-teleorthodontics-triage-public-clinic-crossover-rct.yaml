id: ai-teleorthodontics-triage-public-clinic-crossover-rct
section: because
rank: 147
headline: >-
  Because of AI-supported teleorthodontics, triage of patients referred to a public orthodontic clinic was 2.9 times faster than
  face-to-face screening in a crossover trial, with sensitivity of 1 but specificity of 0.67 for referral acceptance.
impact: "Triage 2.9 times faster than face-to-face"
impact_number: "2.9×"
impact_label: "faster orthodontic triage with AI-supported teleorthodontics than face-to-face screening"
summary: >-
  A crossover randomized trial in a public orthodontic clinic had referred patients triaged both remotely (intraoral scans
  analysed with Dental Monitoring AI, photos and an online history) and face-to-face, and compared the two on referral
  acceptance and screening time.
caveat: >-
  Only the abstract could be read. The AI could not measure several traits (crossbite, contact point displacement,
  functional shift), borderline cases could not be graded confidently, and three referrals were wrongly rejected. The
  tool bundles remote scanning, photos and a survey with the AI.
