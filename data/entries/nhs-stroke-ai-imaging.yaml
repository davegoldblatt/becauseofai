what_would_change: null
notes: >-
  Observation period 1 January 2019 to 31 December 2023 and e-publication on
  2 December 2025 (Lancet Digit Health 7(12), PMID 41339157), per the abstract;
  window stays pre. Site-level comparison at the 26 evaluation sites: EVT 2.3%
  before vs 4.6% after implementation (interaction OR 1.24 against non-evaluation sites).
  verify: door-in-door-out (128 vs 192 min) and mRS 0–2 (47.1% vs 45.6%, OR 1.16)
  are not in the abstract; check them against the full text, which is paywalled.
