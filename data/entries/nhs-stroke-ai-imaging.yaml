id: nhs-stroke-ai-imaging
section: because
rank: 11
headline: >-
  Because of AI, stroke patients in England were 57% more likely to get a
  thrombectomy and reached specialist centres 64 minutes faster.
impact: "EVT odds 1.57x; 64 min faster transfer"
summary: >-
  Across ~453,000 stroke admissions at 107 English hospitals over five years,
  patients whose imaging was reviewed with Brainomix 360 had higher thrombectomy
  odds (OR 1.57), median door-in-door-out of 128 vs 192 minutes, and a good
  outcome (mRS 0–2) at discharge of 47.1% vs 45.6% (OR 1.16).
caveat: >-
  Observational, not randomized; long-term outcomes couldn't be evaluated and
  reasons for non-use of the AI in some cases weren't captured.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Patients reviewed with AI software vs without, adjusted for age, severity, premorbid disability, timing"
effect:
