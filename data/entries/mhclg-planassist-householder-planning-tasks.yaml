id: mhclg-planassist-householder-planning-tasks
section: because
rank: 72
headline: >-
  Because of PlanAssist, an AI tool for planning officers, England's housing ministry says
  early testing in three councils cut time spent on key planning tasks by 58%.
impact: "58% less time on key planning tasks"
impact_number: "58%"
impact_label: "less time on key planning tasks in early testing, government says"
summary: >-
  The Ministry of Housing, Communities and Local Government reports that PlanAssist, built with
  Google DeepMind, Google Cloud and Faculty, brings applications, policies and site constraints
  into one place for planning officers; early testing in Camden, Barnet and Dorset cut time on
  key tasks by 58%, and the trial is expanding to 15 councils.
caveat: >-
  A government press release. It does not say how the 58% was measured, over what period or
  how many applications. The claim that processing times for routine householder applications
  halve from eight weeks to four is stated as the aim, not a measured outcome.
