id: eagle-cadde-colonoscopy-rct
section: because
rank: 20
headline: >-
  Because of AI, colonoscopists using a cloud-based polyp detector found 0.82
  adenomas per colonoscopy against 0.62 without it, and 43.2% of patients had an
  adenoma against 35.9%.
impact: "0.82 vs 0.62 adenomas per colonoscopy"
impact_number: "7.3 pts"
impact_label: "more patients with an adenoma found (43.2% vs 35.9%)"
summary: >-
  EAGLE randomized screening and surveillance colonoscopy patients at eight
  centers in four European countries to standard colonoscopy or colonoscopy with
  CADDIE, a cloud-based real-time polyp-detection aid. The aided arm found more
  adenomas per colonoscopy (0.82 vs 0.62), more large polyps and more sessile
  serrated lesions, with no rise in unnecessary resections.
caveat: >-
  The outcome is detection of adenomas during the procedure, not cancers
  prevented or later interval cancers, which the trial did not follow. The
  sponsor and device maker, Odin Medical, funded the trial and helped design
  it; endoscopists had to have an adenoma detection rate of at least 25% and
  all equipment was Olympus. Fieldwork was in 2023.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Colonoscopy with the CADDIE computer-aided detection system vs standard high-definition white-light colonoscopy, 1:1 randomization in blocks of four"
effect:
  relative: "Adenomas per colonoscopy ratio 1.33 (95% CI 1.06–1.67), 33% more adenomas detected"
  absolute: "0.82 vs 0.62 adenomas per colonoscopy (p = 0.01); adenoma detection rate 43.2% vs 35.9%, an absolute 7.3% increase"
reach: "841 patients, 22 endoscopists, eight centers in four European countries"
