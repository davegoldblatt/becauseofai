notes: >-
  verify: the headline outcome is adenoma detection, a surrogate for interval
  colorectal cancer, which the trial did not measure; the paper itself says the
  link between adenomas per colonoscopy and interval cancer needs more research.
  verify: the registry results record (posted 2026-10-26) reports the
  detection-rate counts as 180 of 417 and 152 of 424 colonoscopies, which is
  43.2% and 35.8%; the paper's abstract gives 35.9% for the control arm.
  verify: achieved start is the paper's randomization window (May to November
  2023); the registry gives an actual start of 2023-05-10 and a primary
  completion of 2023-11-20, used as the achieved end.
  verify: the paper is from December 2025 and the registry results are new this
  week; no earlier entry or inbox line covers this trial.
