id: indiana-ai-transcripts-expedited-mental-health-appeals
section: because
rank: 71
headline: >-
  Because AI-assisted transcripts could be produced within minutes, Indiana's Marion County
  expedited mental-health appeals pilot reached a Court of Appeals opinion in an average of
  30.85 days, against 143.3 days in 2023.
impact: "30.85 days to appeal opinion, down from 143.3"
impact_number: "30.85 days"
impact_label: "from notice of appeal to opinion in seven expedited commitment appeals, vs 143.3 days in 2023"
summary: >-
  Indiana's courts built a pilot for appeals of involuntary mental-health commitments in
  which hearing audio is turned into a transcript within minutes by voice-to-text plus an AI
  language system. In the first six months, seven expedited appeals took an average of 30.85
  calendar days from notice of appeal to opinion.
caveat: >-
  Written by the Indiana clerk of the appellate courts about the court's own pilot. Seven
  cases, no concurrent control group, and the pilot also shortened briefs and briefing
  periods, so the speed-up is not the transcripts alone.
