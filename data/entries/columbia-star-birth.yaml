notes: >-
  First couple settled: the Lancet letter's case is the couple who had tried for
  nearly two decades (sperm retrieved March 2025, per TIME). The Klinefelter
  couple in the BBC/Decrypt coverage (April 2026) is a later STAR case whose
  pregnancy was still ongoing at publication. Birth month is November 2025, per
  TIME's February 2026 profile; the Lancet letter reports the pregnancy, not the birth.
  verify: the 2.5M-image, 3.5 mL and two-hour figures against the Lancet letter
  itself, which returned 403 to the weekly run.
