id: columbia-star-birth
section: because
rank: 3
headline: >-
  Because of AI, a baby girl was born to a couple who had been told there was
  no sperm to work with.
impact: "2 sperm found in 2.5M images"
impact_number: "1"
impact_label: "baby, from sperm no technician could find"
summary: >-
  Columbia's STAR system scanned 2.5 million images of a 3.5 mL sample in about
  two hours and found viable sperm where manual microscopy found none; the
  resulting pregnancy was confirmed in 2025, published in The Lancet in
  October 2025, and a healthy daughter was born in November 2025.
caveat: >-
  One case; STAR finds sperm in just under 30% of men diagnosed with
  azoospermia, and larger trials are still underway.
domain: medicine
ai_type: classic-ml
grades:
  evidence: D
  attribution: only-path
  window: in
comparison: "Manual microscopy by trained technicians on the same sample (found none) vs STAR"
effect:
