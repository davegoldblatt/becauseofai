id: uiowa-note-depot-lectureai-class-notes-accommodations
section: because
rank: 157
headline: >-
  Because of an AI note generator built by the University of Iowa, its Note Depot platform produced 4,998 AI notes for
  courses with 6,041 students in the first campus-wide term, helping meet class-notes accommodations.
impact: "4,998 AI-generated class notes in one term"
impact_number: "4,998"
impact_label: "AI-generated class notes from lecture recordings, fall 2025"
summary: >-
  The University of Iowa built Note Depot, whose LectureAI feature uses an OpenAI model to turn lecture-capture
  transcripts into notes that instructors review and release, including to students with a class-notes accommodation.
  The university reports usage counts for a pilot and for the first campus-wide term.
caveat: >-
  The university's own news story; it counts notes and courses, not whether students with accommodations learned more
  or were better served than with human notetakers, and the 314 accommodations figure covers AI notes and
  student-notetaker exchanges together.
