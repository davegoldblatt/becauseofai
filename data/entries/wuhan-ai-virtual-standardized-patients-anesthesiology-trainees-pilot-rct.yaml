comparison: "Simulation with structured debriefing plus four 1-hour AI virtual-standardized-patient sessions vs simulation with debriefing alone vs conventional teaching, 20 trainees per group, 16 hours of teaching each"
effect:
  relative: null
  absolute: "Total simulated clinical performance 88.2 ± 4.8 with AI virtual patients vs 78.0 ± 7.7 conventional teaching and 80.4 ± 6.5 simulation with debriefing"
reach: "60 master's students in anesthesiology at Zhongnan Hospital of Wuhan University"
