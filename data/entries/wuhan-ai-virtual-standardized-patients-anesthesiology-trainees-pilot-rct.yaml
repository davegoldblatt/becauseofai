id: wuhan-ai-virtual-standardized-patients-anesthesiology-trainees-pilot-rct
section: because
rank: 68
headline: >-
  Because of AI, anesthesiology trainees in Wuhan who practiced with AI virtual standardized patients scored 88.2 on a
  100-point simulated-performance rubric, against 80.4 with simulation and debriefing and 78.0 with conventional teaching.
impact: "Simulated performance 88.2 vs 78.0"
impact_number: "88.2"
impact_label: "mean simulated clinical performance score with AI virtual patients, against 80.4 for simulation alone and 78.0 for conventional teaching"
summary: >-
  Sixty master's students in anesthesiology were randomized to conventional teaching, simulation with debriefing, or the same
  simulation with four hours of AI virtual-standardized-patient sessions, and rated by blinded anesthesiologists after 16
  hours of teaching.
caveat: >-
  A pilot of 60 trainees at one hospital, not prospectively registered, scored with a locally developed rubric on simulated
  rather than real patients, and the AI sessions replaced four hours of case discussion rather than adding to it.
domain: education
ai_type: generative
grades:
  evidence: B
