id: nz-wairarapa-ai-treatment-injury
section: because
rank: 24
headline: >-
  An LLM screening 2,642 discharge summaries at a New Zealand district hospital
  flagged 102 confirmed cases of harm from care, and seven injury-compensation
  claims followed.
impact: "Compensation claims lodged after AI-assisted identification"
impact_number: "7"
impact_label: "ACC claims lodged following AI-assisted identification"
summary: >-
  Wairarapa Hospital ran a six-month service evaluation in which a large
  language model screened every inpatient discharge summary for potential
  treatment injury and clinicians reviewed each flagged case. The workflow
  generated 237 candidate signals; clinicians confirmed 102 as iatrogenic harm,
  and seven claims to the Accident Compensation Corporation were lodged
  following AI-assisted identification.
caveat: >-
  A single-site preprint service evaluation with no independent chart-review
  reference standard, so the 102 confirmed harms are clinician-adjudicated
  flags and not a measured detection rate. Whether the seven claims would have
  been lodged anyway is not shown. Only the abstract could be read.
domain: medicine
