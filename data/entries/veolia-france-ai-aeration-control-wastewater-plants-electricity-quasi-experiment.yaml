  window: pre
comparison: "Plants before and after AI activation, against not-yet-treated plants and against periods when the AI was interrupted (staggered roll-out)"
effect:
  relative: "Electricity use −5.4%, carbon emissions −6%, energy expenditure −8.2% under full AI control"
  absolute: null
reach: "164 French wastewater treatment plants, January 2022 to July 2025"
