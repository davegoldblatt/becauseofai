id: veolia-france-ai-aeration-control-wastewater-plants-electricity-quasi-experiment
section: because
rank: 133
headline: >-
  Because of AI aeration control, French wastewater plants used 5.4% less
  electricity and emitted 6% less carbon, and paid 8.2% less for energy.
impact: "5.4% less electricity"
impact_number: "5.4%"
impact_label: "less electricity used by wastewater plants under full AI aeration control"
summary: >-
  A working paper compares French wastewater plants before and after an AI
  aeration-control system took over, against plants not yet switched on and
  against hours when the AI was interrupted, and finds lower electricity use,
  emissions and energy bills.
caveat: >-
  A working paper, not yet peer reviewed; the plants volunteered and were
  selected for technical compatibility, the effect is measured over the first ten
  weeks after activation, and the data came from the operator and the AI vendor.
domain: infrastructure
ai_type: classic-ml
grades:
