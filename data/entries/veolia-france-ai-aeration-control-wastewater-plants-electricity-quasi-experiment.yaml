    type: primary
conflicts: >-
  The authors thank the operator's staff for transmitting and handling the data;
  the AI system is the vendor Purecontrol's product, run by the operator Veolia.
  The authors report EU (ERC) funding and no tie to the vendor. This is a
  working paper, not a peer-reviewed article.
what_would_change: "Peer-reviewed publication, and results over a longer window than the first ten weeks after activation."
notes: >-
  verify: the achieved dates are the first AI activation (October 2022) and the
