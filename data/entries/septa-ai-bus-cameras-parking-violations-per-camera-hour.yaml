headline: >-
  Because of AI cameras on SEPTA buses, Philadelphia says illegal parking in enforcement
  areas fell from 1.8 to 0.75 violations per camera hour.
impact: "1.8 to 0.75 violations per camera hour"
impact_number: "1.8 → 0.75"
impact_label: "violations per camera hour, AI bus cameras in Philadelphia, agency says"
summary: >-
  SEPTA and the Philadelphia Parking Authority put AI cameras on 152 buses on 16 routes to
  flag vehicles blocking bus lanes and stops. SEPTA's planner told the Inquirer violations
  fell from 1.8 to 0.75 per camera hour while camera use stayed steady, and median bus
  travel time in enforcement areas dropped 41 seconds in March.
caveat: >-
  The agencies' own figures as reported by a newspaper; there is no control route and no
  dates for the baseline. SEPTA's planner cautions that ridership growth and other factors
  affect bus speeds, and the 41 seconds is one month against the same month a year before.
  Human officers verify each violation before a ticket is issued.
