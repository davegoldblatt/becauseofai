id: bellevue-ai-safer-signals-near-misses
section: because
rank: 59
headline: >-
  Because of AI-supported intersection sensing, Bellevue, Washington's Safer Signals
  pilot cut near misses involving vulnerable road users by more than 45%.
impact: "45%+ fewer near misses"
impact_number: "45%+"
impact_label: "fewer near misses involving pedestrians and cyclists in Bellevue's pilot"
summary: >-
  A Fehr & Peers account of Bellevue's Safer Signals pilot says LiDAR and video sensors
  with edge computing in signal cabinets track pedestrians, cyclists and vehicles, and
  extend the walk phase or switch on a No Turn on Red sign when a conflict is imminent;
  near misses involving vulnerable road users dropped by more than 45%.
caveat: >-
  A consultancy's blog post describing a city pilot, not the city's own report. It gives
  no baseline counts, number of intersections or dates, and says the sensors sometimes
  mistook shadows, glare or tyres for pedestrians.
