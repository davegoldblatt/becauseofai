id: searca-upm-ai-fish-feeder-malaysia-tilapia
section: because
rank: 76
headline: >-
  Because of an AI-based smart fish feeder, small-scale tilapia farmers in Negeri Sembilan,
  Malaysia cut manual feeding time by 70% and feed waste by 20%, SEARCA reports.
impact: "70% less manual feeding time, 20% less feed waste"
impact_number: "70%"
impact_label: "less time on manual feeding for small tilapia farms, project reports"
summary: >-
  SEARCA reports that automated feeders using computer-vision biomass estimates, built by
  Universiti Putra Malaysia and installed in small farmers' tanks in Negeri Sembilan, reduced
  manual feeding time by 70% and cut feed waste by 20%.
caveat: >-
  A funder's news release about its own grantee's pilot. No number of farms or tanks, no
  measurement period, and no description of how the before-and-after figures were measured;
  the team says it still intends to quantify long-term economic returns.
