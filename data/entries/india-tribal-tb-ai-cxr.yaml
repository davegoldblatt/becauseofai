id: india-tribal-tb-ai-cxr
section: because
rank: 5
headline: >-
  Because of AI, TB case notifications rose 80% in a tribal district of
  Chhattisgarh, India, including 20 confirmed cases in people with no symptoms.
impact: "+80% TB notifications"
impact_number: "+80%"
impact_label: "TB notifications, tribal Chhattisgarh"
summary: >-
  A prospective multi-centre study of qXR v3 chest X-ray reading found an 80.21%
  increase in TB notifications versus the Aug 2022–Mar 2023 baseline; of 51
  asymptomatic people the AI flagged, 20 were confirmed to have TB, and over 40%
  of all AI-flagged patients were confirmed.
caveat: >-
  Before-and-after design in a high-burden setting; national notifications were
  also rising from other case-finding efforts.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: only-path
  window: pre
comparison: "AI implementation period vs pre-implementation baseline (same sites)"
effect:
  relative: "+80.21% notifications (p<.001)"
  absolute: "162 confirmed cases; 44.6% positivity among AI-flagged"
reach: "High-risk tribal population, Chhattisgarh"
dates:
  achieved_start: 2023-08-01
  achieved_end: 2024-03-31
  published: 2026-01-07
  added: 2026-10-22
  updated: 2026-10-23
sources:
  - title: "Evaluating AI-based chest X-ray screening for TB in tribal Chhattisgarh (PMC)"
    url: https://www.ncbi.nlm.nih.gov/pmc/articles/PMC12810203/
    type: primary
conflicts: >-
  Eight of the authors are full-time employees of Qure.ai, which makes qXR; funded
  by the India Health Fund (TB Quest 2019).
what_would_change: null
notes: >-
  Per the methods, the AI ran 1 August 2023 to 31 March 2024 at three public
  facilities, against an August 2022 to March 2023 baseline: 96 vs 173 TB patients
  notified. The authors call it a descriptive analysis. This settles last week's
  conflict between achieved_end null and window pre.
  verify: "162 confirmed cases" in effect.absolute against the paper's 173 notified;
  the two may count different things.
