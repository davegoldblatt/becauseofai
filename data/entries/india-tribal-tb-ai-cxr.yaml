id: india-tribal-tb-ai-cxr
section: because
rank: 5
headline: >-
  Because of AI, TB case notifications rose 80% in a tribal district of
  Chhattisgarh, India, including 20 confirmed cases in people with no symptoms.
impact: "+80% TB notifications"
summary: >-
  A prospective multi-centre study of qXR v3 chest X-ray reading found an 80.21%
  increase in TB notifications versus the Aug 2022–Mar 2023 baseline; of 51
  asymptomatic people the AI flagged, 20 were confirmed to have TB, and over 40%
  of all AI-flagged patients were confirmed.
caveat: >-
  Before-and-after design in a high-burden setting; national notifications were
  also rising from other case-finding efforts.
domain: medicine
ai_type: classic-ml
grades:
