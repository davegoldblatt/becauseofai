id: retina4ird-ai-cdss-inherited-retinal-disease-genotype-rct-china
section: because
rank: 123
headline: >-
  In a multicentre randomized trial of 295 patients with suspected inherited retinal disease, specialists using the
  Retina4IRD AI decision-support system named the right gene category in their top five guesses 88.5% of the time,
  against 67.3% for specialists alone.
impact: "Specialists with AI got the genotype right more often"
impact_number: "88.5%"
impact_label: "top-5 genetic accuracy with AI-assisted specialists, vs 67.3% for specialists alone"
summary: >-
  Patients with suspected inherited retinal disease were randomized 1:1 to a specialist assisted by Retina4IRD, which
  predicts the genotype from colour fundus and OCT images, or to a specialist alone, and the specialists' genotype
  guesses were scored against next-generation sequencing reports.
caveat: >-
  Abstract only. The outcome is how often specialists named the right genotype category before genetic testing, not a
  later health outcome for the patients; the abstract gives no calendar period for the trial.
