rationale: The comparison is the NHC report's head-to-head check of the Google DeepMind ensemble (GDMI) against the official forecast and the other guidance models for Melissa (Tables 5b and 6b), together with the report's statement that GDMI guidance increased forecaster confidence in predicting rapid intensification at unusually long lead times.
