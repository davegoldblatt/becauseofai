conflicts: "Google partnered with NHC to train and evaluate the model; verification stats are from NHC and an independent former NHC branch chief."
what_would_change: "A published NHC verification report quantifying the official forecast's error with and without the DeepMind input would move attribution from isolated toward a hard number."
notes: >-
  First explicit Cat 5 forecast settled from the NHC archive: Discussion 18
  (2100 UTC 25 Oct 2025) forecast 140 kt at 48 h while Melissa was at 80 kt
  (Category 1), and cited the Google DeepMind ensembles' Category 5 peak. Earlier
  discussions (15 to 17) held the forecast at 135 kt while noting DeepMind members
  at Category 5. Landfall near New Hope, Jamaica, at 1700 UTC 28 Oct at 185 mph, per
  the NHC update: about 68 hours after the first Cat 5 forecast.
  verify: the Tropical Cyclone Report (original date 25 Feb 2026, later updated) is
  published but the PDF exceeded the weekly run's fetch limit. Read its forecast
  verification section and its Jamaica death toll; no evacuation-timing analysis was found.
