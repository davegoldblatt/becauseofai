id: maryland-ai-tutor-negative
section: not-because
rank: 3
headline: >-
  A GPT-4o tutor built into a university learning platform was associated with
  lower grades in a 2,379-student randomized trial.
impact: "Lower grades (RCT)"
summary: >-
  A University of Maryland working paper (Oct 2026) randomized 30 instructors in
  fall 2025 to a course-integrated GPT-4o tutor drawing on their own materials;
  students with the tutor performed worse.
caveat: >-
  Working paper, not yet peer-reviewed; the estimate is the effect of being
  offered the tutor, not of using it, at one university.
domain: education
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: in
comparison: "Tutor access vs none, instructor-level randomization"
effect:
  relative: "Final grades 0.37 SD lower among sections of the same course; LMS participation 0.90 SD lower"
  absolute: null
reach: "2,379 undergraduates, 30 instructors"
