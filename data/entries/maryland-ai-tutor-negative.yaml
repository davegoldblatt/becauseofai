notes: >-
  Primary located: EdWorkingPaper landing page and abstract (Liu, Sweet, et al.,
  Oct 2026); losses larger for first-generation students. Secondary coverage
  reports only ~15% of students offered the tutor used it, which would make
  this an intent-to-treat effect of access, not of use.
  verify: randomization unit (instructor vs section), fall 2025 term dates, and
  uptake rate from the full PDF; the grade effect is reported for within-course
  comparisons.
