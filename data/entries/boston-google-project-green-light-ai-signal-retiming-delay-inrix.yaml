id: boston-google-project-green-light-ai-signal-retiming-delay-inrix
section: because
rank: 141
headline: >-
  Because of Google's AI signal-timing recommendations, Boston reports an average 13.5%
  reduction in delay at retimed intersections.
impact: "13.5% less delay at retimed intersections"
impact_number: "13.5%"
impact_label: "average reduction in delay at intersections retimed with AI recommendations, city says"
summary: >-
  Boston's Traffic Management Center applied Google Research's Project Green Light
  recommendations, which use AI and Google Maps driving trends, to retime 114 intersections
  in 20 neighbourhoods. The city, with traffic-analytics firm INRIX evaluating, reports
  delay down 13.5% on average and up to 24% at some locations.
caveat: >-
  The city's own announcement. The release does not say over what dates the before and
  after were measured, and the delay figure covers the intersections that were retimed in
  phase 2 of the pilot, not the whole network. Human traffic engineers decide and apply
  each retiming.
