conflicts: >-
  Investigator-led and sponsored by the National Defense Medical Center,
  Taiwan; several authors are from its Military Digital Medical Center. The
  abstract read carries no funding or disclosure statement, and does not say
  who developed the AI-ECG model.
what_would_change: "A larger trial, powered for AF diagnosis, anticoagulation and stroke, showing that AI-ECG-guided monitoring changes treatment or outcomes."
notes: >-
  Filed under not-because: the outcomes that would matter to a patient (AF or
  flutter found, treatment started) did not differ, and the authors call the
  composite primary result fragile. A human may prefer to read it as a narrow
  detection gain; the headline states only what the abstract supports.
  Window argued as ongoing: the registry gives an actual start of 1 July 2025,
  four months before the window opened on 9 November 2025, with 90- and 180-day
  follow-up and an estimated primary completion of July 2026, so the trial
  began before the window and most of its data fall inside it. Not in, because
  it started earlier; not pre, because most of it is in-window. The end is left
  unverified because the registry's completion dates are estimates.
  Evidence A: registered on 26 February 2025, before the start.
  Placed as reasonable: the Circulation page returns HTTP 403 to the gate's
  reader and the paper is not in PMC. The full text would raise it.
  verify: whether the AI-ECG model was developed by the authors' institution,
  and any commercial licence, from the full text's disclosures.
