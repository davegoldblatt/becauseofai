id: latent-ai-ecg-af-null
section: not-because
rank: 8
headline: >-
  An AI-ECG screen of 14,665 adults at a Taiwanese hospital did not
  significantly increase atrial fibrillation diagnoses (0.3% vs 0.2%) or the
  start of antiarrhythmic treatment, compared with usual care.
impact: "No more AF found or treated (RCT)"
impact_number: "0.3% vs 0.2%"
impact_label: "AF or flutter detected, AI-ECG vs usual care, not significant"
summary: >-
  A randomized trial (Circulation, November 2026) applied an AI-ECG model to
  past ECGs of adults aged 40 to 85 without known AF and offered up to seven
  days of Holter monitoring to those it flagged as high risk, against usual
  care with matched controls monitored the same way; new AF or flutter and
  treatment starts did not differ, and the composite primary outcome, driven by
  pre-AF findings such as premature atrial beats, was only marginally higher.
caveat: >-
  Only 84 intervention participants were flagged (78 in control) and 48
  monitored, so the trial had little
  room to change AF diagnoses; the composite primary outcome was nominally
  positive but changes to P = 0.057 if one event is reclassified; only the
  abstract could be read.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: ongoing
comparison: "AI-ECG risk flag with targeted Holter monitoring vs usual care (age- and sex-matched controls given identical monitoring), 1:1 randomization, single centre"
effect:
  relative: "Composite of new AF, flutter or pre-AF findings OR 1.54 (95% CI 1.01–2.37), P = 0.046; P = 0.057 if one event is reclassified"
  absolute: "AF or flutter detected 0.3% vs 0.2%; antiarrhythmic therapy started by 180 days 2.3% vs 2.4%; composite 0.74% vs 0.48%"
reach: "14,665 adults aged 40 to 85 without previous AF, randomized at a single centre in Taiwan; 48 flagged participants and 48 matched controls monitored"
dates:
  achieved_start: 2025-07-01
  achieved_end: null
  published: 2026-11-07
  added: 2026-11-09
  updated: 2026-11-09
