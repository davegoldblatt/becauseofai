id: hmrc-voa-microsoft-copilot-phase-3-randomised-licences-time-saved
section: because
rank: 151
headline: >-
  Because of Microsoft Copilot, HMRC staff randomly given a licence self-reported saving 2-3% of
  their working week, around 60 minutes a week.
impact: "~60 minutes saved per week"
impact_number: "2–3%"
impact_label: "of the working week saved, self-reported by HMRC staff given Copilot"
summary: >-
  HMRC's evaluation of the third phase of its Microsoft 365 Copilot trial randomly allocated 3,000
  licences to staff in office-based roles and surveyed them, reporting a cautious estimate of time
  saved.
caveat: >-
  The time saving is self-reported in a survey answered by 45% of licence holders, then reduced by
  about 20% by the analysts; the report calls it a baseline estimate rather than a precise measure.
domain: work
ai_type: generative
