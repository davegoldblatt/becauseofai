id: rentosertib-phase-3
section: not-yet
rank: 1
headline: >-
  The first generative-AI-discovered drug entered Phase III in September 2026 —
  no AI-discovered drug has yet been approved anywhere.
impact: "Phase III started; 0 approvals"
summary: >-
  Insilico dosed the first patient in GENESIS-IPF-3 (320 patients, 47 Chinese
  sites, 52-week FVC primary endpoint) for rentosertib in idiopathic pulmonary
  fibrosis after a Phase IIa signal published in Nature Medicine (2025).
caveat: >-
  Primary completion is estimated for late 2029; Phase IIa was 71 patients over
  12 weeks.
