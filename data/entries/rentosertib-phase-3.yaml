what_would_change: >-
  A positive 52-week FVC result, then regulatory approval, then patients treated
  outside a trial — each step moves it closer; approval alone does not make it a
  "because" entry.
notes: >-
  Registry (read 2026-10-23): randomized, double-blind, placebo-controlled Phase 3;
  320 planned; actual start 9 September 2026; 47 sites, all in China; primary
  outcome annual FVC decline over 52 weeks; primary completion estimated
  30 October 2029; recruiting. what_would_change not met.
