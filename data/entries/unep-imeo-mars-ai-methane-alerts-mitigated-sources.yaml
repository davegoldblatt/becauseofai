id: unep-imeo-mars-ai-methane-alerts-mitigated-sources
section: because
rank: 100
headline: >-
  Because of AI that screens satellite data for methane plumes, the UN
  Environment Programme says its alert system helped mitigate sources estimated
  to have emitted 1.2 million tonnes of methane.
impact: "Sources estimated to have emitted 1.2M tonnes of methane mitigated"
impact_number: "1.2M"
impact_label: "tonnes of methane, estimated emissions from sources mitigated after UNEP's AI-assisted alerts"
summary: >-
  UNEP's International Methane Emissions Observatory says its Methane Alert and
  Response System uses AI on data from more than 30 satellite instruments, that
  analysts can process 12 to 15 times more data, and that AI-assisted workflows
  helped mitigate sources estimated to have emitted 1.2 million tonnes of
  methane; every AI-flagged detection is verified by analysts before a
  notification is sent.
caveat: >-
  UNEP's own press release about its own system. The 1.2 million tonnes is the
  estimated emissions of the sources mitigated, not a measured reduction, and no
  comparison without the AI is shown.
