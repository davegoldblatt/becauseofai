id: dwp-microsoft-365-copilot-trial-comparison-group-time-saved
section: because
rank: 150
headline: >-
  Because of Microsoft 365 Copilot, DWP staff with a licence saved an average of 19 minutes a day
  across eight routine tasks, compared with similar staff without one.
impact: "19 minutes saved per day"
impact_number: "19 min"
impact_label: "saved per day by DWP staff using Copilot, against non-users"
summary: >-
  The Department for Work and Pensions evaluated a six-month trial of licensed Microsoft 365
  Copilot among 3,549 staff, surveying licence holders and a comparison group of non-users and
  estimating the difference by regression.
caveat: >-
  The report itself lists non-random allocation of licences, self-reported time savings and no
  pre-trial baseline as limitations; the staff were central-office roles, not frontline jobcentre
  staff, so no effect on claimants is measured.
