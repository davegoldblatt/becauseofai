id: st-georges-ed-tortus-ai-scribe-paperwork-time-nhs-pilot
section: because
rank: 117
headline: >-
  Because of AI, emergency clinicians at St George's Hospital in London halved
  their paperwork time, saving each an additional 47 minutes, in an NHS
  England-funded AI-scribe pilot.
impact: "47 minutes of paperwork saved per clinician"
impact_number: "47 min"
impact_label: "paperwork time saved per emergency clinician, as the trust reports"
summary: >-
  St George's University Hospitals NHS Foundation Trust, the only emergency
  department in a pilot run by Great Ormond Street Hospital and funded by NHS
  England, reports that the TORTUS ambient AI-scribing tool halved the time its
  clinicians spent on paperwork and raised patient capacity per shift.
caveat: >-
  The trust's own press release: no comparison group, baseline period, sample
  size or dates are given in it, and the paperwork saving is time, not patient
  outcome.
