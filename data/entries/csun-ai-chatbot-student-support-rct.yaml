id: csun-ai-chatbot-student-support-rct
section: not-because
rank: 13
headline: >-
  An AI text-messaging chatbot at a large public university, tested in a
  randomized trial of two entering cohorts, sped up enrollment steps but left
  GPA, persistence and graduation unchanged over four years.
impact: "Faster paperwork, no change in grades or persistence (RCT)"
impact_number: "+34 pts"
impact_label: "more treated students enrolled by August 16 after the first text reminder; no detectable effect on GPA or persistence"
summary: >-
  California State University, Northridge sent text messages through an
  AI-enabled chatbot to about 4,361 randomly chosen first-year undergraduates
  in the 2018 and 2019 cohorts and compared them with about 4,347 controls. The
  working paper finds large gains on time-sensitive administrative steps and no
  statistically significant difference in enrollment, persistence, credits, GPA
  or four-year graduation.
caveat: >-
  Working paper, not peer-reviewed; the cohorts entered in 2018 and 2019, before
  generative chatbots, so it describes an earlier generation of the tool; most
  targeted-campaign effects (for example FAFSA reminders) could not be measured.
