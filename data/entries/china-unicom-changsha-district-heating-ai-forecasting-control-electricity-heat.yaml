headline: >-
  Because of AI forecasting and control, a Changsha district heating network used
  7% less heat and more than 10% less electricity over a heating season, China
  Unicom says.
impact: "7% less heat, >10% less electricity"
impact_number: "7%"
impact_label: "less heat needed to run a district heating network serving about 60,000 people"
summary: >-
  A China Unicom data scientist told the AI for Good Global Summit 2026 that a
  demand-forecasting and supply-control system, with operators approving its
  decisions, cut heat and electricity use across a private district heating
  network in Changsha for a full heating season.
caveat: >-
  A conference talk by the vendor-side team, written up by the summit organiser;
  no baseline period or control network is stated, and the savings are the
  speaker's own figures.
