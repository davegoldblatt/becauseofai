id: vastra-gotaland-brainomix-thrombectomy-times
section: because
rank: 30
headline: >-
  Because of AI imaging support, stroke patients in western Sweden got to
  thrombectomy faster: the adjusted median from CT to groin puncture fell from
  47 to 35 minutes, though outcomes did not differ.
impact: "CT-to-puncture 47 → 35 min"
impact_number: "47→35 min"
impact_label: "adjusted median from CT to groin puncture after Brainomix 360 Stroke, with no change in patient outcomes"
summary: >-
  A register-based cohort of 970 thrombectomy patients at Sahlgrenska University
  Hospital compared the periods before and after regional introduction of the
  Brainomix 360 Stroke imaging tool; workflow times fell, mainly at primary
  stroke centres.
caveat: >-
  A retrospective before-and-after comparison with no concurrent control, and no
  significant difference in clinical outcomes; read from the vendor's summary of
  the journal abstract.
