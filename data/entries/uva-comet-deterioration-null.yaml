id: uva-comet-deterioration-null
section: not-because
rank: 2
headline: >-
  Displaying AI deterioration-risk scores on a cardiology ward did not improve
  patient outcomes across 10,422 admissions.
impact: "No change in primary outcome"
summary: >-
  A cluster-randomized trial at UVA (Scientific Reports, Feb 2026) showed CoMET
  risk trajectories on screens for intervention beds; event-free hours did not
  differ, and clinicians moved 11% of patients into or out of display beds,
  undermining the design.
caveat: >-
  Passive display with no mandated response, run during COVID-era staffing;
  sicker patients were preferentially moved into AI-monitored beds.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Display-on vs display-off beds, cluster-randomized by room"
effect:
  relative: "No significant difference in event-free hours or 21-day mortality"
  absolute: null
reach: "10,422 inpatient visits, 85 beds"
