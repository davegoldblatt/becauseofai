comparison: "Grades randomly assigned to Khan Academy with the Khanmigo AI tutor vs control grades in the same school continuing usual remedial math instruction (teacher-led practice and other math software)"
effect:
  relative: "Assignment raises math achievement by 1.3 national percentile ranks per term, about 0.06 to 0.08 standard deviations over a school year"
  absolute: "The implied effect of a full year of active participation is 0.14 standard deviations"
