id: khanmigo-hamilton-county-remedial-math-rct
section: because
rank: 47
headline: >-
  A two-year cluster randomized trial in 18 Tennessee middle schools found that
  remedial-math students given Khan Academy with the Khanmigo AI tutor gained 1.3
  national percentile ranks per term more than control grades, a small gain the
  authors say resembles Khan Academy practice without AI.
impact: "Small math gain per term for students assigned the AI tutor (cluster RCT)"
impact_number: "+1.3"
impact_label: "national percentile ranks per term in math for students assigned Khan Academy with the Khanmigo AI tutor"
summary: >-
  An EdWorkingPaper reports a cluster randomized trial in Hamilton County,
  Tennessee, in which whole grades within each of 18 middle schools were assigned
  to use Khan Academy with Khanmigo, an AI tutor configured to coach rather than
  give answers, during existing daily remedial math sessions. Students in control
  grades kept their usual remedial instruction. The authors find students
  rarely engaged the tutor in real dialogue.
caveat: >-
  Working paper, not peer-reviewed; the gain resembles Khan Academy practice
  without AI, so the AI tutor itself is not shown to add to the platform; students
  used the tutor infrequently; treated grades ended up concentrated in higher
  grades by chance in year one.
