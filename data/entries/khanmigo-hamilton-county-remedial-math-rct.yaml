conflicts: >-
  Supported by the Smith Richardson Foundation, SSHRC, NSERC and J-PAL; Khan
  Academy staff guided the platform setup, facilitated the district partnership
  and provided the platform data under a data-sharing agreement. The second author
  is at Charles River Associates. Registered as AEARCTR-0013519.
what_would_change: "Evidence that an intervention which gets students to engage with the tutor produces gains larger than Khan Academy practice alone."
notes: >-
  Dates from Table 1: the first measured term's remedial sessions began on 4 November 2024 (Year 1, 2024-25) and the last testing period ended on 8 May 2026; Fall 2024 is excluded by design. Window ongoing, argued: three of the five measured terms ran before the window opened in November 2025, and the last two (Winter and Spring 2026) are inside it, so this is a programme that began earlier with new in-window data, not a benefit that occurred inside the window. The verifier read it as in.
  verify: control students used other math software without AI, and the authors say the gains resemble those from Khan Academy without AI assistance, so the AI-specific contribution is unclear.
