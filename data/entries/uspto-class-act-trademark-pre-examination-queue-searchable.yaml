id: uspto-class-act-trademark-pre-examination-queue-searchable
section: because
rank: 153
headline: >-
  Because of Class ACT, the USPTO says trademark applications waiting in its pre-examination queue
  became searchable in minutes rather than months, with 250,000 applications analysed.
impact: "250,000 trademark applications analysed"
impact_number: "250,000"
impact_label: "trademark applications analysed by the USPTO's Class ACT AI tool"
summary: >-
  The US Patent and Trademark Office reports that its Classification Agentic Codification Tool,
  introduced in 2026, assigns international classes and design search codes and made records in the
  pre-examination queue searchable at once, reducing pendency from months to minutes.
caveat: >-
  The agency's own news item. It gives no dates, no before-and-after figures beyond "months to
  minutes", and does not say which pendency measure it means or how overall trademark examination
  time changed.
