id: ai-reconstruction-ultra-low-dose-ctpa-rct
section: because
rank: 64
headline: >-
  Because of AI, a deep learning CT reconstruction algorithm let a pulmonary CT angiography protocol cut effective radiation dose
  by 84.93% in a randomized trial of low-BMI patients while keeping diagnostic image quality.
impact: "84.93% lower CT radiation dose"
impact_number: "84.93%"
impact_label: "lower effective radiation dose in pulmonary CT angiography with the ultra triple-low protocol"
summary: >-
  Patients were randomized to a standard CTPA protocol or to a 60 kVp, 10 ml contrast protocol read with a deep learning
  reconstruction algorithm, and radiation dose and image quality were compared.
caveat: >-
  Only the abstract was readable; the dose cut comes from the lower-dose protocol as a whole, with the AI reconstruction
  making it diagnostic, and the authors call it a feasibility study that warrants further validation.
