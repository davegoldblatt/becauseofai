comparison: "Ultra triple-low protocol (60 kVp, 10 ml iodine contrast, 2.5 ml/s) reconstructed with a deep learning algorithm vs a standard protocol (100 kVp, 30 ml, 4 ml/s) in randomized CTPA patients"
effect:
  relative: "Effective dose reduced by 84.93%"
  absolute: "Effective dose 0.71 ± 0.09 mSv vs 4.71 ± 1.13 mSv"
reach: "Seventy patients with low body mass index undergoing pulmonary CT angiography, randomised to two protocols"
