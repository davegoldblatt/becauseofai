headline: >-
  Because of AI, Baptist Health in Arkansas says it has cut emergency-room
  boarding by about 525 patients a month, using predictive discharge analytics
  across its 12 hospitals.
impact: "~525 fewer ER boarders a month"
impact_number: "~525"
impact_label: "fewer patients boarding in the ER each month"
summary: >-
  In a September 2026 interview with a trade outlet, a Baptist Health (Arkansas)
  executive said that AI-powered predictive analytics for early discharge,
  supplied by LeanTaaS, moved discharge orders earlier and reduced ED boarding
  by about 525 patients each month.
caveat: >-
  An executive's account in an interview, with no baseline period, no
  comparison group and no dates given; the change also rested on process and
  governance changes beyond the model.
