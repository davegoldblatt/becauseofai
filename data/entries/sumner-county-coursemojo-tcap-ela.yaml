headline: >-
  Sumner County Schools in Tennessee says middle-school groups averaging 25 or more
  Coursemojo AI activities per student improved TCAP English proficiency by 3.7
  percentage points, against -0.2 for groups with little or no use.
impact: "Higher ELA proficiency gain where the AI teaching assistant was used more (district preliminary analysis)"
impact_number: "+3.7 pts"
impact_label: "ELA proficiency in middle-school groups with 25 or more Coursemojo activities per student, vs -0.2 with little or no use"
summary: >-
  A WSMV report on a Sumner County Schools press release says the district's
  preliminary analysis of 2026 TCAP English Language Arts data found larger
  proficiency gains in school-grade groups that used the Coursemojo AI teaching
  assistant more. The district says the comparison is among groups with different
  levels of use, not against schools that did not use the platform.
caveat: >-
  A news report of the district's own preliminary analysis; the comparison is among
  groups by level of use, so schools that used it more may differ in other ways;
  the district was not top in the state for proficiency increase; the report says
  it is unclear how much influence Coursemojo had.
