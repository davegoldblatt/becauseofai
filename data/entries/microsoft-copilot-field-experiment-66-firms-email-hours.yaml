id: microsoft-copilot-field-experiment-66-firms-email-hours
section: because
rank: 93
headline: >-
  Because of a generative AI assistant built into email, meetings and writing apps, randomly
  selected knowledge workers at 66 firms spent about 1.4 fewer hours a week in email sessions
  in months 4 to 6, a 12% decline.
impact: "1.4 fewer hours a week on email (12%), randomized"
impact_number: "1.4 hrs"
impact_label: "less email time per week among workers given Copilot (12% decline, months 4 to 6)"
summary: >-
  A working paper by Microsoft Research and Harvard Business School reports a field experiment
  in which 7,137 knowledge workers at 66 firms were randomly selected to get Microsoft 365
  Copilot. Using telemetry, the authors find less time in email and more email-free blocks of
  time, and no detectable shift in meetings or the mix of tasks.
caveat: >-
  A preprint, not peer-reviewed, by authors at the vendor. The figure is an intent-to-treat
  estimate from usage telemetry, not worker-reported or measured output, and email time is
  inferred from reading-pane activity. Treated workers were free not to use the tool. The paper
  finds no change in meetings or Word time and no shift in the composition of tasks.
domain: work
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: null
comparison: "Workers randomly selected to receive Copilot licences vs eligible workers who did not, at the same 66 firms, compared with their own pre-period"
effect:
  relative: "A 12% decline from the pre-period average email time (17% for workers who used the tool)"
  absolute: "An average of 1.4 fewer hours per week in email sessions over post-period months 4-6 (2 hours for workers who used the tool)"
reach: "7,137 knowledge workers (3,684 treated) at 66 firms"
dates:
  achieved_start: null
