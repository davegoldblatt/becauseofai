sources:
  - title: "Dillon, Jaffe, Immorlica and Stanton: Shifting Work Patterns with Generative AI (arXiv 2504.11436 v4, NBER Working Paper 33795)"
    url: https://arxiv.org/pdf/2504.11436
    type: primary
conflicts: >-
  Two authors are at Microsoft Research, which makes the tool studied (Microsoft 365 Copilot),
  and Outlook session metrics were developed in consultation with the Microsoft product team
  that manages the telemetry. The paper is a preprint.
what_would_change: "A replication by authors independent of the vendor, or output and wage measures showing whether the saved email time was turned into other work."
notes: >-
  verify: the paper gives licence start dates between September 2023 and April 2024 and a 24-week
  post period, but no single achieved period for the headline estimate, so achieved dates and window
  are left empty.
  verify: the headline figure is the intent-to-treat estimate; the 2-hour figure is the effect on
  workers who used the tool.
