id: access2-autonomous-ai-diabetic-eye-exam-youth-screening-completion
section: because
rank: 125
headline: >-
  Because of an autonomous AI eye exam at the point of care, 98% of non-White and 99.5% of White youth with
  diabetes completed a diabetic retinopathy screen, though before it fewer non-White youth had had a prior exam.
impact: "Near-equal completion of diabetic eye screening in youth, at the clinic visit"
impact_number: "98%"
impact_label: "of non-White youth with diabetes completed a diabetic eye exam at the visit (99.5% of White youth)"
summary: >-
  In a prospective single-group study of 397 youth with type 1 or type 2 diabetes, an autonomous AI eye exam
  was done at diabetes care visits. Prior exam completion had been lower in the non-White cohort (61.8% v 79.8%);
  after the AI exam was offered, completion was 98% against 99.5%, meeting the equivalence endpoint.
caveat: >-
  Single group with no concurrent comparison arm: the before comparison is self-reported prior exam history, not
  a control group. Only the abstract could be read; sensitivity of 100% rests on a small number of cases (95% CI 67.6 to 100).
