id: kisan-emitra-ai-chatbot-pm-kisan-queries
section: because
rank: 75
headline: >-
  Because of Kisan-eMitra's AI upgrade, India's PM-KISAN chatbot answered 2.69 million
  farmer queries in 186 days, a 668% increase over manual grievance handling, Wadhwani AI says.
impact: "2.69 million farmer queries answered in 186 days"
impact_number: "2.69M"
impact_label: "farmer queries answered in 186 days by the PM-KISAN chatbot, Wadhwani AI says"
summary: >-
  Wadhwani AI reports that after it added language-model and translation features to the
  government's Kisan-eMitra chatbot in February 2024, the chatbot answered 2.69 million
  PM-KISAN queries in 186 days, about 13,000 a day, in 11 languages.
caveat: >-
  Wadhwani AI's own blog post. The 668% figure carries an unexplained asterisk, "answered"
  is not the same as "resolved to the farmer's satisfaction", and no comparison period or
  independent audit is given.
domain: infrastructure
