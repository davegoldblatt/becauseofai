conflicts: >-
  The source is Wadhwani AI's own post about a chatbot it helped build, with support from
  Google.org. The chatbot belongs to India's Ministry of Agriculture and Farmers' Welfare.
  No independent audit of the counts.
what_would_change: "A published evaluation of how many queries were resolved without escalation, with the baseline period for the manual process stated."
notes: >-
  verify: the post says "since the introduction of new AI features" and gives 186 days but
  no calendar dates (the features were integrated in February 2024), so achieved dates and
  the window grade are left empty. verify: the 668% has an asterisk with no footnote in the
  text read. The announcement is from November 2025, outside the slice window.
