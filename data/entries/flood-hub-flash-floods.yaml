headline: >-
  Google's urban flash-flood model now gives up to 24 hours' notice worldwide;
  whether anyone acted on an alert hasn't been measured.
impact: "24h flash-flood alerts, global"
summary: >-
  Launched March 2026, the model is trained on news-derived ground truth, with
  precision and recall in South America and Southeast Asia comparable to rich
  countries; Flood Hub covers 150+ countries.
caveat: >-
  Evaluated against flood records, not against outcomes for people.
