rationale: The only comparison is the model's precision and recall against news-derived Groundsource and GDACS flood records, benchmarked against aggregated NWS warnings in the U.S. (recall 0.32 vs 0.22, precision 0.26 vs 0.44 at threshold 0.7). That measures forecast skill, not any change in what happened to people, so it cannot show the AI caused a benefit.
