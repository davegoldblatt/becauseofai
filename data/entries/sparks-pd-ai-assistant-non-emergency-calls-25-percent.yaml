id: sparks-pd-ai-assistant-non-emergency-calls-25-percent
section: because
rank: 111
headline: >-
  Because of an AI call assistant, Sparks Police in Nevada says it answered 25%
  of its non-emergency calls in the system's first two weeks.
impact: "25% of non-emergency calls answered by AI"
impact_number: "25%"
impact_label: "of non-emergency calls answered by an AI assistant at a police dispatch centre"
summary: >-
  Sparks Police Department (Nevada) put an AI assistant on its non-emergency
  line. Police1 reports that after two weeks it had answered 25% of those calls,
  about 1,500 calls, easing pressure on dispatchers who also work radio channels.
caveat: >-
  Early, self-reported figure from the first two weeks. It shows calls handled by
  the AI, not wait times, caller outcomes or any change in 911 answer times.
