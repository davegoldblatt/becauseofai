id: gpt4o-prompt-loop-virtual-microscopy-histology-students-pilot-rct
section: because
rank: 148
headline: >-
  Because of AI, first-year medical students who used a GPT-4o "Prompt Loop" to check its errors while learning histology
  scored 78.0 on a morphologic reasoning assessment against 67.1 for students using standard virtual microscopy.
impact: "Total score 78.0 vs 67.1 (p = 0.003)"
impact_number: "78.0 vs 67.1"
impact_label: "total histology assessment score with a GPT-4o verification workflow vs standard virtual microscopy"
summary: >-
  A pilot randomized trial in first-year medical students compared standard virtual microscopy study with a four-stage
  Observation, Reasoning, Verification and Consolidation workflow in which a multimodal AI assistant's mistakes were used as
  prompts to check evidence, and tested both groups on a supervised morphologic reasoning assessment.
caveat: >-
  Only the abstract could be read. This is a small single-course pilot, the outcome is an in-course assessment, the AI
  was used inside a structured workflow rather than freely, and the abstract gives no dates, funding or conflicts.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: null
comparison: "VM Prompt Loop (GPT-4o in a four-stage observe, reason, verify, consolidate cycle) vs standard virtual microscopy learning, first-year medical students randomized in parallel groups"
effect:
  relative: null
  absolute: "Total score 78.0 ± 13.5 vs 67.1 ± 12.0 (p = 0.003; Cohen's d = 0.85); morphologic reasoning 38.4 ± 10.2 vs 31.0 ± 8.2 (p = 0.005); identification scores not significantly different (p = 0.073)"
reach: "55 first-year medical students: 28 in standard virtual microscopy, 27 in the Prompt Loop"
