id: insilico-ism6331-tead-inhibitor-mesothelioma-phase-1
section: because
rank: 90
headline: >-
  Because Insilico designed ISM6331 with generative chemistry software, four of 22 evaluable previously treated
  mesothelioma patients had partial responses in the first human data, reported at ESMO 2026.
impact: "4 of 22 patients had partial responses"
impact_number: "18.2%"
impact_label: "response rate in 22 evaluable mesothelioma patients on an AI-designed drug, uncontrolled phase 1"
summary: >-
  An uncontrolled phase 1 dose-escalation trial of ISM6331, an oral TEAD inhibitor designed with Insilico's Chemistry42
  generative chemistry software, reported partial responses in four of 22 evaluable mesothelioma patients.
caveat: >-
  An uncontrolled dose-escalation trial reported through trade press; no comparison arm, the study is ongoing, and the
  response rate says nothing yet about survival or about how much of the result is due to the AI design step.
