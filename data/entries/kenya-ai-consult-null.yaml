  - title: "University of Birmingham news release"
    url: https://www.birmingham.ac.uk/news/2026/ai-clinical-support-tool-improved-clinician-decisions-in-real-world-primary-care-trial
    type: secondary
conflicts: >-
  Funded by the Gates Foundation; run in Penda Health clinics, with two Penda
  authors holding stock options; OpenAI gave Penda in-kind compute credits and
  API guidance but had no stated role in the trial.
what_would_change: "A trial powered for patient outcomes (the authors suggest very large samples) showing fewer treatment failures."
notes: >-
  Pairs with the earlier Penda/OpenAI quality-improvement study of an almost
  identical tool (Korom et al., preprint), which reported fewer clinician
  errors without patient-outcome randomization. Clinicians fully followed only
  19.5% of 1,000 reviewed red alerts. Protocol violations: 45 control-arm
  encounters had tool access through an EMR configuration error.
