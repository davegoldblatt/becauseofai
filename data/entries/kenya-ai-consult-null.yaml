id: kenya-ai-consult-null
section: not-because
rank: 5
headline: >-
  A GPT-4o assistant built into the medical record improved Kenyan clinicians'
  notes and plans but did not reduce treatment failure for 9,691 patients.
impact: "Null on patient outcome (RCT)"
summary: >-
  A pragmatic cluster-randomized trial in 16 Penda Health clinics in Nairobi
  (Nature Medicine, June 2026) gave 52 of 103 clinical officers the AI Consult
  tool; treatment failure within 14 days was 2.2% with it vs 2.0% without
  (adjusted OR 0.77, p=0.13), while blinded reviewers rated diagnoses, notes,
  and treatment plans better in the AI arm.
caveat: >-
  The event rate was lower than planned, so the trial could miss a modest
  benefit; one private urban network with a high baseline standard of care.
domain: medicine
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Clinical officers with EMR plus LLM assistance vs EMR alone, cluster-randomized; primary endpoint expert-adjudicated treatment failure within 14 days"
effect:
