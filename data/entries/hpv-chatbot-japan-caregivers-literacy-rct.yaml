id: hpv-chatbot-japan-caregivers-literacy-rct
section: because
rank: 60
headline: >-
  Because of AI, caregivers in Japan answered 0.30 more of 7 HPV vaccine questions correctly after using a GPT-4o chatbot
  than after reading the government leaflet, in a randomized trial of 848 caregivers; their vaccination decisions did not differ.
impact: "+0.30 on a 7-point literacy test"
impact_number: "+0.30"
impact_label: "points higher HPV vaccine literacy (0 to 7 scale) than with the government leaflet"
summary: >-
  Female caregivers of unvaccinated daughters in Japan were randomized to an AI chatbot or the health ministry's HPV
  vaccine leaflet, and factual HPV vaccine literacy was scored immediately and again two weeks later.
caveat: >-
  Literacy improved by a small margin and the effect did not carry into vaccination decisions at two weeks (self-reported,
  not verified uptake); a large share of participants were lost by the two-week follow-up and the sample was well educated.
domain: medicine
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "GPT-4o HPV vaccine chatbot with a Japan-specific reference library vs the Ministry of Health, Labour and Welfare's HPV vaccine leaflet, randomized 1:1 among online-panel caregivers in Japan"
effect:
  relative: null
  absolute: "Adjusted mean difference 0.30 points on the 0 to 7 literacy scale (95% CI 0.18-0.43) immediately after the intervention"
reach: "848 female caregivers of unvaccinated daughters aged 12 to 18 years in Japan, recruited through an online research panel"
dates:
  achieved_start: 2024-11-30
