    doi: 10.1001/jamanetworkopen.2026.34696
    type: primary
conflicts: "Funded by AIR@InnoHK (Innovation and Technology Commission); the funder had no role in the study. The authors report no conflicts of interest. The participants were an online panel, not patients in routine care."
what_would_change: "A pragmatic trial that adds the chatbot to clinician or municipal recommendations and measures verified HPV vaccine uptake."
notes: >-
  verify: the trial ran online with a survey panel, so the chatbot reached caregivers in a study setting rather than in a public rollout.
  verify: ClinicalTrials.gov NCT06702423; the two-week analysis included 477 of 841 Japan-resident randomized participants.
