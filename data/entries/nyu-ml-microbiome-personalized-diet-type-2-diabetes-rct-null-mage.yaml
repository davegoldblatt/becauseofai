id: nyu-ml-microbiome-personalized-diet-type-2-diabetes-rct-null-mage
section: not-because
rank: 36
headline: >-
  A machine-learning diet tool that predicted each patient's blood-sugar response to meals did not lower glucose
  swings at six months compared with the same counseling without it, in a randomized trial in New York City adults
  with early type 2 diabetes.
impact: "No difference from standard diet counseling"
summary: >-
  Adults with early type 2 diabetes got Mediterranean-diet counseling with or without meal-by-meal predictions from a
  gut-microbiome machine-learning algorithm, and glucose variability (MAGE) on continuous monitors was compared with
  usual care.
caveat: >-
  The registry record gives group means with no between-group test, and the personalized arm was closed early so it is
  smaller than the other two arms.
