headline: >-
  Macquarie University says second-year psychology students who used its Virtual Peer
  AI chatbot in the two weeks before the final exam scored nearly five marks higher, a
  9.45 per cent improvement, than non-users, in a pilot of 1,400 students.
impact: "9.45% higher exam scores for users of the Virtual Peer AI study chatbot than non-users (university pilot)"
impact_number: "+9.45%"
impact_label: "higher final-exam scores for second-year psychology students who used the Virtual Peer AI chatbot than for non-users"
summary: >-
  A Microsoft customer story reports a Macquarie University pilot of Virtual Peer, a
  retrieval-grounded chatbot built on Azure OpenAI that answers study and
  administrative questions from the unit's own materials. Exam scores are compared
  between users and non-users, controlling for past achievement.
caveat: >-
  A vendor customer story of the university's own pilot; students chose whether to use
  the chatbot, so users may differ from non-users in ways past grades do not capture;
  no control group was assigned; the report is dated 2025, before this window.
