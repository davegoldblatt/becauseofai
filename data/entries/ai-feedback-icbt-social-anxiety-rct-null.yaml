id: ai-feedback-icbt-social-anxiety-rct-null
section: not-because
rank: 16
headline: >-
  Psychologist-reviewed AI-generated feedback in internet-delivered CBT for social anxiety was not shown to match
  therapist feedback in a randomized trial of 263 adults: the difference was small and inconclusive.
impact: "No clear difference, non-inferiority not shown"
impact_number: "1.15"
impact_label: "SPIN points higher with AI feedback than human feedback at post-treatment, not significant"
summary: >-
  Adults with social anxiety disorder got the same internet CBT course with feedback written by AI or by a human
  therapist (each reviewed by a psychologist), and symptom change on the Social Phobia Inventory was compared.
caveat: >-
  Non-inferiority was not established and many participants lacked post-treatment data; guided CBT also did not
  clearly beat unguided self-help here, so the trial cannot show that the feedback itself did the work.
