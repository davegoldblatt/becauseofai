notes: >-
  Window argued as pre (the verifier said in on 2026-10-24). The registry gives
  an actual start of 5 May 2025 and an actual completion of 28 November 2025, so
  about five of the study's roughly 29 weeks fall inside the window that opened
  on 26 October 2025; the benefit mostly predates it and only the publication
  (October 2026) is new. This is a judgment on a straddling study, not a fact
  either side can quote; a human should settle it.
  verify: the paper says students enrolled "between May and November 2025" with
  six weeks of follow-up, which would run past the registry's 28 November 2025
  completion date for anyone enrolled in late November.
  verify: the registry (first posted 31 October 2024) lists the Flourishing
  Scale, PHQ-8, GAD-7, PSS-4, affect and resilience as primary outcomes at six
  weeks and three months; the paper reports PSS-4, PHQ-2 and GAD-2 at six
  weeks, and the headline meaningful-improvement figure is an analysis of
  elevated-baseline students. Evidence stays A for randomization and
  registration, but the headline is not a registered primary endpoint as
  written, and three-month results are not reported.
  verify: the app bundles an AI coach with non-AI activities, habit tracking and a
  moderated community, hence bundled; the arms do not isolate the AI alone.
  verify: the meaningful-improvement analysis is limited to elevated-baseline
  students with observed Week 6 data (88 of 123 and 101 of 153 for depression);
  the conservative analysis counting missing as non-responders gave RR 1.79.
  verify: primary-outcome trajectories were small (condition × time β −0.03 to
  −0.04); Week 6 between-group d 0.18–0.22.
  Registered as NCT06668532 (submitted 29 October 2024), checked against the
  registry record on 2026-10-25; the registered site is the University of
  Manitoba.
