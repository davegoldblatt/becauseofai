id: ucd-als-speech-bci
section: because
rank: 10
headline: >-
  Because of AI, a man with ALS has spoken with his family and kept working from
  home for two years through a brain implant, at up to 99% word accuracy.
impact: "2 years of independent speech"
impact_number: "2 yrs"
impact_label: "of independent speech at home, up to 99% word accuracy"
summary: >-
  UC Davis's intracortical BCI uses deep-learning brain-to-text and cursor
  decoders with continuous fine-tuning; Nature Medicine (June 2026) documented
  Casey Harrell's near-daily unassisted use at home for roughly two years.
caveat: >-
  One participant, an experimental device implanted in 2023, not commercially
  available; some BCIs in other ALS patients have later stopped working.
