id: geisinger-ml-colorectal-outreach
section: because
rank: 32
headline: >-
  Because of a machine-learning model that found people overdue for bowel cancer
  screening, Geisinger patients who got nurse outreach were 6% more likely to
  have a colonoscopy within three months, and two-year mortality was 6.2% lower.
impact: "6.2% lower two-year mortality"
impact_number: "6.2%"
impact_label: "reduction in two-year mortality associated with ML-guided colorectal screening outreach at Geisinger"
summary: >-
  Geisinger health system used a model on blood counts, age and sex to pick
  patients at elevated colorectal cancer risk who were overdue for screening,
  and nurse coordinators contacted them. A study in Manufacturing & Service
  Operations Management compared them with similar patients not contacted.
caveat: >-
  Read from the journal publisher's press release, not the paper; the mortality
  result is an observational association, and the outreach combines the model's
  selection with human nurse contact.
