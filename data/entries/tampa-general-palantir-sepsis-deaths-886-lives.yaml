id: tampa-general-palantir-sepsis-deaths-886-lives
section: because
rank: 116
headline: >-
  Because of AI, Tampa General Hospital reports that Palantir's sepsis software
  has saved 886 lives since August 2022, with sepsis deaths cut by 68%.
impact: "886 lives saved (hospital's estimate)"
impact_number: "886"
impact_label: "lives the hospital says its sepsis software has saved"
summary: >-
  A June 2026 news report says Tampa General Hospital in Florida uses Palantir
  software that pulls vital signs, labs and clinician notes together to flag
  early sepsis, letting doctors detect it within an hour of admission so nurses
  give antibiotics sooner. The hospital reports 886 lives saved and the report
  cites research in the Times of a 68% cut in sepsis deaths.
caveat: >-
  A newspaper's account of the hospital's own figures: no baseline period,
  denominator or method is given, "lives saved" is a modelled estimate, and the
  68% figure is relayed from a report the entry could not read.
