conflicts: >-
  The figures are the hospital's own report about its own programme, relayed by
  a newspaper; the software is from the vendor Palantir, the hospital's partner.
  The 68% figure is attributed to a Times article, not read here. No independent
  audit.
what_would_change: "The hospital's own data release or a peer-reviewed evaluation with a baseline period, case counts and risk adjustment."
