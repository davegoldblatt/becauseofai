id: nigeria-edo-copilot-english-tutoring-world-bank-rct
section: because
rank: 130
headline: >-
  In a randomised trial in Nigeria, six weeks of GPT-4-powered Microsoft Copilot
  tutoring for first-year senior secondary students raised English scores by 0.23
  standard deviations, and a wider curriculum assessment by 0.31 standard deviations.
impact: "0.23 SD higher English scores after six weeks of AI tutoring (RCT, Nigeria)"
impact_number: "+0.23 SD"
impact_label: "English learning gain after six weeks of AI tutoring for first-year senior secondary students in Nigeria"
summary: >-
  A World Bank working paper reports a randomised controlled trial of a virtual
  tutoring programme that used Microsoft Copilot (GPT-4) to support English language
  learning in Nigerian secondary schools, with gains on a curriculum-aligned assessment
  and in English, the main outcome.
caveat: >-
  Read here from the abstract only; the study period is not dated in the abstract; the
  programme is a package (teacher-supervised tutoring sessions plus the tool), so the
  gain is for the programme, not for the model alone; short follow-up of six weeks.
domain: education
ai_type: generative
grades:
  evidence: A
  attribution: bundled
  window: null
comparison: "Students randomised to the Copilot tutoring programme vs students receiving business-as-usual schooling, assessment of English and related topics after six weeks"
effect:
  relative: "Improvement of 0.31 standard deviation on the overall assessment; 0.23 standard deviations in English, the main outcome"
  absolute: "Equating to 1.5 to 2 years of 'business-as-usual' schooling"
reach: "First-year senior secondary students in Nigeria, six weeks of English tutoring"
