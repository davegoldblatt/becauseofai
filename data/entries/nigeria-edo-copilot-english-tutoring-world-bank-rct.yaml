conflicts: >-
  The authors are World Bank staff and a Nigerian partner evaluating a programme the
  World Bank supported; the tool is Microsoft's Copilot. Working paper, not
  peer-reviewed.
what_would_change: "The full text, with the trial dates, sample size and registration, read and checked."
notes: >-
