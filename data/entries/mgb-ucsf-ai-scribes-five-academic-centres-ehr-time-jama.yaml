id: mgb-ucsf-ai-scribes-five-academic-centres-ehr-time-jama
section: because
rank: 115
headline: >-
  Because of AI, clinicians who adopted ambient AI scribes at five US academic
  health systems spent 16.0 fewer minutes on documentation than comparison
  clinicians, with a modest rise in weekly visits.
impact: "16 fewer minutes of documentation"
impact_number: "−16.0 min"
impact_label: "documentation time, AI scribe adopters vs comparison clinicians"
summary: >-
  A JAMA multisite cohort study (April 2026) of 8,581 ambulatory clinicians at
  five US academic institutions compared clinicians who adopted AI scribes with
  those who did not, using difference-in-differences. Adopters spent fewer
  minutes on the EHR and on documentation and delivered slightly more visits a
  week; EHR time outside work hours did not change significantly.
caveat: >-
  Observational; scribe access was an opt-in choice at four of the five sites, so
  adopters may differ from non-adopters. Only the abstract could be read. The
  reduction is modest and the abstract reports no change in after-hours EHR time.
domain: work
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Clinicians who adopted AI scribes against clinicians at the same institutions who did not, difference-in-differences before and after adoption"
effect:
  relative: null
  absolute: "13.4 (95% CI, 9.1-17.7) fewer minutes of EHR time and 16.0 (95% CI, 13.7-18.3) fewer minutes of documentation time, normalized to 8 scheduled patient hours"
reach: "8581 clinicians, including 1809 AI scribe adopters"
