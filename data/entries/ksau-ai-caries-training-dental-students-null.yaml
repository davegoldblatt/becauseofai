id: ksau-ai-caries-training-dental-students-null
section: not-because
rank: 14
headline: >-
  AI-assisted radiograph training did not significantly improve undergraduate dental students' diagnosis of
  proximal caries compared with conventional training, in a randomized study of 79 students in Saudi Arabia.
impact: "No gain in caries diagnosis (RCT)"
impact_number: "79"
impact_label: "dental students trained with or without AI: no significant difference in diagnostic score"
summary: >-
  Dental students at two Saudi colleges were randomly assigned to a one-hour bitewing radiograph training
  session with or without an AI tool (Second Opinion) and then tested without it; scores did not differ, though the AI group finished the post-test faster.
caveat: >-
  A single one-hour session and one-day follow-up with a post-test of 20 radiographs; the study measures student test scores, not patient care, and the speed finding was exploratory.
