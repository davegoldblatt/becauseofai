id: warddeken-megadetector-camera-trap-images-rangers-arnhem
section: because
rank: 101
headline: >-
  Because of the MegaDetector AI model, Indigenous rangers in West Arnhem had
  81.4 per cent fewer camera-trap images to analyse, Charles Darwin University
  reports.
impact: "81.4% fewer images to analyse"
impact_number: "81.4%"
impact_label: "fewer camera-trap images for Indigenous rangers to analyse, after an AI pre-filter"
summary: >-
  A Charles Darwin University news item on research with Warddeken Land
  Management and CSIRO says MegaDetector cut the images needing analysis from
  925,088 to 172,290, shortening processing time from six months to two months,
  and that the time rangers gave to processing fell, freeing time for language
  documentation.
caveat: >-
  A university newsroom summary of a published study, read as a news item, not the
  paper. It shows time saved on image sorting, not conservation outcomes, and
  people still verify the detections.
