    url: https://www.nber.org/papers/w35720
    type: primary
conflicts: >-
  The study was conducted by Google, whose AI assistant was tested, and funded by Google for its
  direct costs. Five authors are Google employees with equity, one is a paid Google contractor,
  and the lead author acknowledges Google-linked fellowship support. Pre-registered as
  AEARCTR-0015823 on 21 May 2025.
what_would_change: "A replication by authors independent of the developer on live client matters, with longer follow-up on junior lawyers."
