id: google-ai-patent-drafting-assistant-lawyers-three-month-rct
section: because
rank: 99
headline: >-
  Because of a custom AI patent-drafting assistant, 133 practising patent lawyers randomly given
  access produced drafting work scored 0.38 SD higher at 90 days, and senior lawyers kept an
  advantage when redlining without AI.
impact: "Drafting quality +0.38 SD at 90 days (randomized, blinded scoring)"
impact_number: "+0.38 SD"
impact_label: "drafting quality at 90 days for patent lawyers given an AI drafting assistant"
summary: >-
  An NBER working paper reports a pre-registered three-month randomized trial in which 133
  patent lawyers at eleven U.S. law firms were given a custom AI drafting assistant. Blinded
  expert attorneys scored the work. Quality was higher with the assistant at 10 and 90 days,
  and after three months, tested without AI, treated lawyers outperformed controls, but the
  gain was concentrated among senior lawyers.
caveat: >-
  Read from the NBER abstract page only (reasonable at best). The delivered-work gains were on
  benchmark patent drafting tasks, not live client matters. Junior lawyers showed no average
  gain when later working without AI. The study was run and funded by Google, the tool's
  developer. Working paper, not peer-reviewed.
domain: work
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: null
comparison: "Patent lawyers randomized to a custom AI drafting assistant vs lawyers not given it, with all work scored by blinded expert patent attorneys"
effect:
  relative: "AI access raised the quality of work delivered on benchmark patent drafting tasks at 10 days (0.34 SD) and 90 days (0.38 SD)"
  absolute: "Without AI after three months, treated lawyers outperformed controls by 0.32 SD (0.45 SD among senior lawyers, no average gain among junior lawyers)"
reach: "133 practicing patent lawyers at eleven U.S. intellectual property law firms"
