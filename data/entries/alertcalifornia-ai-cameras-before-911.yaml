conflicts: >-
  The figures are CAL FIRE's own data as relayed by a security-industry
  trade outlet that also promotes the camera vendor Axis Communications; the
  programme is run by UC San Diego. The report is not independent of the
  vendor or the agency.
what_would_change: "CAL FIRE's or ALERTCalifornia's published detection log with alert and 911 times, and the acreage of fires caught early against comparable fires."
notes: >-
  verify: the source says "a recent 12-month span" without dates, so dates and
  the window grade are left empty.
  verify: the same article's link to an Axis Communications customer story was
  not read.
