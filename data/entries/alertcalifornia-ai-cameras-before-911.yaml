id: alertcalifornia-ai-cameras-before-911
section: because
rank: 40
headline: >-
  Because of AI-watched cameras, more than half of the wildfires flagged by
  California's ALERTCalifornia network were detected before any 911 call.
impact: "More than half flagged before any 911 call"
impact_number: "50%+"
impact_label: "of flagged wildfire incidents detected before a 911 call"
summary: >-
  A trade-press report citing CAL FIRE data says ALERTCalifornia's AI-enabled
  camera network flagged approximately 3,600 wildfire incidents in a recent
  12-month span, and more than half of those detections came before the public
  placed any 911 call, so crews could verify and deploy sooner.
caveat: >-
  A secondhand trade-press summary of agency data, with no period dates and no
  measure of fires saved or acres averted; early detection is not shown to change
  the outcome, and it does not say which detections the AI made versus people.
domain: disaster
ai_type: classic-ml
grades:
  evidence: C
  attribution: bundled
  window: null
comparison: "Time of the camera network's detection against the time of the first 911 call, across about 3,600 flagged incidents, per CAL FIRE data"
effect:
  relative: "More than half of those detections occurred before any 911 calls were placed by the public"
  absolute: "The platform flagged approximately 3,600 wildfire incidents during a recent 12-month span"
reach: "California, a network of more than 1,200 cameras"
