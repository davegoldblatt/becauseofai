what_would_change: "A randomized, multi-site trial with a named chatbot and a behavioural outcome such as measured substance use."
notes: >-
  verify: the effect sizes quoted are within-group paired effect sizes (dz); the paper's between-group comparison for knowledge is d = 1.58 in Table 2, which was not used because the table text could not be quoted exactly.
  verify: the text says changes were measured over three months while the study period runs October 2025 to February 2026.
  verify: effects of this size are unusual for an educational app; the app also bundles non-chatbot content, so the chatbot alone is not isolated.
