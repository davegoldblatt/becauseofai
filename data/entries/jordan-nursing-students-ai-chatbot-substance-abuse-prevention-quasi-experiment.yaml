id: jordan-nursing-students-ai-chatbot-substance-abuse-prevention-quasi-experiment
section: because
rank: 69
headline: >-
  Because of AI, nursing students in Jordan who used a mobile app with an AI chatbot on substance abuse prevention gained
  substantially in knowledge (within-group effect size 1.35) while a control group's scores did not change.
impact: "Knowledge effect size 1.35"
impact_number: "dz 1.35"
impact_label: "within-group knowledge gain for nursing students using an AI substance-abuse chatbot app; controls did not change"
summary: >-
  A quasi-experimental study at Jordan's largest nursing faculty gave 85 nursing students a mobile app with an AI chatbot
  and compared knowledge, attitude, practice and risk-profile scores before and after with 85 control students on the usual
  curriculum.
caveat: >-
  A nonequivalent-group design without randomization, with very large effect sizes and a chatbot that the text read does not
  describe in detail; outcomes are self-reported questionnaire scores, not substance use.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: in
comparison: "Mobile app with an AI chatbot on substance abuse prevention vs the usual nursing curriculum, 85 students per group, pre- and post-test"
effect:
  relative: "Within the intervention group, knowledge gained dz = 1.35, attitude improved dz = 1.96, and practice gained dz = 2.48; the control group showed no significant change"
  absolute: null
reach: "170 nursing students at Al-Zaytoonah University of Jordan, 85 in each group"
