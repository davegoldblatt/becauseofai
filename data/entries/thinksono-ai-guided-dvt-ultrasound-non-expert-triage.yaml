ai_type: classic-ml
grades:
  evidence: B
  attribution: only-path
  window: null
comparison: "AI-guided proximal leg compression ultrasound by non-ultrasound-trained operators with remote clinician interpretation vs imaging-specialist-performed ultrasound in the same patients"
effect:
  relative: null
  absolute: "Imaging specialist-performed ultrasounds could be avoided in 35.32% of patients; triage sensitivity 92.86%, triage specificity 39.12%"
reach: "594 patients (700 scans, 67 deep vein thromboses) analysed from 634 recruited, at multiple US centers"
