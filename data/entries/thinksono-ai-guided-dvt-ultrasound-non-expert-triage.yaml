id: thinksono-ai-guided-dvt-ultrasound-non-expert-triage
section: because
rank: 67
headline: >-
  Because of AI guidance, operators with no ultrasound training could scan for deep vein thrombosis, and a specialist
  ultrasound could be avoided in 35.32% of patients, with triage sensitivity of 92.86%.
impact: "Specialist scan avoidable in 35.32%"
impact_number: "35.32%"
impact_label: "of patients could skip a specialist-performed ultrasound after an AI-guided scan by a non-expert"
summary: >-
  A multicenter prospective study of 594 patients compared AI-guided leg compression ultrasounds acquired by non-trained
  operators and read remotely against imaging-specialist ultrasounds, and reports triage sensitivity, specificity and the
  share of specialist scans that could be avoided.
caveat: >-
  Nonrandomized, vendor-funded, with vendor employees among the authors; only the abstract could be read; triage specificity
  was 39.12%, and the 35.32% is an estimate of scans that could be avoided rather than scans actually avoided.
