    url: https://www.medrxiv.org/content/10.64898/2026.05.20.26348577v1.full
    doi: 10.64898/2026.05.20.26348577
    type: primary
  - title: "ClinicalTrials.gov NCT06017843: SPOT-TB (Centre for Global Public Health Pakistan)"
