    type: primary
conflicts: >-
  Funded by the Gates Foundation, which advised on design and reviewed the
  manuscript; sponsored by the Centre for Global Public Health Pakistan, the
  first author's institution, with Mercy Corps, the national programme's
  implementing partner, whose staff are co-authors. The authors declare no
  competing interests.
what_would_change: "A trial in which teams actually screen at the recommended sites (the validated per-protocol result) and that shows the gain under intention to treat."
notes: >-
  Filed under not-because on the registered primary analysis (intention to
  treat). The per-protocol result is real but chosen after randomization by
  adherence, so it cannot carry a "because" headline; the paper's own
  interpretation leads with it.
  The unadjusted means run the other way (0.85 vs 0.94 per camp); the adjusted
  1.07 accounts for time trends in a stepped-wedge design. Both are shown.
  Evidence A argued: registered on ClinicalTrials.gov on 30 August 2023, before
  the randomized switches began in October 2023, with yield of TB cases per
  camp as the aim; a preprint, so it may change in review.
  Window pre: camps ran August 2023 to September 2024.
  verify: whether the Centre for Global Public Health Pakistan or its staff
  developed MATCH-AI (the paper calls it "commercially available software"
  and cites its model description without naming the developer).
