id: spot-tb-ai-camp-targeting-null
section: not-because
rank: 7
headline: >-
  Sending Pakistan's mobile TB X-ray camps to sites picked by AI did not find
  significantly more tuberculosis per camp than sites picked by field staff,
  across 3,936 camps and 269,254 people screened, in the trial's primary
  analysis.
impact: "Null on TB found per camp (cluster RCT, ITT)"
impact_number: "+7%"
impact_label: "TB cases found per camp with AI-picked sites, not significant"
summary: >-
  A stepped-wedge cluster RCT (medRxiv preprint, May 2026) moved 30 mobile chest
  X-ray van teams in 68 Pakistani districts, in random order, from staff-chosen
  camp sites to sites recommended by MATCH-AI, a Bayesian TB-hotspot model,
  between August 2023 and September 2024; in the intention-to-treat analysis,
  bacteriologically confirmed TB found per camp did not differ significantly,
  and no secondary outcome did either.
caveat: >-
  Teams often did not go where the AI pointed: only 613 of 1,890 intervention
  camps were verified within 5 km of a recommended site, and in those camps
  yield was 32% higher, so the null may reflect adherence more than the model.
  Not yet peer reviewed.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Camp sites guided by MATCH-AI hotspot predictions vs conventional site selection by district field staff, stepped-wedge randomization of 30 van teams"
effect:
  relative: "Camp positivity yield 7% higher, not significant (adjusted RR 1.07, 95% CI 0.94–1.22); in camps verified within 5 km of an AI site, 32% higher (adjusted RR 1.32, 1.12–1.54)"
  absolute: "Mean bacteriologically confirmed TB cases per camp 0.85 with AI-guided teams vs 0.94 in control, before adjustment for time"
reach: "269,254 people screened at 3,936 camps in 68 districts of Pakistan, by 30 mobile X-ray vans"
dates:
  achieved_start: 2023-08
  achieved_end: 2024-09
  published: 2026-05
  added: 2026-11-09
  updated: 2026-11-09
sources:
