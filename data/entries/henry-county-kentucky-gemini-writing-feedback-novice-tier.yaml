id: henry-county-kentucky-gemini-writing-feedback-novice-tier
section: because
rank: 126
headline: >-
  Henry County Public Schools in Kentucky says 33% of students were in the novice tier
  on state writing assessments before teachers used Gemini for rubric-aligned
  feedback, and 15% of students advanced out of that tier afterwards.
impact: "15% of students moved out of the novice writing tier after Gemini-supported feedback (district report)"
impact_number: "15%"
impact_label: "of students advanced out of the novice writing tier after Gemini-supported feedback, from 33% in it before"
summary: >-
  The district's superintendent, writing on Google's blog, says high-school teachers
  with about 180 students each used Gemini, checked against the state rubric, to draft
  writing feedback that teachers reviewed before students saw it. He reports the share
  of students in the lowest (novice) tier on state assessments before and after.
caveat: >-
  The district's own account on the vendor's blog; a before and after comparison with
  no control group and no dates; teachers reviewed the feedback, so this is AI plus
  teacher; the post does not say how many students were involved.
