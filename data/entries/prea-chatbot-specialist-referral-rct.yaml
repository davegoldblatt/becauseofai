sources:
  - title: "Nature Medicine: An LLM chatbot to facilitate primary-to-specialist care transitions: a randomized controlled trial (open access, PMC)"
    url: https://pmc.ncbi.nlm.nih.gov/articles/PMC13004692/
    doi: 10.1038/s41591-025-04176-7
    type: primary
conflicts: >-
  Two authors are employees of WeChat AI (Tencent), which provided computational
  resources and technical support; the chatbot runs on OpenAI's GPT-4o mini.
  Public research funding; no other competing interests declared.
what_would_change: "A trial with a clinical outcome (diagnostic accuracy, time to treatment, follow-up visits) or with a nurse-led pre-assessment as the control."
notes: >-
  verify: the trial is registered as ChiCTR2400094159; the ID suggests
  registration in 2024, before recruitment began on 8 Feb 2025, but the
  registry record was not read, so evidence A rests on the paper's account of
  prespecified primary end points.
  Shorter is not automatically better for a patient. The paper found no
  systematic change in specialists' clinical notes (classifier F1 0.57), and in
  a matched-pairs analysis (not randomized) participating specialists saw more
  patients per shift with unchanged waiting times. Patient-experience outcomes
  were self-reported by unmasked participants. Window is pre: recruitment ended
  30 April 2025, six months before the window opened; the paper was published
  online 19 January 2026.
