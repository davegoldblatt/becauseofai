id: prea-chatbot-specialist-referral-rct
section: because
rank: 19
headline: >-
  Because of AI, specialist consultations at two hospitals in western China took
  3.14 minutes instead of 4.41 when patients first gave their history to a
  chatbot, and patients rated communication easier.
impact: "3.14 vs 4.41 min per visit"
impact_number: "3.14 min"
impact_label: "per specialist visit after a chatbot took the history, vs 4.41 min without"
summary: >-
  A three-arm randomized trial (February–April 2025) at two tertiary hospitals
  in Guilin and Gansu assigned 2,069 patients to talk to PreA, a GPT-4o mini
  chatbot that takes a history, suggests diagnoses and tests, and writes a
  referral report, before seeing one of 111 specialists, or to usual care. With
  the chatbot used alone, consultations were 28.7% shorter, specialists rated
  care coordination higher, and patients rated communication easier; using it
  with staff help made no difference.
caveat: >-
  The benefit is time and experience, not health: no clinical outcomes were
  measured, patients knew their arm and rated their own experience, and the
  control had no pre-assessment of any kind rather than a nurse-led one.
domain: medicine
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "PreA chatbot used alone before the specialist visit vs usual care with no pre-assessment (routine report of age and sex only), 1:1:1 randomization with a third staff-assisted PreA arm"
effect:
  relative: "28.7% shorter consultations (95% CI 22.7–34.8); patient-rated ease of communication 16.0% higher"
  absolute: "3.14 vs 4.41 minutes per consultation; ease-of-communication score 3.99 vs 3.44 on a five-point scale"
reach: "2,069 patients and care partners analysed, 111 specialists in 24 disciplines, two tertiary hospitals in western China"
