id: feinstein-double-neural-bypass-rl-grasp-tetraplegia
section: because
rank: 81
headline: >-
  Because of a deep reinforcement-learning grip controller in a brain-computer interface, a man with complete
  tetraplegia kept his grasp force within the set limit in 87% of trials, against 27% without it.
impact: "Grip force kept in limit: 87% vs 27% of trials"
impact_number: "87% vs 27%"
impact_label: "of grasp trials kept within the force limit with the AI controller on versus off, one participant"
summary: >-
  In a first-in-human trial at the Feinstein Institutes, a man with complete tetraplegia used a brain implant whose
  decoder and deep reinforcement-learning agent drove stimulation of his own hand, and grip control was compared with
  the agent on and off.
caveat: >-
  A single participant in a first-in-human trial, with five sessions per condition. The paper's other gains (arm
  strength, restored touch) come from spinal and cortical stimulation therapy, not from the AI alone.
