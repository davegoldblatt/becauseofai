id: chongqing-ai-boppps-cbl-neurology-interns-rct
section: because
rank: 44
headline: >-
  Because of AI, junior-college medical interns on a neurology rotation in Chongqing who got DeepSeek-supported
  case-based teaching scored higher on a simulated neurological-emergency assessment than interns on conventional
  teaching, in a randomized study of 118 interns.
impact: "Higher simulated-emergency score (RCT)"
impact_number: "82.07 vs 76.43"
impact_label: "mean score on a simulated neurological-emergency assessment, AI-supported vs conventional teaching"
summary: >-
  Interns were randomized within each monthly rotation batch to AI-supported or conventional BOPPPS case-based
  learning, and their scores on a four-station simulated neurological-emergency assessment were compared.
caveat: >-
  The outcome is a locally developed simulated assessment, not patient care; the study was not prospectively
  registered, and the AI arm also had faculty supervision and structured prompts, so the package is what was tested.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: in
comparison: "AI-supported BOPPPS-CBL (standardized DeepSeek prompts under faculty supervision) vs conventional BOPPPS-CBL, individually randomized within monthly rotation batches"
effect:
  relative: null
  absolute: "Adjusted between-group difference 5.67 points (95% CI 2.86-8.49) on a 0-100 simulated-emergency score"
reach: "118 junior-college medical interns on a one-month neurology rotation at one district hospital, Chongqing"
