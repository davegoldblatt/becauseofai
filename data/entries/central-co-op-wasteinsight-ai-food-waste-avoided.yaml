id: central-co-op-wasteinsight-ai-food-waste-avoided
section: because
rank: 77
headline: >-
  Because of Retail Insight's AI markdown system, Central Co-op says it avoided 8,796
  tonnes of food waste and sold 32,449,817 reduced-to-clear items across its stores.
impact: "8,796 tonnes of food waste avoided"
impact_number: "8,796 t"
impact_label: "of food waste avoided across Central Co-op stores, retailer says"
summary: >-
  Central Co-op, a UK retail co-operative, and its vendor Retail Insight report that the
  WasteInsight AI system, which sets markdowns from expiry and stock data, avoided 8,796
  tonnes of food waste and saved 20,977,826 meals.
caveat: >-
  A retailer-and-vendor press release, with no baseline waste figure, no description of how
  "avoided" and "meals saved" were calculated, and no separation of the AI's effect from
  staff action on its prompts.
