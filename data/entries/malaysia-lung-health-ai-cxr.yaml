id: malaysia-lung-health-ai-cxr
section: because
rank: 29
headline: >-
  Because of AI-assisted chest X-rays, Malaysia's lung health pilot screened
  14,350 people at seven clinics and found abnormal results in 25.5%, a third
  of them with lung nodules now being assessed for cancer and TB.
impact: "14,350 screened, 25.5% abnormal"
impact_number: "25.5%"
impact_label: "of 14,350 people screened with AI-assisted chest X-rays had abnormal findings"
summary: >-
  The Health Ministry told The Star that its National Lung Health Initiative
  pilot, which pairs AI-assisted chest X-ray with spirometry and TB testing at
  health clinics, screened 14,350 people, and the programme has now gone
  nationwide.
caveat: >-
  A ministry statement to a newspaper: it reports how many were screened and
  flagged, not how many cancers or TB cases were confirmed, and gives no
  comparison or dates.
