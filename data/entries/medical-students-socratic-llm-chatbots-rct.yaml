id: medical-students-socratic-llm-chatbots-rct
section: because
rank: 65
headline: >-
  Because of AI, third-year medical students who spent 10 minutes with two Socratic-prompted GPT-3.5 chatbots gained 8.9 points on a
  15-question test, against 3.7 points for students who read the textbook for the same time, in a randomised trial.
impact: "Larger test gain after 10 minutes with Socratic chatbots (RCT)"
impact_number: "+8.9 vs +3.7"
impact_label: "points gained on a 15-question test, chatbot group vs textbook-reading group"
summary: >-
  Forty third-year medical students were randomised to use two chatbots built on a medical-school textbook corpus and prompted to
  teach by Socratic questioning, or to read the textbook, for 10 minutes, and took the same test before and after.
caveat: >-
  Only the abstract was readable. A single 10-minute session, 40 students, a short test and GPT-3.5; the outcome is a test score, not
  later learning or patient care, and the authors say more studies are needed.
