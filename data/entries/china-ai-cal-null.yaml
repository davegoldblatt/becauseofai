id: china-ai-cal-null
section: not-because
rank: 4
headline: >-
  AI-personalized computer-assisted learning did no better than non-personalized
  software for 8,647 rural Chinese primary students.
impact: "Null vs active control"
summary: >-
  Stanford REAP and collaborators randomized 315 classes in 105 Sichuan schools
  to AI-personalized CAL, non-personalized CAL, or non-CAL activities; the AI arm
  showed no improvement in any ability tercile and may have been worse than
  plain CAL for the middle tercile.
caveat: >-
  One AI product, one province; the active-control design is exactly what the
  Sierra Leone trial lacked.
domain: education
ai_type: classic-ml
