notes: >-
  Intervention dates come from the AEA registry (AEARCTR-0007888, PI Loyalka), whose
  sample matches the paper exactly (105 schools, 315 classes, 8,647 students, three
  class-level arms): intervention 4 April to 14 June 2021. Window is pre on either
  reading below.
  verify: a secondary account of a 2025 talk calls it a year-long trial, so confirm
  the intervention period against the paper's methods. The SSRN page returned 403
  and the CESifo PDF would not extract for the run.
  verify: the registry was first registered on 28 June 2021, after the intervention
  ended, so the primary endpoint was not strictly preregistered. Evidence A is
  arguable; the editor should decide whether it stays.
