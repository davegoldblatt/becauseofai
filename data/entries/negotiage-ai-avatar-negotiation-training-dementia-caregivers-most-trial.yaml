id: negotiage-ai-avatar-negotiation-training-dementia-caregivers-most-trial
section: because
rank: 159
headline: >-
  Because of an AI negotiation-practice program with conversational avatars, family caregivers of people with
  Alzheimer's dementia reported less burden and less negative affect one month later, in a randomized factorial trial
  with no untreated comparison group.
impact: "Less caregiver burden after training"
impact_number: "−3.24"
impact_label: "points on caregiver burden, baseline to one month after NegotiAge (no control group)"
summary: >-
  Family caregivers practiced conflict negotiation with AI avatars in the online NegotiAge program, and burden and
  negative affect were compared between baseline and one month after.
caveat: >-
  The headline change is before versus after in a trial that randomized which exercises caregivers got, so there is no
  group that received no training and the change may include expectation and time.
