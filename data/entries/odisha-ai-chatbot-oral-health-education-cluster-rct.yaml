id: odisha-ai-chatbot-oral-health-education-cluster-rct
section: because
rank: 63
headline: >-
  Because of AI, adults in rural Odisha villages who got four weeks of chatbot-guided oral health education over WhatsApp
  went from 28% to 64% brushing twice daily, against 30% to 37% in control villages given a health talk and leaflet.
impact: "Twice-daily brushing 28% to 64%"
impact_number: "28% → 64%"
impact_label: "of adults brushing twice daily after chatbot oral health education, against 30% → 37% in control villages"
summary: >-
  Ten villages received a four-week AI chatbot oral health course on WhatsApp and ten received a one-time health talk and a
  printed leaflet, and knowledge, brushing habits and an oral hygiene index were compared before and after.
caveat: >-
  Four-week, short-term outcomes only; the paper gives inconsistent participant counts (1,000, 1,500 and 500 per group in
  different places), reports no cluster adjustment or trial registration, and the chatbot's design is not described.
domain: medicine
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: pre
comparison: "Four weeks of AI chatbot-delivered oral health education via WhatsApp/IVR in 10 villages vs a one-time health talk and printed leaflet in 10 control villages"
effect:
  relative: null
  absolute: "Twice-daily brushing rose from 28% to 64% with the chatbot vs from 30% to 37% in controls"
reach: "1000 adult participants from 20 villages in rural Odisha, India (10 intervention, 10 control)"
dates:
