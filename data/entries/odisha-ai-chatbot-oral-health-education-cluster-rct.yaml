    type: primary
conflicts: "The authors declare no conflicts of interest and no funding. The article states no AI tools were used in writing or analysis."
what_would_change: "A registered, cluster-adjusted trial with follow-up beyond four weeks that confirms the brushing and oral hygiene gains."
notes: >-
  verify: the abstract says 1000 participants, the Methods say 1500 screened with 500 excluded and then 500 per group; these are not reconciled.
  verify: the abstract reports the knowledge score rising from 9.8 to 15.2 while Table 3 reports a +5.4 change; no trial registration is mentioned, so evidence is graded B.
  verify: the chatbot is called AI-based but its model and design are not described in the text read.
