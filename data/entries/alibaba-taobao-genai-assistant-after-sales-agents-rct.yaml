id: alibaba-taobao-genai-assistant-after-sales-agents-rct
section: because
rank: 95
headline: >-
  Because of a generative AI assistant that drafts issue diagnoses and solutions, new Taobao
  after-sales agents randomly given access cut issue-identification time by 8.2% and raised
  customer ratings, with no change in customer retrials.
impact: "Issue identification 8.2% faster; ratings +0.042 on a five-point scale"
impact_number: "8.2%"
impact_label: "shorter time to identify a customer's issue for new agents given the AI assistant (3.2 seconds)"
summary: >-
  A working paper by university researchers and an Alibaba employee reports a four-week
  randomized A/B test in Alibaba's Taobao after-sales chat support. 5,940 agents with under a
  year of tenure were randomly assigned to have, or not have, an assistant that drafts a
  diagnosis and solution proposal at the start of a chat. Access sped up the opening stage and
  raised ratings but did not change three-day retrials.
caveat: >-
  A preprint, not peer-reviewed, written with an Alibaba employee about Alibaba's own
  assistant. The gains are small (chat duration fell 1.1%), the effect on three-day customer
  retrials is near zero and not significant, and the authors report that top-performing agents
  did worse with the tool. Only agents with under a year of tenure were included.
domain: work
ai_type: generative
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Agents randomly assigned to the AI assistant (2,895) vs agents randomly assigned to no assistant (3,045), same Taobao after-sales chat service"
effect:
  relative: "Access reduced issue identification time by 8.2% and chat duration by 1.1%; dissatisfaction rate down 3.4% relative to the pretreatment mean"
  absolute: "Issue identification time down 3.2 seconds and chat duration down 5.7 seconds; customer ratings up 0.042 points on a five-point scale; three-day retrial rate effect near zero and not significant"
reach: "5,940 new customer service agents handling approximately 2.56 million chats"
dates:
  achieved_start: 2024-01-23
