sources:
  - title: "Ni, Wang, Feng, Lu, Wang and Zhou: Generative AI in Action: Field Experimental Evidence from Alibaba's Customer Service Operations (arXiv 2603.29888, July 2026 version)"
    url: https://arxiv.org/pdf/2603.29888
    type: primary
conflicts: >-
  The study was run in collaboration with Alibaba, which operates the platform and the assistant;
  one author is affiliated with Alibaba Group. The paper is a preprint.
what_would_change: "A peer-reviewed version or replication by authors independent of the platform, with longer follow-up and agent-level outcomes beyond the first year of tenure."
notes: >-
