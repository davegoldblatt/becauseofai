conflicts: >-
  Mayo Clinic licensed the ECG model to Anumana; several authors may benefit
  through a related patent, and two sit on Anumana's scientific advisory board.
what_would_change: "Follow-up showing that the extra diagnoses led to surveillance, treatment, or fewer decompensations would turn a detection gain into a health gain."
