id: advance-ai-ecg-liver
section: because
rank: 17
headline: >-
  Because of AI, primary care teams at Mayo Clinic diagnosed advanced liver
  disease in about 5 more patients per 1,000 adults who had a routine ECG.
impact: "Liver disease diagnoses doubled (RCT)"
impact_number: "2×"
impact_label: "advanced liver disease diagnoses (5 more per 1,000)"
summary: >-
  The Advance trial (Nature Medicine, Dec 2025) cluster-randomized 98 primary
  care teams; when an ECG-reading model flagged likely advanced chronic liver
  disease, clinicians were notified, and new diagnoses within 180 days were 1.0%
  vs 0.5% among 15,596 adults with ECGs (78 of 8,034 vs 35 of 7,562).
caveat: >-
  The outcome is a diagnosis, not better health: whether earlier diagnosis
  changed treatment or survival was not measured, clinician follow-through was
  uneven, and the trial ran 2023–2025.
domain: medicine
ai_type: classic-ml
grades:
  evidence: A
  attribution: isolated
  window: pre
comparison: "Care teams notified of AI-ECG results vs usual care, cluster-randomized 1:1 across 45 primary care practices; primary endpoint new advanced chronic liver disease diagnosis within 180 days"
effect:
  relative: "OR 2.09 (95% CI 1.22–3.55) for a new diagnosis"
  absolute: "0.97% vs 0.46% (registry counts 78/8,034 vs 35/7,562): about 5 more diagnoses per 1,000 patients"
reach: "15,596 adults, 98 care teams, 45 Mayo Clinic primary care practices"
dates:
