conflicts: >-
  The source is a government case study of the DVLA's own project. The tool is Salesforce's
  Einstein Chatbot, and the DVLA received 30,000 free chatbot conversations a month from the
  supplier as part of its pilot. No independent audit.
what_would_change: "Published before-and-after handling times for the same webchat queues, with the period measured, separating the chatbot from the webchat rollout."
notes: >-
