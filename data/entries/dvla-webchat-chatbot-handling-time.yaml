id: dvla-webchat-chatbot-handling-time
section: because
rank: 74
headline: >-
  Because of an AI chatbot on its webchat, the DVLA says average handling time fell from 8
  minutes to 2 minutes 30 seconds and 25% to 30% of queries needed no adviser.
impact: "Handling time 8 min to 2 min 30 s"
impact_number: "25–30%"
impact_label: "of customer queries answered by the DVLA chatbot without an adviser"
summary: >-
  The UK Driver and Vehicle Licensing Agency added a Salesforce Einstein chatbot to its webchat
  service from 2018. A Government Digital Service case study reports a lower average handling
  time and that the chatbot answers a quarter to a third of queries without an adviser.
caveat: >-
  A government case study of the agency's own pilot, published in 2020. It gives no comparison
  group or measurement period, and the effect is reported for the chatbot and webchat
  together. The chatbot is an earlier-generation NLP system, not generative AI.
