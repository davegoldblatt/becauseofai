id: bbva-italy-germany-contact-centre-ai-copilots-handling-time
section: because
rank: 94
headline: >-
  Because of two generative AI copilots drafting answers for its contact-centre agents, BBVA
  says average handling time for the most common customer enquiries in Italy and Germany fell
  by more than 15%.
impact: "Handling time cut by more than 15%"
impact_number: ">15%"
impact_label: "shorter average handling time for common enquiries at BBVA's Italy and Germany contact centres"
summary: >-
  BBVA's contact-centre teams in Italy and Germany built two AI assistants that turn the bank's
  internal knowledge into a draft reply for the agent, who reviews it before sending. The bank
  reports a lower average handling time for routine enquiries and that more than 260 agents use
  the tool daily.
caveat: >-
  The bank's own announcement, with no baseline period, comparison group, quality or
  repeat-contact measure, and no independent audit. The figure covers common enquiry types only.
  Agents review every draft, so the gain is the agents' time, not automated resolution.
