id: chatgpt-concept-mapping-orthopaedic-nursing-students-critical-thinking-quasi-experiment
section: because
rank: 124
headline: >-
  In a two-group study of orthopaedic nursing students, critical-thinking scores rose from 2.40 to 2.97 after a
  workshop using ChatGPT for concept mapping, against 2.43 to 2.57 in a control group with standard teaching.
impact: "Students' critical-thinking scores rose more with AI concept mapping"
impact_number: "2.97"
impact_label: "mean critical-thinking score after AI-assisted concept mapping, vs 2.57 in the control group"
summary: >-
  Undergraduate students in an orthopaedic nursing course were allocated to a workshop in which they used ChatGPT to
  build concept maps or to standard instructional activities, and a 12-item concept-map-based tool scored their
  critical thinking before and after.
caveat: >-
  Abstract only. Allocation was not randomized, the groups differ in the workshop as a whole and not only in the AI,
  the scale is a locally validated tool, and the abstract does not say when the course ran.
domain: education
ai_type: generative
