summary: >-
  A UC San Diego news story on its faculty AI symposium says a team built ASPIRE,
  an AI tutor embedded in homework, practice and test-preparation assignments, and
  that the failure rate in Foundations of Precalculus dropped after a
  comprehensive instructional redesign that included the tutor.
caveat: >-
