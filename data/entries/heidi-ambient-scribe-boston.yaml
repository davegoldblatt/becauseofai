id: heidi-ambient-scribe-boston
section: because
rank: 23
headline: >-
  Because of AI, outpatient clinicians in a 14-hospital Boston health system who
  enrolled in the Heidi ambient scribe spent 1.21 minutes less on each note,
  though their after-hours note work did not change.
impact: "1.21 min less per note"
impact_number: "−1.21 min"
impact_label: "note-writing time per visit; after-hours work unchanged"
summary: >-
  A retrospective interrupted-time-series study (Annals of Internal Medicine,
  October 2026) of 902 outpatient clinicians who enrolled in the Heidi ambient
  AI scribe after a system-wide rollout from January 2025 found an immediate
  drop in time spent in notes per encounter, larger among heavy users, and
  longer notes, with no change in same-day or after-hours note closure or in
  billed work.
caveat: >-
  Observational, with the authors noting possible unmeasured confounding; a
  minute per note is modest, burnout and patient outcomes were not measured,
  and the study cannot tell AI-written from clinician-written notes; only the
  abstract could be read.
domain: work
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: ongoing
comparison: "Each enrolled clinician's own notes before vs after Heidi enrollment (interrupted time series adjusted for patient demographics and visit complexity), plus enrolled non-users vs low and high users"
effect:
  relative: null
  absolute: "Note-active time −1.21 minutes per encounter after enrollment (95% CI −1.74 to −0.68); −2.50 minutes among high users; no difference in same-day or after-hours closure or wRVUs"
reach: "902 outpatient clinicians (605 users) and 1,637,227 encounters in a 14-hospital Boston health system"
dates:
  achieved_start: 2025-01
  achieved_end: 2026-01-31
  published: 2026-10-27
  added: 2026-11-09
  updated: 2026-11-09
sources:
  - title: "Annals of Internal Medicine: Impact of Unrestricted Artificial Intelligence Scribe Deployment in a Single Health System on Clinician Workload and Productivity — A Quality Improvement Study (Booth et al.), abstract via Europe PMC"
    url: https://www.ebi.ac.uk/europepmc/webservices/rest/search?query=DOI:10.7326/ANNALS-25-05294&resultType=core&format=xml
    doi: 10.7326/ANNALS-25-05294
    type: primary
conflicts: >-
  One co-author is affiliated with Heidi Health, the maker of the scribe; the
  others are Beth Israel Deaconess and Beth Israel Lahey Health staff
  evaluating their own system's rollout. The abstract states no primary
  funding source.
what_would_change: "Patient-facing or burnout outcomes, a randomized or staggered-control design, or the full text showing the minute-per-note estimate is fragile."
notes: >-
  Window argued as ongoing: the scribe was rolled out from January 2025 and the
  data run to 31 January 2026, so the benefit began before the window that
  opened on 9 November 2025 and the study carries about three months of
  in-window data; whether it continues is not reported.
  Attribution isolated: the comparison is each clinician before and after
  access to the scribe with nothing else bundled in; the observational design
  is reflected in evidence B, not in attribution.
  Placed as reasonable: the Annals page and the gate's Europe PMC route have no
  full text, so the numbers come from the abstract. The full text would raise
  it.
  Compare ambient-scribes-nejm-ai (randomized, burnout outcomes).
related: [ambient-scribes-nejm-ai, ucla-chart-summarizer-rct]
history:
