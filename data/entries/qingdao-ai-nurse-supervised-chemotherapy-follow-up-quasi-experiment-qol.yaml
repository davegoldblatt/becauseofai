id: qingdao-ai-nurse-supervised-chemotherapy-follow-up-quasi-experiment-qol
section: because
rank: 105
headline: >-
  Because of AI, 96 patients on chemotherapy in Qingdao who got a nurse-supervised AI follow-up system reported quality of life
  5.88 points higher than 93 patients on conventional follow-up.
impact: "Quality of life +5.88 points"
impact_number: "+5.88"
impact_label: "points higher global quality of life with nurse-supervised AI follow-up during chemotherapy (adjusted)"
summary: >-
  A prospective, non-randomized study at a Chinese hospital allocated chemotherapy patients to a nurse-supervised follow-up
  system (rule-based risk alerts plus DeepSeek-based message support) or to routine telephone and clinic follow-up, and compared
  self-reported quality of life, self-management and satisfaction.
caveat: >-
  Allocation was by patient preference and scheduling, not randomization; self-management and satisfaction were measured with
  study-specific questionnaires that were not psychometrically validated; single centre; short-term outcomes only.
domain: medicine
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: pre
comparison: "Nurse-supervised AI-assisted digital follow-up system vs conventional care (routine telephone follow-up and outpatient visits), non-randomized"
effect:
  relative: null
  absolute: "Global health status/QoL scale (EORTC QLQ-C30), adjusted mean difference 5.88 points (95% CI 5.71 to 6.05) in favour of the AI-assisted group"
reach: "189 patients undergoing chemotherapy at the Affiliated Hospital of Qingdao University"
