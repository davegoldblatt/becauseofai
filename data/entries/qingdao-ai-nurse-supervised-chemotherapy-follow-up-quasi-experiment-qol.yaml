conflicts: >-
  The authors declare no commercial or financial relationships and no financial support. The authors built and ran the system
  they evaluated; the large language model used is DeepSeek.
what_would_change: "A randomized multicentre trial, as the authors themselves call for, with validated outcome instruments."
notes: >-
  verify: the system bundles rule-based alerts, nurse review and LLM-assisted messaging, so the LLM alone is not isolated.
  verify: effect sizes are very large for this kind of intervention; the authors treat them as adjusted associations, not causal effects.
  verify: the paper says the study ran January to June 2024; the outcome was measured at the end of the intervention period for each patient.
