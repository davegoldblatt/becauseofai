id: fluix-ai-cooling-tenhats-knoxville-data-center-pue
section: because
rank: 134
headline: >-
  Because of AI cooling control, a Knoxville data centre's PUE improved from 1.36
  to 1.27, FLUIX reports.
impact: "PUE 1.36 to 1.27"
impact_number: "6.6%"
impact_label: "better power usage effectiveness at a data centre under AI cooling control"
summary: >-
  FLUIX AI says its autonomous cooling controller, running a 2 MW Knoxville data
  centre's cooling for several months, moved power usage effectiveness from 1.36
  to 1.27 with no service-level excursions.
caveat: >-
  The vendor's own press release about its own product; the HVAC saving is
  modeled rather than metered, and the larger power-headroom and revenue figures
  are projections.
