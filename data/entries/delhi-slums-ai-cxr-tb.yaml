id: delhi-slums-ai-cxr-tb
section: because
rank: 28
headline: >-
  Because of AI-read chest X-rays, Delhi's slum screening programme confirmed TB
  in 877 people among 168,568 residents screened.
impact: "877 TB cases confirmed in slum screening"
impact_number: "877"
impact_label: "people with TB confirmed among 168,568 slum residents screened with AI-read chest X-rays"
summary: >-
  Delhi's TB elimination programme used Qure.ai to read chest X-rays taken at
  community camps across 349 urban slum clusters; people flagged were offered
  sputum collection and molecular testing, which confirmed TB in 877 people.
caveat: >-
  A programme report with no comparison group, so it does not show how many of
  these cases symptom-based screening would have found; read from a news report
  of the paper, not the paper.
