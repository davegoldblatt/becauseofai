sources:
  - title: "Cui, Demirer, Jaffe, Musolff, Peng and Salz: The Effects of Generative AI on High-Skilled Work: Evidence from Three Field Experiments with Software Developers (draft, February 2025)"
    url: https://economics.mit.edu/sites/default/files/inline-files/draft_copilot_experiments.pdf
    type: primary
conflicts: >-
  Two authors are at Microsoft, which owns GitHub, the maker of Copilot, and the Microsoft
  experiment was run inside Microsoft. The paper thanks employees of Microsoft, GitHub and
  Accenture for data. The randomized trial was post-registered as AEARCTR-0014530.
what_would_change: "A replication by authors independent of the vendor measuring code quality and longer-run output, with higher adoption."
notes: >-
  verify: the draft read is dated February 2025; the journal version (Management Science,
  doi 10.1287/mnsc.2025.00535) returned HTTP 403, so numbers may differ in the final version.
  verify: the Accenture experiment started in the last week of July 2023 and the Anonymous
  Company experiment in October 2023, but the Microsoft start date and a common end date are not
  given, so achieved dates and window are left empty.
  verify: evidence B because the randomized trial was registered after it began.
