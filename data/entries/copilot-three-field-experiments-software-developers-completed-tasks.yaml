id: copilot-three-field-experiments-software-developers-completed-tasks
section: because
rank: 96
headline: >-
  Because of an AI coding assistant, software developers randomly given access at Microsoft,
  Accenture and a Fortune 100 company completed 26.08% more tasks, with a wide margin of error.
impact: "26.08% more tasks completed (SE 10.3%), pooled randomized trials"
impact_number: "+26%"
impact_label: "more completed tasks for developers given the GitHub Copilot coding assistant (SE 10.3%)"
summary: >-
  Three randomized experiments run by companies in the ordinary course of business gave a random
  subset of software developers access to GitHub Copilot. Pooled across 4,867 developers, the
  authors estimate more completed tasks among developers with the tool. Less experienced
  developers adopted the tool more and gained more.
caveat: >-
  A working-paper draft (February 2025; later published in Management Science, which the
  reader could not open). Each experiment is noisy and the pooled estimate has a standard error
  of 10.3 percentage points. Adoption among treated developers was low, the trial was
  post-registered, and completed tasks (pull requests and similar activity) are a proxy for
  output, not quality. Microsoft authors study a Microsoft-owned product.
domain: work
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: null
comparison: "Developers randomly offered access to GitHub Copilot vs developers not offered access, within each of three companies"
effect:
  relative: "26.08% increase (SE: 10.3%) in completed tasks among developers using the AI tool, pooled across three experiments"
  absolute: null
reach: null
dates:
