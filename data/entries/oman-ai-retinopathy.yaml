notes: >-
  Held: no ministry or programme report carrying these figures was found. The
  numbers reach the press as statements by the National Virtual Health Center
  to the Oman News Agency. The ministry's own page is the 17 March 2025 launch
  release (25 facilities, first phase), with no results. Coverage is
  inconsistent on whether 43,000 counts patients or retinal images; the
  waiting-time figure (62 to 8 days) covers the first seven months. The vendor
  EyRIS (Nova MSC) claimed the programme in August 2025; the ministry does not
  name a vendor. Needs a ministry report, a WHO/EMRO write-up, or a paper to stand as primary.
  The poster number (62 to 8 days) is the absolute figure behind the 87%; the
  Times of Oman (24 August 2026, readable by the gate's reader, unlike Muscat
  Daily) attributes it to the Director of the National Center for Virtual
  Health. It carries no receipt because receipts must come from a primary
  source and there is none; the search on 2026-10-25 again found no ministry,
  WHO or journal report.
