headline: >-
  Because of AI, Oman screened 43,000 diabetics for retinopathy, flagged 12,000
  for treatment, and cut specialist waiting lists by 87%.
impact: "Waitlists cut 87%"
summary: >-
  Oman's national AI diabetic-retinopathy screening program reported 43,000+
  patients screened, ~30% referred for specialist examination, an 87% reduction
  in eye-clinic waiting lists, and 43.2% lower annual operating costs.
