id: korea-claude-chatbot-infertility-stress
section: because
rank: 45
headline: >-
  Because of AI, women in infertility treatment at one Korean clinic who used a Claude-based chatbot self-management
  program showed a larger fall in perceived stress than women on usual clinic care, in a small non-randomized
  feasibility study.
impact: "Lower perceived stress (non-randomized)"
impact_number: "−5.91"
impact_label: "points on perceived stress, difference in change vs usual clinic care"
summary: >-
  A purpose-built chatbot on Claude Sonnet 4 delivered a short psychosocial program, and change in perceived stress,
  anxiety and alexithymia was compared with a first-recruited group on usual care.
caveat: >-
  Feasibility was the primary aim; allocation was by recruitment period, not randomized, the sample is very small,
  and the authors say the results do not establish effectiveness.
domain: medicine
ai_type: generative
grades:
  evidence: C
  attribution: bundled
  window: pre
comparison: "Women recruited later who received the chatbot program vs women recruited earlier on usual clinic care with no study activity, same infertility centre, pretest-posttest"
effect:
