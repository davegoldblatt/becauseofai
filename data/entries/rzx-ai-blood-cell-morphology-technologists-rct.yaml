id: rzx-ai-blood-cell-morphology-technologists-rct
section: because
rank: 70
headline: >-
  Because of AI, medical laboratory technologists at a Chinese teaching hospital who trained for two weeks on an AI platform
  with real-time probability feedback scored higher on a blood cell morphology test than colleagues who used textbooks
  and atlases, in a randomised study of 52 technologists.
impact: "Higher blood cell morphology posttest score (RCT)"
impact_number: "86.62 vs 64.77"
impact_label: "mean posttest score, AI platform vs textbook and atlas self-study"
summary: >-
  Fifty-two technologists in one hospital laboratory were randomised to the RZX AI platform or conventional
  self-directed learning for two weeks, and their scores on a 50-question image test were compared.
caveat: >-
  Small single-department study, described by its authors as preliminary; the outcome is a test score, not laboratory
  accuracy at work; the study period is not stated; and engagement time was measured differently in the two arms.
