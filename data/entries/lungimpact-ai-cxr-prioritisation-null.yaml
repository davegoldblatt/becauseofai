    url: https://doi.org/10.1038/s41591-026-04253-5
    type: primary
  - title: "University Hospitals Birmingham: AI-driven technology does not speed up lung cancer diagnosis"
    url: https://www.uhb.nhs.uk/news-and-events/news/ai-driven-technology-does-not-speed-up-lung-cancer-diagnosis/
    type: secondary
conflicts: "Funded through an SBRI Healthcare award; no conflict affecting a null result was identified in the text read."
what_would_change: "A trial in which an AI flag automatically triggers a same-day CT and referral, which the authors propose as the next test."
notes: >-
  verify: dates are the period over which chest X-rays were performed;
  follow-up ran to 5 June 2025.
