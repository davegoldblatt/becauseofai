id: lungimpact-ai-cxr-prioritisation-null
section: not-because
rank: 12
headline: >-
  Not because of AI: prioritising abnormal chest X-rays with AI did not speed up
  lung cancer diagnosis in five English hospitals, with median times of 44 days
  against 46 days.
impact: "44 vs 46 days to diagnosis, no difference"
impact_number: "44 vs 46 days"
impact_label: "median chest X-ray to lung cancer diagnosis, with and without AI prioritisation"
summary: >-
  In the LungIMPACT randomised trial across five NHS trusts, AI flagged
  abnormal GP-requested chest X-rays for immediate radiologist review on
  randomised days; this did not shorten time to CT, to referral, to treatment,
  or to diagnosis.
caveat: >-
  AI was available in both arms and only prioritisation was randomised, so the
  trial tests whether prioritising AI flags alone speeds the pathway, not
  whether AI-assisted reading is useful; the authors say the wider pathway needs
  redesign.
domain: medicine
ai_type: classic-ml
