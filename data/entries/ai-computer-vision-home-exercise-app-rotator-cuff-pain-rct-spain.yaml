id: ai-computer-vision-home-exercise-app-rotator-cuff-pain-rct-spain
section: because
rank: 121
headline: >-
  Because of AI, fewer adults with rotator cuff-related shoulder pain needed
  further healthcare after physiotherapy (3 vs 10 participants) when an AI
  home-exercise app with real-time computer-vision feedback was added, in a
  randomized trial of 46.
impact: "3 vs 10 needing further care"
impact_number: "3 vs 10"
impact_label: "participants needing post-treatment healthcare, with vs without the AI exercise app"
summary: >-
  In a single-centre, assessor-blinded randomized trial, adults with rotator cuff-related
  shoulder pain had 12 weeks of conventional physiotherapy with or without an
  AI app that watches exercise with computer vision; pain, function, fear-avoidance and
  later healthcare use favoured the app group on several time points.
caveat: >-
  Only 46 people at one centre, and only the abstract could be read, so dates,
  registration, funding and any vendor ties are not confirmed; benefits appeared at
  some weeks and not others.
