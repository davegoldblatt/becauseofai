id: mgb-neurology-portal-message-routing
section: because
rank: 34
headline: >-
  Because of an AI tool that categorizes and routes patient portal messages, the
  median time to first action in a Boston epilepsy clinic fell from 11.3 hours
  to 1.0 hour.
impact: "Messages acted on in about 1 hour, down from 11"
impact_number: "11.3 → 1.0 h"
impact_label: "median weekly time to first action on epilepsy portal messages, Site A"
summary: >-
  Two Mass General Brigham neurology sites switched on Epic's AI message
  categorization and routing in their epilepsy divisions in April 2026. A
  controlled interrupted time series against volume-matched neurology divisions
  found much faster first action on patient messages, but no significant change
  in time to closure.
caveat: >-
  A medRxiv preprint with 7 weeks of follow-up at one site and 4 weeks at the
  other; only the epilepsy division of two sites was studied, and time to
  closure did not significantly improve.
domain: medicine
ai_type: classic-ml
grades:
  evidence: B
  attribution: isolated
  window: in
comparison: "Epilepsy division vs two message-volume-matched neurology control divisions, before and after the April 2026 switch-on (controlled interrupted time series)"
effect:
  relative: "Immediate differential change in median weekly hours to first action at Site A of −92.5% (95% CI −97.5% to −78.0%)"
  absolute: "Median weekly time to first action fell from 11.3 hours to 1.0 hour at Site A and from 16.1 hours to 0.6 hours at Site B"
reach: "24,142 patient portal messages analysed at two neurology sites"
