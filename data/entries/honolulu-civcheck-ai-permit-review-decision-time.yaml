headline: >-
  Because of CivCheck, an AI plan-review tool, Honolulu's average permit decision time for smaller
  residential projects fell from 73 days to 32.5 days in the first quarter of 2026.
impact: "73 days to 32.5 days"
impact_number: "32.5 days"
impact_label: "average permit decision time, down from 73 days, for permits through CivCheck"
summary: >-
  HousingWire reports that Honolulu's Department of Planning & Permitting replaced its legacy
  permitting systems with CivCheck from August 2025, and that permits processed through it had a
  lower average decision time in the first quarter of 2026.
caveat: >-
  A trade-press report relaying city and vendor figures. The comparison is against the earlier
  average, with the AI tool arriving inside a wholesale system replacement, and the figure covers
  only single-family, duplex, ADU, addition and renovation permits.
