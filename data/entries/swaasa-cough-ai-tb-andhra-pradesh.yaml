id: swaasa-cough-ai-tb-andhra-pradesh
section: because
rank: 50
headline: >-
  Because of AI, community health workers in Andhra Pradesh, India, screened
  7,879 people by cough sound and found 11 TB cases, 4 of them in people with no
  symptoms.
impact: "11 TB cases in 7,879 screened"
impact_number: "11"
impact_label: "TB cases found among 7,879 screened by cough sound"
summary: >-
  In a 6-week field deployment, frontline health workers recorded coughs on
  smartphones and the Swaasa AI app flagged 780 people for confirmatory NAAT
  testing; 11 had TB, about 36% of them asymptomatic. The TB yield among those
  tested (1.41%) was about the same as a historical active case-finding yield
  (1.34%).
caveat: >-
  Descriptive feasibility study with no control group; the yield is statistically
  indistinguishable from the historical comparison, which came from a different
  cohort and pathway. Authors include employees of the maker.
domain: medicine
ai_type: classic-ml
grades:
  evidence: C
  attribution: only-path
  window: in
comparison: "Swaasa-referred NAAT yield vs historical active case-finding yield in the same two health-centre areas (different cohort and period)"
effect:
  relative: "1.41% TB yield among those referred vs 1.34% historical ACF yield (descriptive; no hypothesis test)"
  absolute: "11 TB cases confirmed of 780 referred; 7,879 screened"
reach: "7,879 people screened, East Godavari district, Andhra Pradesh"
