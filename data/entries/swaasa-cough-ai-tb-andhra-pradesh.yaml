    url: https://doi.org/10.3389/fpubh.2026.1951831
    type: primary
conflicts: >-
  Authors include employees of Salcit Technologies, which makes Swaasa; the
  deployment was a pilot under the Andhra Pradesh MedTech Innovation Challenge 2025.
what_would_change: null
notes: >-
  The authors say the comparison with historical ACF data is descriptive only and
  that they did not estimate sensitivity or specificity.
  verify: the paper gives site-level TB yields in Table 2 (7 and 4 cases) that sum to
  the pooled 11; the 36% asymptomatic figure is 4 of 11.
  verify: spirometry was done on a selected subset only, so the COPD figures are not
  used here.
