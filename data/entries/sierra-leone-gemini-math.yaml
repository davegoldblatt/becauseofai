id: sierra-leone-gemini-math
section: because
rank: 8
headline: >-
  Because of AI (plus tablets and pair work), junior secondary students in
  Sierra Leone gained about 0.26 standard deviations in math in eight weeks.
impact: "+0.26 SD in 8 weeks"
impact_number: "+0.26 SD"
impact_label: "math gain in 8 weeks; about 1.2 to 1.7 years of typical progress"
summary: >-
  A preregistered classroom-level cluster RCT of 1,763 Grade 7–8 students in 48
  classrooms across 12 Port Loko schools had treatment classes use Gemini's
  Guided Learning in pairs for about two of four weekly math lessons; the
  treatment group gained +0.258 SD on independently administered tests.
caveat: >-
  The control arm got neither tablets nor structured pair work, so the package
  was tested, not the AI; results are a Google DeepMind/Fab AI technical
  report, not a peer-reviewed paper.
