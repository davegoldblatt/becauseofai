conflicts: "Google.org funds the constellation; Muon Space builds and operates the satellites and announced the deployment."
what_would_change: "A documented detection with a timestamp ahead of other systems and a fire-agency response outcome."
notes: >-
  Deployment confirmed by the operator: launched on SpaceX Transporter-17 from
  Vandenberg on 7 July 2026, in contact with ground within 120 minutes, healthy and
  commissioning. The 16 September first-light release shows active-fire detections
  (Australia, Portugal, Oregon–Idaho) but names no agency response and gives no
  detection-time comparison, so what_would_change is not met.
  verify: "50+ planned by 2030" in the summary is not in the Google or Muon sources
  (Muon gives hourly global revisit by 2029); find the Earth Fire Alliance source or drop it.
