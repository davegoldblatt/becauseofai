id: firesat-constellation
section: not-yet
rank: 4
headline: >-
  Three FireSat satellites launched in July 2026 to spot 5×5 m fires from orbit;
  no fire-response outcome has been measured yet.
impact: "3 satellites in orbit"
summary: >-
  The Earth Fire Alliance / Google constellation's pilot already spotted small
  blazes invisible to existing satellites; the three operational satellites
  launched July 7, 2026, with 50+ planned by 2030.
caveat: >-
  Detection is not response; no published case yet of a fire contained earlier
  because of a FireSat alert.
