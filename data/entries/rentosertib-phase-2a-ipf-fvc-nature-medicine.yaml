id: rentosertib-phase-2a-ipf-fvc-nature-medicine
section: because
rank: 92
headline: >-
  In a 71-patient randomized placebo-controlled phase 2a trial of a drug whose target and molecule were both found with
  generative AI, lung function (FVC) rose +98.4 ml on 60 mg rentosertib against −20.3 ml on placebo over 12 weeks.
impact: "+98.4 ml lung function vs −20.3 ml placebo"
impact_number: "+98.4 ml"
impact_label: "mean change in forced vital capacity on 60 mg rentosertib in IPF, against −20.3 ml on placebo"
summary: >-
  Insilico's rentosertib, an inhibitor of the TNIK target and designed with generative chemistry, was tested for safety
  against placebo in idiopathic pulmonary fibrosis; forced vital capacity, a secondary endpoint, rose in the highest-dose group.
caveat: >-
  The primary endpoint was safety, not lung function; the FVC result is a secondary endpoint in small groups (17 to 18
  patients), the confidence intervals are wide, and liver toxicity led to discontinuations.
domain: medicine
ai_type: generative
grades:
  evidence: B
  attribution: bundled
  window: null
comparison: "Placebo, 12 weeks of treatment, randomized double-blind in 71 patients with idiopathic pulmonary fibrosis"
effect:
  relative: null
  absolute: "mean FVC change +98.4 ml (95% CI 10.9 to 185.9) on 60 mg once daily versus −20.3 ml (95% CI −116.1 to 75.6) on placebo"
reach: "71 patients with idiopathic pulmonary fibrosis in a multicentre trial in China"
