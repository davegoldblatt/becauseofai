conflicts: "Insilico Medicine was the study sponsor and many authors, including the corresponding author, are Insilico employees; the molecule and target were found with Insilico's own AI platform."
what_would_change: "The phase 3 trial (GENESIS-IPF-3) showing an FVC benefit against placebo over 52 weeks."
notes: >-
  verify: the Europe PMC text read gives no calendar dates for the treatment period, so achieved dates and the window
  grade are left empty. verify: evidence is graded B rather than A because the preregistered primary endpoint was safety
  and the FVC result is secondary and exploratory in size. verify: the paper's own text has the 60 mg QD arm's FVC
  result; patients also on standard antifibrotics did not show a significant change.
