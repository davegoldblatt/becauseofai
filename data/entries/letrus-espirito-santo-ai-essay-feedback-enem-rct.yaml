id: letrus-espirito-santo-ai-essay-feedback-enem-rct
section: because
rank: 132
headline: >-
  A randomised evaluation in 178 public schools in Espírito Santo, Brazil found that
  AI essay feedback on the Letrus platform raised university entrance exam scores by
  about 0.09 standard deviations, equivalent to 17 points out of 1,000.
impact: "17 more points out of 1,000 on the entrance exam essay for students given AI writing feedback (RCT)"
impact_number: "+17 pts"
impact_label: "out of 1,000 on the national university entrance exam for public school seniors given AI essay feedback, about 0.09 SD"
summary: >-
  J-PAL's case study describes a 2019 randomised evaluation of Letrus, an AI platform
  giving high-school seniors instant feedback on practice essays for the national
  entrance exam, and the state's later roll-out to all public school seniors. The
  AI-only version did as well as one that added human scorers.
caveat: >-
  Read from J-PAL's case-study summary, not the underlying paper; the 2019 pilot is
  before this window and only the year is given; the evaluation was funded by Google.org
  and run with the company and the state education department.
domain: education
ai_type: generative
grades:
  evidence: B
  attribution: isolated
  window: pre
comparison: "Students in 110 schools given the Letrus platform vs 68 comparison schools without access, score on the national university entrance exam essay"
effect:
  relative: "Both interventions increased students' entrance exam scores by about 0.09 standard deviations, closing about nine percent of the public-private school gap in essay scores"
  absolute: "17 points out of a possible 1,000 points"
reach: "178 public schools, with approximately 12,000 students in 110 schools receiving access to the platform"
