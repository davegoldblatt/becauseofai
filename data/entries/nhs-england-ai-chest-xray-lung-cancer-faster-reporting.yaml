id: nhs-england-ai-chest-xray-lung-cancer-faster-reporting
section: because
rank: 107
headline: >-
  Because of AI chest X-ray tools in half of England's NHS trusts, the government says scans are
  analysed in an average of 4 days instead of 8 for the most complex cases, and more than
  4 million patients have had a faster lung cancer diagnosis or all-clear.
impact: "Scans analysed in 4 days, not 8"
impact_number: "4 days"
impact_label: "average to analyse the most complex chest X-rays, down from 8, government says"
summary: >-
  The Department of Health and Social Care reports that AI chest X-ray tools, a second pair of
  eyes for radiologists, are in use in half of England's NHS trusts. Early data show the most
  complex scans analysed in an average of 4 days against 8 before, and the government says over
  4 million patients have had a faster diagnosis or all-clear for lung cancer.
caveat: >-
  A government press release announcing funding. It calls the data early, does not say which
  tool or tools, over what period, or how the 4 million were counted, and gives no control group.
  A separate randomised trial of AI prioritisation of chest X-rays (see the LungIMPACT entry)
  found no faster diagnosis.
