conflicts: >-
  The source is the government's own press release about a programme it funds and is expanding
  (£20 million to extend the tools to every trust). No vendor is named and there is no independent
  evaluation.
what_would_change: "A published evaluation naming the tools, the period, the number of scans, and reporting times with and without AI at the same trusts."
notes: >-
  verify: the release gives no period for the early data, so achieved dates and the window grade
  are left empty. verify: the release says "improving patient care routes" without defining how
  4 million patients were counted. verify: the randomised LungIMPACT trial (a different
  prioritisation design) found no speed-up in diagnosis.
