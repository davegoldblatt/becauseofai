      url: https://www.weather.gov/news/261102-AI-Hurricane-Forecasting
      type: primary
    - title: "Michael Lowry: Two forecast models stand out (2025 season verification)"
      url: https://michaelrlowry.substack.com/p/this-hurricane-season-two-forecast
      type: primary
    - title: "NPR: The future of hurricane forecasting is AI"
      url: https://www.npr.org/2025/11/29/nx-s1-5604290/atlantic-hurricane-season-forecast-ai-google
      type: secondary
    - title: "CNN: Why NHC bet big on AI to forecast Isaias (Oct 2026)"
      url: https://www.cnn.com/2026/10/08/weather/hurricane-isaias-ai-models-google
