- id: masai-ai-mammography
  section: because
  rank: 9
  headline: >-
    Because of AI, Swedish mammography screening found 29% more cancers with 44%
    less radiologist reading time, and 12% fewer cancers surfaced between screens.
  impact: "29% more cancers, 44% less workload"
  summary: >-
    MASAI, the first RCT of AI in cancer screening (105,934 women; Lancet, Jan 2026),
    reported interval cancers of 1.55 vs 1.76 per 1,000 with AI-supported reading
    vs standard double reading, with fewer invasive, T2+, and non-luminal-A
    interval cancers, on top of earlier results showing higher detection and lower
    workload at the same specificity.
