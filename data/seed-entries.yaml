  headline: >-
    Because of AI-assisted decision support, 10 fewer stroke patients per 1,000
    had another stroke, heart attack, or vascular death within three months.
  impact: "26% fewer vascular events"
  summary: >-
    GOLDEN BRIDGE II (BMJ, March 2026) cluster-randomized 77 Chinese hospitals and
    21,603 acute ischemic stroke patients; new vascular events at three months were
    2.9% with the AI-imaging decision-support system vs 3.9% with usual care
    (adjusted HR 0.71), with the benefit holding through 12 months.
