- id: hurricane-melissa-2025
  section: because
  rank: 1
  headline: >-
    Because of AI, the Hurricane Center called a Category 5 landfall in Jamaica
    about three days out, while Melissa was still a Category 1.
  impact: "~3 days' warning on a Cat 5"
  summary: >-
    NHC forecasters explicitly forecast Category 5 intensity while Melissa was an
    80-mph Category 1, largely on the strength of Google DeepMind's cyclone model,
    which posted the lowest track and intensity errors of any model for the 2025
    Atlantic season and kept the official forecast below its five-year average
    error while NOAA's GFS had its worst year in two decades.
  caveat: >-
    There is no lives-saved number and cannot be; the measured outcome is forecast
    skill, and the final call was made by human forecasters using the model.
  domain: disaster
  ai_type: classic-ml
  grades:
    evidence: B
    attribution: isolated
    window: in
  comparison: "DeepMind ensemble vs all other operational models and the NHC official forecast, full 2025 Atlantic season verification"
  effect:
    relative: "Lowest season track and intensity error of any model; roughly one extra day of forecast accuracy in 2023–2025 hindcasts"
    absolute: null
  reach: "Jamaica (pop. ~2.8M), Haiti, Cuba, Bahamas; 2025 Atlantic season"
  dates:
    achieved_start: 2025-10-25
    achieved_end: 2025-10-28
    published: 2025-11-29
    added: 2026-10-22
    updated: 2026-10-22
  sources:
